<!doctype html>
<html lang="zh-CN" data-studio-skin="minimal">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>工作流设置</title>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=2026.08.20.1784161005"></script>
    <script src="/static/vendor/js/lucide.js?v=2026.08.20.1784161005"></script>
    <script src="/static/js/xiaomei-shell-kernel.js?v=2026.11.09.8"></script>
    <script src="/static/js/theme.js?v=2026.11.09.10"></script>
    <script src="/static/js/i18n.js?v=2026.11.12.workflow-shell"></script>
    <link rel="stylesheet" href="/static/css/comfyui-settings.css?v=2026.11.12.workflow-shell">
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.20.1785985827">
    <link rel="stylesheet" href="/static/vendor/fluent/tokens.css?v=2026.09.21.1">
    <link rel="stylesheet" href="/static/css/fluent-ui.css?v=2026.09.23.1">
    <script type="module" src="/static/vendor/fluent/fluent.js?v=2026.09.23.1"></script>
</head>
<body>
    <div class="page">
        <div class="wrap">
            <header class="page-head">
                <div>
                    <h1 class="title" data-i18n="comfy.title">工作流设置</h1>
                    <p class="sub" data-i18n="comfy.subtitle">管理本地 ComfyUI 工作流，并选择在画布节点上显示的输入。</p>
                </div>
                <output id="status" class="status" role="status"></output>
            </header>

            <div class="layout">
                <aside class="sidebar">
                    <section class="side-card workflow-panel workflow-panel-comfy" aria-labelledby="backendHeading">
                        <h2 id="backendHeading" class="side-title" data-i18n="comfy.backendTitle">ComfyUI 后端地址</h2>
                        <div id="comfyInstancesList" class="backend-list"></div>
                        <button id="addComfyInstanceBtn" class="upload-btn" type="button">
                            <i data-lucide="plus" class="w-3.5 h-3.5" aria-hidden="true"></i>
                            <span data-i18n="comfy.backendAdd">添加后端</span>
                        </button>
                        <button id="saveComfyInstancesBtn" class="upload-btn backend-save" type="button">
                            <i data-lucide="save" class="w-3.5 h-3.5" aria-hidden="true"></i>
                            <span data-i18n="common.save">保存</span>
                        </button>
                        <p class="backend-example" data-i18n="comfy.backendExample">请输入主机和端口，例如 127.0.0.1:8188。</p>
                    </section>

                    <section class="side-card workflow-panel workflow-panel-comfy" aria-labelledby="workflowHeading">
                        <h2 id="workflowHeading" class="side-title" data-i18n="comfy.workflowList">工作流列表</h2>
                        <div class="workflow-list" id="workflowList"></div>
                        <button id="chooseWorkflowBtn" class="upload-btn" type="button">
                            <i data-lucide="upload" class="w-3.5 h-3.5" aria-hidden="true"></i>
                            <span data-i18n="comfy.uploadWorkflow">上传工作流</span>
                        </button>
                        <input type="file" id="uploadInput" accept=".json,application/json" hidden>
                    </section>

                    <section id="previewCard" class="side-card" aria-labelledby="previewHeading">
                        <header class="preview-title-row">
                            <i data-lucide="eye" class="w-4 h-4 preview-eye" aria-hidden="true"></i>
                            <h2 id="previewHeading" class="preview-title" data-i18n="comfy.nodePreview">画布节点预览</h2>
                            <span class="preview-pill" data-i18n="comfy.live">实时</span>
                        </header>
                        <p class="preview-desc" data-i18n="comfy.previewDesc">这里会显示画布 Comfy 节点的输入控件。填写参数后，点击「运行测试」检查结果。</p>
                        <div id="previewContent">
                            <p class="preview-empty" data-i18n="comfy.previewEmpty">在工作流图中勾选输入，预览对应的控件。</p>
                        </div>
                    </section>
                </aside>

                <main class="content">
                    <section id="graphCard" class="graph-card" hidden>
                        <header class="graph-head">
                            <div class="graph-title-row">
                                <div class="workflow-heading">
                                    <div class="title-edit-row">
                                        <input type="text" id="workflowTitleInput" class="workflow-title-input"
                                            placeholder="工作流名称" data-i18n-placeholder="comfy.workflowName"
                                            aria-label="工作流名称" data-i18n-aria-label="comfy.workflowName">
                                    </div>
                                    <p id="editorSub" class="editor-sub"></p>
                                </div>
                                <div class="content-actions">
                                    <button type="button" id="deleteBtn" class="action-btn danger-btn" hidden>
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5" aria-hidden="true"></i>
                                        <span data-i18n="common.delete">删除</span>
                                    </button>
                                    <button type="button" id="saveBtn" class="action-btn save-btn">
                                        <i data-lucide="save" class="w-3.5 h-3.5" aria-hidden="true"></i>
                                        <span data-i18n="comfy.saveConfig">保存配置</span>
                                    </button>
                                </div>
                            </div>
                            <div class="workspace-mode-tabs" role="group" aria-label="工作流视图" data-i18n-aria-label="comfy.viewMode">
                                <button type="button" id="workspaceGraphTab" class="active" aria-pressed="true"
                                    data-i18n="comfy.workflow">工作流</button>
                                <button type="button" id="workspaceCanvasTab" aria-pressed="false"
                                    data-i18n="comfy.testCanvas">测试画布</button>
                            </div>
                        </header>

                        <div class="graph-svg-wrap">
                            <svg class="graph-svg" id="graphSvg"></svg>
                            <div class="graph-controls">
                                <button type="button" class="graph-ctrl-btn" id="graphZoomOut" title="缩小" data-i18n-title="canvas.decrease">
                                    <i data-lucide="zoom-out" class="w-4 h-4" aria-hidden="true"></i>
                                </button>
                                <output class="graph-zoom-pill" id="zoomPill">100%</output>
                                <button type="button" class="graph-ctrl-btn" id="graphZoomIn" title="放大" data-i18n-title="canvas.increase">
                                    <i data-lucide="zoom-in" class="w-4 h-4" aria-hidden="true"></i>
                                </button>
                                <button type="button" class="graph-ctrl-btn" id="graphFit" title="适应窗口" data-i18n-title="comfy.fitGraph">
                                    <i data-lucide="maximize" class="w-4 h-4" aria-hidden="true"></i>
                                </button>
                            </div>
                            <div class="popup-backdrop" id="popupBackdrop" hidden></div>
                            <section class="popup-panel" id="nodePopup" role="dialog" aria-labelledby="nodePopupTitle" hidden>
                                <header class="popup-head">
                                    <span class="popup-icon" aria-hidden="true"></span>
                                    <div class="popup-label">
                                        <h2 class="popup-title" id="nodePopupTitle"></h2>
                                        <p class="popup-sub"></p>
                                    </div>
                                    <button type="button" class="popup-close" title="关闭" data-i18n-title="common.close">
                                        <i data-lucide="x" class="w-4 h-4" aria-hidden="true"></i>
                                    </button>
                                </header>
                                <div class="popup-body"></div>
                            </section>
                        </div>
                        <div id="miniCanvasHost" hidden></div>
                    </section>

                    <button type="button" id="nodesToggle" class="nodes-toggle" aria-controls="nodeList" aria-expanded="false" hidden>
                        <i data-lucide="list" class="w-3.5 h-3.5" aria-hidden="true"></i>
                        <span id="nodesToggleText" data-i18n="comfy.showNodeList">显示完整节点列表</span>
                    </button>
                    <section class="node-list hidden" id="nodeList"></section>
                </main>
            </div>
        </div>
    </div>

    <dialog class="image-lightbox" id="imageLightbox" aria-label="输出" data-i18n-aria-label="comfy.output">
        <img id="imageLightboxImg" alt="">
    </dialog>

    <script src="/static/js/xiaomei-viewport-kernel.js?v=2026.11.09.8"></script>
    <script src="/static/js/comfyui-settings.js?v=2026.11.12.workflow-shell"></script>
</body>
</html>
