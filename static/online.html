<html lang="zh-CN" data-studio-skin="minimal">
<head>

<script src="/static/js/theme.js?v=2026.10.01.1790178169"></script>

    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.10.01.1784161005');
        :root { --accent:#111827; --bg:#f9fafb; --card:#fff; --easing:cubic-bezier(0.4,0,0.2,1); }
        body { margin:0; background:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--accent); -webkit-font-smoothing:antialiased; }
        .container-box { max-width:1280px; margin:0 auto; padding:0 40px; margin-top:50px; }
        .nano-input { background:var(--card); border:1px solid #eef0f2; transition:all .3s var(--easing); }
        .nano-input:focus { border-color:#000; box-shadow:0 0 0 1px #000; }
        .upload-item { background:var(--card); border:1px dashed #e2e8f0; transition:all .4s var(--easing); position:relative; overflow:hidden; }
        .upload-item:hover,.upload-item.drag-over { border-color:#000; transform:translateY(-2px); }
        .preview-img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation:fadeIn .5s var(--easing); }
        .glass-btn { background:#111827; transition:all .3s var(--easing); }
        .glass-btn:hover { background:#000; transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
        .result-frame { background:#fff; border-radius:32px; border:1px solid #f1f5f9; box-shadow:0 2px 15px rgba(0,0,0,.02); }
        .tool-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .model-pill { background:#f8fafc; border:1px solid #edf2f7; border-radius:999px; padding:3px; display:grid; grid-template-columns:1fr 1fr; gap:2px; }
        .model-option { border-radius:999px; height:34px; display:flex; align-items:center; justify-content:center; gap:6px; color:#64748b; font-size:10px; font-weight:600; letter-spacing:.02em; transition:all .25s var(--easing); }
        .model-option.active { background:#fff; color:#111827; box-shadow:0 1px 3px rgba(15,23,42,.08); }
        .control-panel { background:#fff; border:1px solid #edf0f3; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .local-pipeline-panel { background:linear-gradient(145deg,#fffaf0,#fff); border:1px solid #ead7b9; border-radius:24px; padding:14px; display:flex; flex-direction:column; gap:11px; }
        .engine-panel { background:#fff; border:1px solid #ead7b9; border-radius:24px; padding:12px; display:flex; flex-direction:column; gap:10px; }
        .engine-switch { background:#f8fafc; border:1px solid #edf2f7; border-radius:999px; padding:3px; display:grid; grid-template-columns:1fr 1fr; gap:3px; }
        .engine-option { border:0; border-radius:999px; height:34px; background:transparent; color:#8b7357; font-size:10px; font-weight:800; cursor:pointer; transition:all .25s var(--easing); }
        .engine-option.active { background:#fff; color:#a65300; box-shadow:0 1px 4px rgba(91,55,12,.12); }
        .engine-note { color:#9b8060; font-size:10px; line-height:1.55; }
        .local-pipeline-heading { display:flex; align-items:center; gap:7px; color:#8b5e2e; font-size:10px; font-weight:800; letter-spacing:.06em; }
        .local-pipeline-heading svg { width:14px; height:14px; }
        .local-status { margin-left:auto; border-radius:999px; padding:3px 8px; font-size:9px; font-weight:800; letter-spacing:.03em; background:#f1f5f9; color:#64748b; }
        .local-status.online { background:#ecfdf5; color:#047857; }
        .local-status.offline { background:#fff1f2; color:#be123c; }
        .pipeline-toggle,.pipeline-check { display:flex; align-items:flex-start; gap:9px; color:#594832; font-size:11px; font-weight:700; line-height:1.45; cursor:pointer; }
        .pipeline-toggle input,.pipeline-check input { width:15px; height:15px; margin:1px 0 0; accent-color:#b56800; flex:0 0 auto; }
        .pipeline-note { color:#9b8060; font-size:10px; line-height:1.55; }
        .pipeline-options { display:flex; flex-direction:column; gap:10px; padding-top:2px; }
        .pipeline-options[hidden] { display:none; }
        .pipeline-range-head { display:flex; justify-content:space-between; align-items:center; color:#8b7357; font-size:10px; font-weight:800; }
        .pipeline-range-head output { color:#a65300; font-variant-numeric:tabular-nums; }
        .pipeline-range { width:100%; height:4px; accent-color:#b56800; cursor:pointer; }
        .pipeline-refresh { border:0; background:transparent; color:#9b8060; font-size:9px; font-weight:800; cursor:pointer; padding:0; }
        .pipeline-refresh:hover { color:#8b4b00; }
        .control-label { display:flex; align-items:center; gap:6px; color:#94a3b8; font-size:10px; font-weight:600; letter-spacing:.04em; }
        .size-row { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; align-items:start; }
        .size-field { position:relative; min-width:0; display:flex; flex-direction:column; gap:6px; }
        .size-select,.size-custom { width:100%; min-width:0; max-width:100%; height:34px; border:1px solid #edf2f7; border-radius:14px; background:#f8fafc; color:#111827; outline:none; padding:0 10px; font-size:11px; font-weight:700; }
        .size-select { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .size-select:disabled { opacity:.55; cursor:not-allowed; }
        .studio-select-native {
            position:absolute !important; width:1px !important; height:1px !important;
            margin:0 !important; padding:0 !important; opacity:0 !important;
            pointer-events:none !important; overflow:hidden !important;
        }
        .studio-select-picker { position:relative; width:100%; min-width:0; }
        .studio-select-trigger {
            width:100%; min-width:0; height:34px; border:1px solid #edf2f7; border-radius:14px;
            background:#f8fafc; color:#111827; padding:0 10px; display:flex; align-items:center;
            justify-content:space-between; gap:8px; font-size:11px; font-weight:700; text-align:left;
            transition:border-color .2s var(--easing), background .2s var(--easing), box-shadow .2s var(--easing);
        }
        .studio-select-trigger:hover,.studio-select-picker.open .studio-select-trigger {
            border-color:#d7c2a1; background:#fffdf8; box-shadow:0 0 0 2px rgba(181,105,0,.06);
        }
        .studio-select-trigger:disabled { opacity:.55; cursor:not-allowed; }
        .studio-select-trigger-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .studio-select-trigger svg { width:14px; height:14px; flex:0 0 auto; transition:transform .2s var(--easing); }
        .studio-select-picker.open .studio-select-trigger svg { transform:rotate(180deg); }
        .studio-select-menu {
            position:absolute; z-index:85; top:calc(100% + 7px); left:0; right:0; min-width:210px;
            max-height:280px; overflow:auto; padding:10px 0 8px; border:1px solid #e4d4b9;
            border-radius:18px; background:#fffaf0; box-shadow:0 18px 45px rgba(86,59,27,.16);
        }
        .studio-select-menu[hidden] { display:none; }
        .studio-select-menu-title {
            padding:0 14px 8px; color:#8c7357; font-size:12px; font-weight:800; letter-spacing:.02em;
        }
        .studio-select-menu-item {
            width:100%; min-height:38px; padding:8px 14px; border:0; background:transparent;
            color:#7b6852; display:flex; align-items:center; gap:9px; font-size:13px; line-height:1.3;
            font-weight:600; text-align:left; overflow-wrap:anywhere; cursor:pointer;
        }
        .studio-select-menu-item:hover { background:rgba(181,105,0,.08); color:#6a471d; }
        .studio-select-menu-item.active {
            margin:0 8px; width:calc(100% - 16px); border:1px solid #d7b47c; border-radius:11px;
            background:#fffdf8; color:#a65300; font-weight:800; box-shadow:0 1px 3px rgba(91,55,12,.07);
        }
        .studio-select-menu-item .studio-select-check { margin-left:auto; width:15px; height:15px; flex:0 0 auto; }
        .studio-select-menu-empty { padding:12px 14px; color:#9b8a77; font-size:12px; }
        .image-model-picker { position:relative; min-width:0; }
        .image-model-trigger {
            width:100%; min-width:0; height:34px; border:1px solid #edf2f7; border-radius:14px;
            background:#f8fafc; color:#111827; padding:0 10px; display:flex; align-items:center;
            justify-content:space-between; gap:8px; font-size:11px; font-weight:700; text-align:left;
            transition:border-color .2s var(--easing), background .2s var(--easing), box-shadow .2s var(--easing);
        }
        .image-model-trigger:hover,.image-model-picker.open .image-model-trigger {
            border-color:#d7c2a1; background:#fffdf8; box-shadow:0 0 0 2px rgba(181,105,0,.06);
        }
        .image-model-trigger-label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .image-model-trigger svg { width:14px; height:14px; flex:0 0 auto; transition:transform .2s var(--easing); }
        .image-model-picker.open .image-model-trigger svg { transform:rotate(180deg); }
        .image-model-menu {
            position:absolute; z-index:80; top:calc(100% + 7px); left:0; right:0; min-width:260px;
            max-height:300px; overflow:auto; padding:10px 0 8px; border:1px solid #e4d4b9;
            border-radius:18px; background:#fffaf0; box-shadow:0 18px 45px rgba(86,59,27,.16);
        }
        .image-model-menu[hidden] { display:none; }
        .image-model-menu-title {
            padding:0 14px 8px; color:#8c7357; font-size:12px; font-weight:800; letter-spacing:.02em;
        }
        .image-model-menu-item {
            width:100%; min-height:38px; padding:8px 14px; border:0; background:transparent;
            color:#7b6852; display:flex; align-items:center; gap:9px; font-size:13px; line-height:1.3;
            font-weight:600; text-align:left; overflow-wrap:anywhere; cursor:pointer;
        }
        .image-model-menu-item:hover { background:rgba(181,105,0,.08); color:#6a471d; }
        .image-model-menu-item.active {
            margin:0 8px; width:calc(100% - 16px); border:1px solid #d7b47c; border-radius:11px;
            background:#fffdf8; color:#a65300; font-weight:800; box-shadow:0 1px 3px rgba(91,55,12,.07);
        }
        .image-model-menu-item .model-check { margin-left:auto; width:15px; height:15px; flex:0 0 auto; }
        .image-model-menu-empty { padding:12px 14px; color:#9b8a77; font-size:12px; }
        .size-custom { display:none; background:#fff; }
        .size-field.custom .size-custom { display:block; }
        .size-pair { display:none; grid-template-columns:1fr 1fr; gap:6px; }
        .size-field.custom .size-pair { display:grid; }
        .size-pair .size-custom { display:block; }
        .size-pair.with-fit { grid-template-columns:1fr 1fr auto; align-items:center; }
        .size-fit-btn { height:34px; border:1px solid #edf2f7; border-radius:14px; background:#fff; color:#111827; padding:0 10px; font-size:10px; font-weight:800; white-space:nowrap; }
        .size-fit-btn:disabled { opacity:.45; cursor:not-allowed; }
        .mode-badge { font-size:9px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#0f172a; background:#eef2ff; border:1px solid #e0e7ff; padding:2px 8px; border-radius:999px; }
        .masonry-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
        @media (min-width:768px){ .masonry-grid{ grid-template-columns:repeat(4,1fr); } }
        @media (max-width:640px){ .size-row{ grid-template-columns:1fr; } }
        .masonry-item { aspect-ratio:1/1; border-radius:24px; overflow:hidden; background:#fff; border:1px solid #f1f5f9; transition:all .5s var(--easing); }
        .masonry-item:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,.08); }
        .gallery-lightbox { background:rgba(255,255,255,.99); backdrop-filter:blur(22px) saturate(1.05); }
        @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    </style>

    <style>
        html:not(.studio-theme-dark) body:not(.studio-theme-dark) #lightbox.gallery-lightbox {
            background: rgba(255,255,255,.99) !important;
            backdrop-filter: blur(22px) saturate(1.05) !important;
            -webkit-backdrop-filter: blur(22px) saturate(1.05) !important;
        }
    </style>
    <link rel="stylesheet" href="/static/vendor/fluent/tokens.css?v=2026.10.01.1790178173">
    <link rel="stylesheet" href="/static/css/fluent-ui.css?v=2026.10.01.1790574407">

<body>
    <div class="container-box min-h-screen flex flex-col">
        <header class="flex justify-between items-end mb-16">
            <div class="space-y-1">
                <h1 class="text-4xl font-extrabold tracking-tighter italic" data-i18n="online.title">在线生图</h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.4em] text-gray-400">GPT / NANO BANANA IMAGE STUDIO</p>
            </div>
            <nav class="hidden md:flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-400">
                <span class="text-black border-b-2 border-black pb-1" data-i18n="online.create">Create</span>
            </nav>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div class="lg:col-span-5 space-y-8">
                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="terminal" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest">Prompt</span>
                    </div>
                    <textarea id="promptInput" rows="5" class="nano-input w-full p-6 rounded-3xl text-sm outline-none resize-none placeholder-gray-300" placeholder="输入想生成或编辑的画面..." data-i18n-placeholder="online.promptPlaceholder"></textarea>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-400">
                        <i data-lucide="images" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-widest" data-i18n="online.referenceImages">Reference Images</span>
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div id="drop-zone-1" onclick="document.getElementById('file1').click()" class="upload-item legacy-upload-drop group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file1" accept="image/*" class="hidden" onchange="handleFile(this.files[0],1)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Main</span>
                            <img id="prev1" class="preview-img hidden"><button id="del1" onclick="clearSlot(1,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                        <div id="drop-zone-2" onclick="document.getElementById('file2').click()" class="upload-item legacy-upload-drop group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file2" accept="image/*" class="hidden" onchange="handleFile(this.files[0],2)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux A</span>
                            <img id="prev2" class="preview-img hidden"><button id="del2" onclick="clearSlot(2,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                        <div id="drop-zone-3" onclick="document.getElementById('file3').click()" class="upload-item legacy-upload-drop group aspect-square rounded-2xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file3" accept="image/*" class="hidden" onchange="handleFile(this.files[0],3)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux B</span>
                            <img id="prev3" class="preview-img hidden"><button id="del3" onclick="clearSlot(3,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                    </div>
                </section>

                <section class="engine-panel" id="enginePanel">
                    <div class="control-label">
                        <i data-lucide="cpu" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.engine">生成引擎</span>
                        <span id="engineModeBadge" class="mode-badge" style="margin-left:auto;"></span>
                    </div>
                    <div class="engine-switch" role="tablist" aria-label="生成引擎">
                        <button id="localEngineButton" class="engine-option active" type="button" role="tab" onclick="setGenerationEngine('local')" data-i18n="online.engineLocal">本地 ComfyUI</button>
                        <button id="cloudEngineButton" class="engine-option" type="button" role="tab" onclick="setGenerationEngine('cloud')" data-i18n="online.engineCloud">API 生图</button>
                    </div>
                    <div id="engineNote" class="engine-note" data-i18n="online.engineLocalNote">当前只调用本机 ComfyUI，不需要 API Key，也不会产生云端生图费用。</div>
                </section>

                <div id="cloudControls" class="tool-panel" style="display:none;">
                    <div class="control-label">
                        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.model">Model</span>
                        <span id="providerModeBadge" class="mode-badge" style="margin-left:auto;display:none;"></span>
                    </div>
                    <div class="size-row">
                        <label class="size-field">
                            <select id="providerSelect" class="size-select" onchange="setProvider(this.value)"></select>
                        </label>
                        <label class="size-field">
                            <div id="imageModelPicker" class="image-model-picker">
                                <button id="imageModelTrigger" class="image-model-trigger" type="button"
                                    aria-haspopup="listbox" aria-expanded="false" onclick="toggleImageModelMenu(event)">
                                    <span id="imageModelTriggerLabel" class="image-model-trigger-label"></span>
                                    <i data-lucide="chevron-down"></i>
                                </button>
                                <div id="imageModelMenu" class="image-model-menu" role="listbox" hidden></div>
                            </div>
                        </label>
                    </div>
                    <div id="adaptiveExtras" class="size-row" style="margin-top:2px;">
                        <label id="qualityField" class="size-field">
                            <select id="qualitySelect" class="size-select" onchange="setQuality(this.value)" title="Quality">
                                <option value="auto" data-i18n="online.qualityAuto">自动</option>
                                <option value="low" data-i18n="online.qualityLow">低</option>
                                <option value="medium" data-i18n="online.qualityMedium">中</option>
                                <option value="high" data-i18n="online.qualityHigh">高</option>
                                <option value="xhigh" data-i18n="online.qualityXhigh">极高</option>
                                <option value="max" data-i18n="online.qualityMax">最高</option>
                            </select>
                        </label>
                        <label id="countField" class="size-field">
                            <select id="countSelect" class="size-select" onchange="setCount(this.value)" title="Count">
                                <option value="1" selected>×1</option>
                                <option value="2">×2</option>
                                <option value="3">×3</option>
                                <option value="4">×4</option>
                            </select>
                        </label>
                        <label id="backgroundField" class="size-field" style="display:none;">
                            <select id="backgroundSelect" class="size-select" onchange="setBackground(this.value)" title="Background">
                                <option value="opaque" data-i18n="online.backgroundOpaque">不透明</option>
                                <option value="transparent" data-i18n="online.backgroundTransparent">透明</option>
                            </select>
                        </label>
                    </div>
                </div>

                <div id="sizeControls" class="tool-panel">
                    <div class="control-label mt-1">
                        <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.size">Size</span>
                    </div>
                    <div class="size-row">
                        <label id="resolutionField" class="size-field">
                            <select id="resolutionSelect" class="size-select" onchange="setResolution(this.value)">
                                <option value="1k" selected>1K</option>
                                <option value="2k">2K</option>
                                <option value="4k">4K</option>
                                <option value="custom" data-i18n="online.customSize">自定义尺寸</option>
                            </select>
                            <span class="size-pair with-fit">
                                <input id="sizeCustomWidth" class="size-custom" type="number" min="64" step="64" placeholder="宽度" data-i18n-placeholder="online.width" oninput="setCustomSize()">
                                <input id="sizeCustomHeight" class="size-custom" type="number" min="64" step="64" placeholder="高度" data-i18n-placeholder="online.height" oninput="setCustomSize()">
                                <button id="fitImageSizeBtn" class="size-fit-btn" type="button" onclick="fitCustomSizeToImage(event)">适配图片</button>
                            </span>
                        </label>
                        <label id="ratioField" class="size-field">
                            <select id="ratioSelect" class="size-select" onchange="setRatio(this.value)">
                                <option value="" data-i18n="online.emptyRatio">比例为空</option>
                                <option value="square" selected data-i18n="online.square">1:1 方图</option>
                                <option value="portrait" data-i18n="online.portrait">2:3 竖图</option>
                                <option value="landscape" data-i18n="online.landscape">3:2 横图</option>
                                <option value="portrait43">3:4 竖图</option>
                                <option value="landscape43">4:3 横图</option>
                                <option value="story" data-i18n="online.story">9:16 竖屏</option>
                                <option value="wide" data-i18n="online.wide">16:9 宽屏</option>

                <section class="local-pipeline-panel" id="localControls">
                    <div class="local-pipeline-heading">
                        <i data-lucide="wand-sparkles" class="w-3.5 h-3.5"></i>

                        <select id="localModeSelect" class="size-select" onchange="setLocalMode(this.value)">
                            <option value="text" data-i18n="online.localModeText">Z-Image Turbo · 本地文生图</option>
                            <option value="enhance" data-i18n="online.localModeEnhance">Z-Image Enhance · 去噪 / 去色块 / 保构图</option>

                    </label>
                    <div id="localEnhanceOptions" class="pipeline-options" hidden>
                        <div>
                            <div class="pipeline-range-head">

                            <input id="localDenoiseRange" class="pipeline-range" type="range" min="0.1" max="1" step="0.05" value="0.35" oninput="setLocalDenoise(this.value)">
                            <div class="pipeline-note" data-i18n="online.localDenoiseHint">数值越低越保留原图；数值越高，重绘幅度越大。</div>

                        <label class="pipeline-check">
                            <input id="localPortraitToggle" type="checkbox" onchange="setLocalPortrait(this.checked)">

                    <div class="pipeline-note">
                        <span data-i18n="online.localNote">本地模式不调用云端 API；去噪模式需要添加一张参考图。</span>
                        <button type="button" class="pipeline-refresh" onclick="refreshComfyStatus()" data-i18n="online.localRefresh">重新检测</button>

                <button id="genBtn" onclick="submitImage()" class="glass-btn w-full py-5 text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-lg">

                    <div id="loader" class="hidden text-center space-y-4"><div class="w-8 h-8 border-2 border-black border-t-transparent rounded-full animate-spin mx-auto"></div><p id="loaderLabel" class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="online.generating">Generating</p></div>
                    <img id="outputImg" class="hidden w-full h-full object-contain p-8 cursor-zoom-in" onclick="zoomImage()">
                    <a id="downloadBtn" href="#" download class="hidden absolute top-8 right-8 w-12 h-12 bg-white/90 shadow-2xl rounded-2xl flex items-center justify-center hover:bg-black hover:text-white"><i data-lucide="download" class="w-4 h-4"></i></a>
                </div>

        <section class="mt-32">
            <div class="flex items-center gap-6 mb-12"><h2 class="text-[11px] font-black uppercase tracking-[0.5em]" data-i18n="online.archives">Archives</h2><div class="h-px flex-1 bg-gray-100"></div></div>
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger" class="py-20 text-center text-gray-300 text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:text-black">Load More Archive</div>
        </section>
    </div>

    <div id="lightbox" onclick="handleOutsideClick(event)" class="hidden fixed inset-0 z-50 gallery-lightbox flex flex-col items-center justify-center p-8">
        <button onclick="closeLightbox()" class="absolute top-10 right-10 text-gray-400 hover:text-black"><i data-lucide="x" class="w-8 h-8"></i></button>
        <div class="w-full flex flex-col items-center pointer-events-none" style="max-width:min(1280px, 92vw)">
            <div id="lightboxFrame" class="studio-preview-frame pointer-events-auto">
                <img id="lightboxImg" class="studio-preview-img" alt="preview">

                    <span id="lightboxRes">0x0</span>

                <div class="flex-1">
                    <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest block mb-2">Prompt</span>
                    <p id="lightboxPrompt" class="text-gray-700 text-sm leading-relaxed max-h-32 overflow-y-auto pr-2"></p>
                </div>
                <button id="sameStyleBtn" onclick="applySameStyle()" class="bg-black text-white px-8 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i><span data-i18n="online.reuse">Reuse</span></button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('online.title');
            const loader = document.getElementById('loadMoreTrigger');
            if(loader && !isLoading) loader.innerText = tr('online.loadMore');
        }
        window.addEventListener('message', event => {
            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);
            // API 设置页通过 postMessage 通知平台/模型变更（iframe 内嵌场景）
            if(event.data?.type === 'providers-changed' || event.data?.type === 'workflows-changed') scheduleProviderRefresh();
        });
        window.addEventListener('studio-lang-change', () => {
            document.title = tr('online.title');
            updateAdaptivePanel();
            updateEngineUI();
            const badge = document.getElementById('localComfyStatus');
            if(badge) badge.textContent = localComfyAvailable ? tr('online.comfyOnline') : tr('online.comfyOffline');
        });
        let refs = {1:null,2:null,3:null};
        let refDims = {1:null,2:null,3:null};
        let provider = 'comfly';
        let selectedModel = 'gpt-image-2';
        let apiProviders = [];
        let ratio = 'square';
        let resolution = '1k';
        let customRatioWidth = '';
        let customRatioHeight = '';
        let customWidth = '';
        let customHeight = '';
        let quality = 'auto';
        let background = 'opaque';
        let outputCount = 1;
        let generationEngine = 'local';
        let localMode = 'text';
        let localDenoise = 0.35;
        let localIncludePortrait = false;
        let localComfyAvailable = false;
        let models = {gpt:'gpt-image-2', nano:'nano-banana-pro'};
        let allHistory = [], currentIndex = 0, currentResult = null, currentLightboxData = null, isLoading = false;
        const PAGE_SIZE = 24;
        try {
            generationEngine = localStorage.getItem('online.generationEngine') === 'cloud' ? 'cloud' : 'local';
            localMode = localStorage.getItem('online.localMode') === 'enhance' ? 'enhance' : 'text';
            const storedDenoise = Number(localStorage.getItem('online.localDenoise'));
            if(Number.isFinite(storedDenoise)) localDenoise = Math.max(0.1, Math.min(1, storedDenoise));
            localIncludePortrait = localStorage.getItem('online.localIncludePortrait') === '1';
        } catch(e) {}
        const SIZE_OPTIONS = {
            square: [
                ['1024x1024', '1k'],
                ['2048x2048', '2k'],
                ['2880x2880', '4k']
            ],
            portrait: [
                ['1024x1536', '1k'],
                ['1360x2048', '2k'],
                ['2352x3520', '4k']
            ],
            portrait43: [
                ['1008x1344', '1k'],
                ['1536x2048', '2k'],
                ['2448x3264', '4k']
            ],
            landscape43: [
                ['1344x1008', '1k'],
                ['2048x1536', '2k'],
                ['3264x2448', '4k']
            ],
            landscape: [
                ['1536x1024', '1k'],
                ['2048x1360', '2k'],
                ['3520x2352', '4k']
            ],
            story: [
                ['720x1280', '1k'],
                ['1152x2048', '2k'],
                ['2160x3840', '4k']
            ],
            wide: [
                ['1280x720', '1k'],
                ['2048x1152', '2k'],
                ['3840x2160', '4k']
            ]
        };
        const RES_LONG_SIDE = { '1k': 1536, '2k': 2048, '4k': 3840 };
        const RES_PIXEL_LIMIT = { '1k': 1572864, '2k': 4194304, '4k': 8294400 };

        function updateLocalControlsUI(){
            const options = document.getElementById('localEnhanceOptions');
            const mode = document.getElementById('localModeSelect');
            const range = document.getElementById('localDenoiseRange');
            const value = document.getElementById('localDenoiseValue');
            const portrait = document.getElementById('localPortraitToggle');
            const sizeControls = document.getElementById('sizeControls');
            if(options) options.hidden = localMode !== 'enhance';
            if(mode) mode.value = localMode;
            if(range) range.value = String(localDenoise);
            if(value) value.textContent = localDenoise.toFixed(2);
            if(portrait) portrait.checked = localIncludePortrait;
            if(sizeControls) sizeControls.style.display = generationEngine === 'local' && localMode === 'enhance' ? 'none' : '';
        }
        function updateEngineUI(){
            const isLocal = generationEngine === 'local';
            const localButton = document.getElementById('localEngineButton');
            const cloudButton = document.getElementById('cloudEngineButton');
            const cloudControls = document.getElementById('cloudControls');
            const localControls = document.getElementById('localControls');
            const badge = document.getElementById('engineModeBadge');
            const note = document.getElementById('engineNote');
            localButton?.classList.toggle('active', isLocal);
            cloudButton?.classList.toggle('active', !isLocal);
            localButton?.setAttribute('aria-selected', isLocal ? 'true' : 'false');
            cloudButton?.setAttribute('aria-selected', isLocal ? 'false' : 'true');
            if(cloudControls) cloudControls.style.display = isLocal ? 'none' : '';
            if(localControls) localControls.style.display = isLocal ? '' : 'none';
            if(badge) badge.textContent = tr(isLocal ? 'online.engineLocalBadge' : 'online.engineCloudBadge');
            if(note) note.textContent = tr(isLocal ? 'online.engineLocalNote' : 'online.engineCloudNote');
            updateLocalControlsUI();
            updateAdaptivePanel();
        }
        function setGenerationEngine(next){
            generationEngine = next === 'cloud' ? 'cloud' : 'local';
            try { localStorage.setItem('online.generationEngine', generationEngine); } catch(e) {}
            updateEngineUI();
        }
        function setLocalMode(next){
            localMode = next === 'enhance' ? 'enhance' : 'text';
            try { localStorage.setItem('online.localMode', localMode); } catch(e) {}
            updateLocalControlsUI();
        }
        function setLocalDenoise(next){
            const value = Number(next);
            localDenoise = Number.isFinite(value) ? Math.max(0.1, Math.min(1, value)) : 0.35;
            try { localStorage.setItem('online.localDenoise', String(localDenoise)); } catch(e) {}
            updateLocalControlsUI();
        }
        function setLocalPortrait(next){
            localIncludePortrait = Boolean(next);
            try { localStorage.setItem('online.localIncludePortrait', localIncludePortrait ? '1' : '0'); } catch(e) {}
            updateLocalControlsUI();
        }
        async function refreshComfyStatus(){
            const badge = document.getElementById('localComfyStatus');
            if(badge){
                badge.textContent = tr('online.comfyChecking');
                badge.classList.remove('online', 'offline');
            }
            try {
                const response = await fetch('/api/comfyui/status', {cache:'no-store'});
                const data = await response.json().catch(() => ({}));
                localComfyAvailable = response.ok && Boolean(data.available);
            } catch(e) {
                localComfyAvailable = false;
            }
            if(badge){
                badge.textContent = localComfyAvailable ? tr('online.comfyOnline') : tr('online.comfyOffline');
                badge.classList.toggle('online', localComfyAvailable);
                badge.classList.toggle('offline', !localComfyAvailable);
            }
            return localComfyAvailable;
        }

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function imageProviders(){
            return (apiProviders || []).filter(p => ['api-6789', 'comfly'].includes(p.id) && p.enabled !== false && uniqueModels(p.image_models || []).length);
        }
        function providerById(id){
            return imageProviders().find(p => p.id === id) || imageProviders()[0];
        }
        function providerModels(id){
            return uniqueModels(providerById(id)?.image_models || []);
        }
        /* ---- RunningHub：同一平台下同步模型 API / 工作流 / AI 应用。
         * 模型 API 直接提交原始模型名；value=app:ID / workflow:ID 走 RH 应用/工作流路径。 */
        function runningHubEntryId(entry, kind){
            if(!entry || typeof entry !== 'object') return '';
            const raw = kind === 'model' ? (entry.model || entry.id || entry.name)
                : kind === 'workflow' ? (entry.workflowId || entry.id)
                : (entry.appId || entry.webappId || entry.id);
            return String(raw || '').trim();
        }
        function runningHubEntries(id){
            const p = providerById(id) || {};
            const collect = (list, kind) => (list || [])
                .filter(e => e && e.enabled !== false && e.hidden !== true)
                .map(e => ({ kind, id: runningHubEntryId(e, kind), title: String(e.title || e.note || '').trim() }))
                .filter(e => e.id);
            const models = uniqueModels(p.image_models || []).map(model => ({kind:'model', id:model, title:model}));
            return [...models, ...collect(p.rh_workflows, 'workflow'), ...collect(p.rh_apps, 'app')];
        }
        function isRunningHubProvider(id){ return providerProtocol(id) === 'runninghub'; }
        function renderProviderControls(){
            const providerSelect = document.getElementById('providerSelect');
            const providers = imageProviders();
            if(!providers.some(p => p.id === provider)) provider = providers[0]?.id || 'comfly';
            providerSelect.innerHTML = providers.map(p => `<option value="${escapeHtml(p.id)}" ${p.id === provider ? 'selected' : ''}>${escapeHtml(p.name || p.id)}</option>`).join('');
            syncStyledSelect(providerSelect);
            let modelEntries = [];
            if(isRunningHubProvider(provider)){
                const entries = runningHubEntries(provider);
                const keys = entries.map(e => e.kind === 'model' ? e.id : `${e.kind}:${e.id}`);
                if(!keys.includes(selectedModel)) selectedModel = keys[0] || '';
                modelEntries = entries.map(e => {
                    const value = e.kind === 'model' ? e.id : `${e.kind}:${e.id}`;
                    const tag = e.kind === 'model' ? '模型 API' : e.kind === 'workflow' ? tr('online.rhWorkflow') : tr('online.rhApp');
                    return {value, label:`[${tag}] ${e.title || e.id}`};
                });
            } else {
                const modelsForProvider = providerModels(provider);
                if(!modelsForProvider.includes(selectedModel)) selectedModel = modelsForProvider[0] || models.gpt;
                modelEntries = modelsForProvider.map(model => ({value:model, label:model}));
            }
            renderImageModelPicker(modelEntries);
            updateAdaptivePanel();
        }

        function renderImageModelPicker(entries){
            const picker = document.getElementById('imageModelPicker');
            const trigger = document.getElementById('imageModelTrigger');
            const label = document.getElementById('imageModelTriggerLabel');
            const menu = document.getElementById('imageModelMenu');
            if(!picker || !trigger || !label || !menu) return;
            const active = (entries || []).find(entry => entry.value === selectedModel);
            label.textContent = active?.label || selectedModel || '暂无生图模型';
            trigger.disabled = !(entries || []).length;
            menu.innerHTML = (entries || []).length
                ? `<div class="image-model-menu-title">生图模型</div>` + entries.map(entry => `
                    <button class="image-model-menu-item ${entry.value === selectedModel ? 'active' : ''}" type="button"
                        role="option" aria-selected="${entry.value === selectedModel ? 'true' : 'false'}"
                        data-image-model-value="${escapeHtml(entry.value)}">
                        <span>${escapeHtml(entry.label)}</span>
                        ${entry.value === selectedModel ? '<i class="model-check" data-lucide="check"></i>' : ''}
                    </button>`).join('')
                : `<div class="image-model-menu-empty">${escapeHtml(tr('online.rhNoEntries') || '暂无生图模型')}</div>`;
            if(window.lucide) lucide.createIcons();
        }

        function setImageModelMenuOpen(open){
            const picker = document.getElementById('imageModelPicker');
            const trigger = document.getElementById('imageModelTrigger');
            const menu = document.getElementById('imageModelMenu');
            if(!picker || !trigger || !menu) return;
            picker.classList.toggle('open', !!open);
            trigger.setAttribute('aria-expanded', open ? 'true' : 'false');
            menu.hidden = !open;
        }

        function toggleImageModelMenu(event){
            event?.stopPropagation();
            const picker = document.getElementById('imageModelPicker');
            closeAllStyledSelects();
            setImageModelMenuOpen(!picker?.classList.contains('open'));
        }

        const STYLED_SELECT_TITLES = {
            providerSelect: 'API 平台',
            qualitySelect: '生成质量',
            backgroundSelect: '背景',
            countSelect: '生成数量',
            resolutionSelect: '清晰度',
            ratioSelect: '图片比例'
        };

        function styledSelectOptionLabel(option){
            return String(option?.textContent || option?.value || '').trim();
        }

        function syncStyledSelect(selectOrId){
            const select = typeof selectOrId === 'string' ? document.getElementById(selectOrId) : selectOrId;
            if(!select || !STYLED_SELECT_TITLES[select.id]) return;
            select.classList.add('studio-select-native');
            let picker = document.querySelector(`[data-styled-select-for="${select.id}"]`);
            if(!picker){
                picker = document.createElement('div');
                picker.className = 'studio-select-picker';
                picker.dataset.styledSelectFor = select.id;
                picker.innerHTML = `
                    <button class="studio-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"
                        onclick="toggleStyledSelectMenu(event, '${select.id}')">
                        <span class="studio-select-trigger-label"></span>
                        <i data-lucide="chevron-down"></i>
                    </button>
                    <div class="studio-select-menu" role="listbox" hidden></div>`;
                select.insertAdjacentElement('afterend', picker);
            }
            const options = Array.from(select.options || []);
            const selected = options.find(option => option.value === select.value) || options[0];
            const trigger = picker.querySelector('.studio-select-trigger');
            const label = picker.querySelector('.studio-select-trigger-label');
            const menu = picker.querySelector('.studio-select-menu');
            label.textContent = selected ? styledSelectOptionLabel(selected) : '暂无选项';
            trigger.disabled = select.disabled || !options.length;
            menu.innerHTML = options.length
                ? `<div class="studio-select-menu-title">${escapeHtml(STYLED_SELECT_TITLES[select.id])}</div>` +
                    options.map(option => `
                        <button class="studio-select-menu-item ${option.value === select.value ? 'active' : ''}" type="button"
                            role="option" aria-selected="${option.value === select.value ? 'true' : 'false'}"
                            data-styled-select-id="${select.id}" data-styled-select-value="${escapeHtml(option.value)}">
                            <span>${escapeHtml(styledSelectOptionLabel(option))}</span>
                            ${option.value === select.value ? '<i class="studio-select-check" data-lucide="check"></i>' : ''}
                        </button>`).join('')
                : '<div class="studio-select-menu-empty">暂无可选项</div>';
            if(window.lucide) lucide.createIcons();
        }

        function closeAllStyledSelects(exceptId = ''){
            document.querySelectorAll('.studio-select-picker').forEach(picker => {
                if(exceptId && picker.dataset.styledSelectFor === exceptId) return;
                picker.classList.remove('open');
                picker.querySelector('.studio-select-trigger')?.setAttribute('aria-expanded', 'false');
                const menu = picker.querySelector('.studio-select-menu');
                if(menu) menu.hidden = true;
            });
        }

        function setStyledSelectMenuOpen(selectId, open){
            const picker = document.querySelector(`[data-styled-select-for="${selectId}"]`);
            if(!picker) return;
            if(open){
                closeAllStyledSelects(selectId);
                setImageModelMenuOpen(false);
            }
            picker.classList.toggle('open', !!open);
            picker.querySelector('.studio-select-trigger')?.setAttribute('aria-expanded', open ? 'true' : 'false');
            const menu = picker.querySelector('.studio-select-menu');
            if(menu) menu.hidden = !open;
        }

        function toggleStyledSelectMenu(event, selectId){
            event?.preventDefault();
            event?.stopPropagation();
            const picker = document.querySelector(`[data-styled-select-for="${selectId}"]`);
            setStyledSelectMenuOpen(selectId, !picker?.classList.contains('open'));
        }

        document.addEventListener('click', event => {
            const styledOption = event.target.closest('[data-styled-select-id]');
            if(styledOption){
                event.preventDefault();
                event.stopPropagation();
                const select = document.getElementById(styledOption.dataset.styledSelectId || '');
                if(select && !select.disabled){
                    select.value = styledOption.dataset.styledSelectValue || '';
                    select.dispatchEvent(new Event('change', {bubbles:true}));
                    syncStyledSelect(select);
                }
                closeAllStyledSelects();
                return;
            }
            const option = event.target.closest('[data-image-model-value]');
            if(option){
                setModel(option.dataset.imageModelValue || '');
                setImageModelMenuOpen(false);
                renderProviderControls();
                return;
            }
            if(!event.target.closest('#imageModelPicker')) setImageModelMenuOpen(false);
            if(!event.target.closest('.studio-select-picker')) closeAllStyledSelects();
        });
        document.addEventListener('keydown', event => {
            if(event.key === 'Escape'){
                setImageModelMenuOpen(false);
                closeAllStyledSelects();
            }
        });

        /* ---- 协议自适应：根据所选 provider 的 protocol 调整参数栏 ----
         * 后端 /api/online-image → generate_ai_image 已按协议分发，前端只需让
         * 与协议无关的控件随之显隐：质量仅 OpenAI 系（gpt-image）生效，其余协议忽略。 */
        function providerProtocol(id){
            const p = providerById(id) || {};
            const proto = String(p.protocol || '').toLowerCase();
            const pid = String(p.id || '').toLowerCase();
            const base = String(p.base_url || '').toLowerCase();
            if(proto === 'modelscope' || pid === 'modelscope') return 'modelscope';
            if(proto === 'runninghub' || pid === 'runninghub') return 'runninghub';

        function parseSizeValue(value){
            const match = String(value || '').trim().match(/^(\d+)\s*[xX*]\s*(\d+)$/);
            return match ? {width:match[1], height:match[2]} : null;
        }
        function isGptImage2Model(model){
            const raw = String(model || '').trim().toLowerCase();
            const normalized = raw.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const compact = raw.replace(/[^a-z0-9]+/g, '');
            return normalized === 'gpt-image-2'
                || normalized.startsWith('gpt-image-2-')
                || normalized.endsWith('-gpt-image-2')
                || normalized.includes('-gpt-image-2-')
                || compact === 'gptimage2'
                || compact.startsWith('gptimage2')
                || compact.endsWith('gptimage2');
        }
        function isGptImage25Model(model){
            const raw = String(model || '').trim().toLowerCase();
            const normalized = raw.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            return /(?:^|-)gpt-image-2-5(?:-(?:flare|sunburst))?(?:-|$)/.test(normalized);
        }
        function normalizeGptImage2Size(value){
            const parsed = parseSizeValue(value);
            if(!parsed) return value || 'auto';
            let width = Number(parsed.width);
            let height = Number(parsed.height);
            if(!width || !height) return value || 'auto';
            const valid = width % 16 === 0 && height % 16 === 0
                && Math.max(width, height) <= 3840
                && width * height >= 655360
                && width * height <= 8294400
                && Math.max(width / height, height / width) <= 3;
            if(valid){
                return `${width}x${height}`;
            }
            const ratioValue = width / height;
            if(ratioValue > 3) width = height * 3;
            else if(ratioValue < 1 / 3) height = width * 3;
            const scale = Math.min(
                1,
                3840 / Math.max(width, height),
                Math.sqrt(8294400 / Math.max(1, width * height))
            );
            width = Math.max(16, Math.floor((width * scale) / 16) * 16);
            height = Math.max(16, Math.floor((height * scale) / 16) * 16);
            if(width * height < 655360){
                const grow = Math.sqrt(655360 / Math.max(1, width * height));
                width = Math.ceil((width * grow) / 16) * 16;
                height = Math.ceil((height * grow) / 16) * 16;
            }
            if(width > height * 3) width = Math.max(16, Math.floor(height * 3 / 16) * 16);
            else if(height > width * 3) height = Math.max(16, Math.floor(width * 3 / 16) * 16);
            while(Math.max(width, height) > 3840 || width * height > 8294400){
                if(width >= height) width = Math.max(16, width - 16);
                else height = Math.max(16, height - 16);
            }
            if(width * height < 655360){
                const grow = Math.sqrt(655360 / Math.max(1, width * height));
                width = Math.ceil((width * grow) / 16) * 16;
                height = Math.ceil((height * grow) / 16) * 16;
                while(Math.max(width, height) > 3840 || width * height > 8294400){
                    if(width >= height) width = Math.max(16, width - 16);
                    else height = Math.max(16, height - 16);
                }
            }
            return `${width}x${height}`;
        }

            ensureLightboxPreview();
            if(lightboxPreview) lightboxPreview.reset();
            img.onload = () => { res.textContent = img.naturalWidth && img.naturalHeight ? `${img.naturalWidth} x ${img.naturalHeight}` : (data.params?.size || '--'); };
            img.src = data.images[0];
            document.getElementById('lightboxPrompt').textContent = data.prompt || '';
            document.getElementById('lightbox').classList.replace('hidden','flex');
            document.body.style.overflow='hidden';
            lucide.createIcons();
        }
        function closeLightbox(){
            if(lightboxPreview) lightboxPreview.reset();
            document.getElementById('lightbox').classList.replace('flex','hidden');
            document.body.style.overflow='auto';
        }
        function handleOutsideClick(e){ if(e.target.id === 'lightbox') closeLightbox(); }
        async function downloadLightboxImage(e){
            e.stopPropagation();
            const url = currentLightboxData?.images?.[0];
            if(!url) return;
            const res = await fetch(url);
            if(!res.ok) return alert('下载失败');
            const blob = await res.blob();
            const clean = url.split('?')[0];
            const ext = clean.includes('.') ? clean.split('.').pop() : 'png';
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `online-image-${Date.now()}.${ext || 'png'}`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        }
        function zoomImage(){ if(currentResult) openLightbox(currentResult); }
        function applySameStyle(){
            if(!currentLightboxData) return;
            document.getElementById('promptInput').value = currentLightboxData.prompt || '';
            [1,2,3].forEach(id => clearSlot(id));
            (currentLightboxData.params?.reference_images || []).slice(0,3).forEach((ref,i) => {
                refs[i+1] = ref; const prev = document.getElementById(`prev${i+1}`);
                prev.src = ref.url; prev.classList.remove('hidden'); document.getElementById(`del${i+1}`).classList.remove('hidden');
                getImageDimensions(ref.url).then(dim => {
                    refDims[i+1] = dim;
                    updateSizeUI();
                }).catch(() => {});
            });
            const size = currentLightboxData.params?.size || '1024x1024';
            if(['auto','low','medium','high','xhigh','max'].includes(currentLightboxData.params?.quality)) quality = currentLightboxData.params.quality;
            background = currentLightboxData.params?.background === 'transparent' ? 'transparent' : 'opaque';
            const savedLocalMode = currentLightboxData.params?.local_mode === 'enhance'
                || currentLightboxData.workflow_json === 'Z-Image-Enhance.json'
                ? 'enhance'
                : currentLightboxData.params?.local_mode === 'text' || currentLightboxData.workflow_json === 'Z-Image.json'
                    ? 'text'
                    : '';
            if(savedLocalMode) setLocalMode(savedLocalMode);
            const savedLocalDenoise = currentLightboxData.params?.local_denoise;
            if(savedLocalDenoise !== null && savedLocalDenoise !== undefined && Number.isFinite(Number(savedLocalDenoise))) setLocalDenoise(savedLocalDenoise);
            if(typeof currentLightboxData.params?.local_include_portrait === 'boolean') setLocalPortrait(currentLightboxData.params.local_include_portrait);
            if(String(currentLightboxData.type || '').startsWith('online-local-') || savedLocalMode) setGenerationEngine('local');
            updateAdaptivePanel();
            const matchedRatio = Object.keys(SIZE_OPTIONS).find(key => SIZE_OPTIONS[key].some(([value]) => value === size)) || 'square';
            const matchedRes = SIZE_OPTIONS[matchedRatio]?.find(([value]) => value === size)?.[1];
            if(matchedRes) {
                setRatio(matchedRatio, size);
                setResolution(matchedRes);
            } else {
                setResolution('custom');
                const parsed = parseSizeValue(size);
                customWidth = parsed?.width || '';
                customHeight = parsed?.height || '';
                updateSizeUI();
            }
            closeLightbox(); window.scrollTo({top:0, behavior:'smooth'});
        }
        async function deleteHistoryItem(ts, ev){
            ev.stopPropagation();
            if(!confirm(tr('online.deleteConfirm'))) return;
            const res = await fetch('/api/history/delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({timestamp:ts})}).then(r=>r.json());
            if(res.success) document.getElementById(`history-${ts}`)?.remove();
        }
        const observer = new IntersectionObserver(entries => { if(entries[0].isIntersecting && currentIndex < allHistory.length) loadHistory(1); }, {threshold:.1});
        window.onload = async () => { applyLanguage(); updateEngineUI(); setRatio('square'); setResolution('1k'); await initModels(); await refreshComfyStatus(); await loadHistory(0); window.HistoryBulkManager?.attach({masonry:'#masonry'}); observer.observe(document.getElementById('loadMoreTrigger')); document.getElementById('loadMoreTrigger').onclick = () => loadHistory(1); };
    </script>
</body>
</html>
