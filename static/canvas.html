<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off" data-studio-skin="minimal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/images/logo.png?v=1.0.21" type="image/png">
    <title>小美画布</title>
    <script src="/static/vendor/js/tailwindcss-cdn.js?v=1.0.21.1784161005"></script>
    <script src="/static/vendor/js/lucide.js?v=1.0.21.1784161005"></script>
    <script src="/static/js/xiaomei-shell-kernel.js?v=1.0.21.1794542393"></script>
    <script src="/static/js/theme.js?v=1.0.21.1794196667"></script>
    <script src="/static/js/xiaomei-touch-input.js?v=1.0.21.1794542393"></script>
    <script src="/static/js/i18n.js?v=1.0.21.1794545156&classic-cascade=1&classic-log=1&classic-receipts=1"></script>
    <link rel="stylesheet" href="/static/css/canvas-editor-common.css?v=1.0.21.1794542393">
    <link rel="stylesheet" href="/static/css/canvas.css?v=1.0.21.1794542393&classic-x6=1&classic-ltx=1&classic-image-editor=1&classic-page=1&classic-surfaces=1&classic-overlays=1&classic-templates=1&classic-node-forms=1&classic-card-style=1&classic-toolbar=1">
    <link rel="stylesheet" href="/static/css/classic-canvas-ltx.css?v=1.0.21.1794542393">
    <link rel="stylesheet" href="/static/css/theme.css?v=1.0.21.1794192428">
    <link rel="stylesheet" href="/static/vendor/fluent/tokens.css?v=1.0.21.1790178173">
    <link rel="stylesheet" href="/static/css/fluent-ui.css?v=1.0.21.1794192428">
    <script type="module" src="/static/vendor/fluent/fluent.js?v=1.0.21.1790178173"></script>
</head>
<body>
    <div class="shell no-canvas" id="shell">
        <div class="canvas-brand editor-only">
            <span class="canvas-brand-mark"><i aria-hidden="true" data-lucide="sparkles" class="w-4 h-4"></i></span>
            <span>AI 创作画布</span>
        </div>
        <div class="canvas-zoom-pill editor-only" role="group" aria-label="画布缩放">
            <button type="button" title="缩小" data-canvas-zoom-step="-0.1"><i aria-hidden="true" data-lucide="minus" class="w-3.5 h-3.5"></i></button>
            <button type="button" title="适应全部节点" data-fit-canvas><i aria-hidden="true" data-lucide="scan" class="w-3.5 h-3.5"></i></button>
            <output id="canvasZoomLabel">100%</output>
            <button type="button" title="放大" data-canvas-zoom-step="0.1"><i aria-hidden="true" data-lucide="plus" class="w-3.5 h-3.5"></i></button>
        </div>

        <header class="topbar">
            <nav class="panel canvas-nav" aria-label="画布导航">
                <button type="button" class="tool-btn" id="backToManagerBtn"
                    aria-label="返回画布管理" title="返回画布管理" data-i18n-title="canvas.backToManager">
                    <i aria-hidden="true" data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
                <div class="canvas-nav-meta">
                    <div class="current-canvas-title" id="currentCanvasTitle">未命名画布</div>
                    <time class="current-canvas-time" id="currentCanvasTime">--</time>
                </div>
                <p id="saveState" hidden data-i18n="canvas.chooseFirst">请选择或新建画布</p>
            </nav>
            <div class="panel toolbar editor-only" id="quickToolbar" role="group" aria-label="快捷菜单">
                <button type="button" class="tool-btn toolbar-toggle" data-canvas-toolbar-toggle aria-expanded="true"
                    aria-controls="quickToolbarItems" title="折叠快捷菜单" aria-label="折叠快捷菜单">
                    <i aria-hidden="true" data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <div class="toolbar-items" id="quickToolbarItems">
                    <button type="button" class="tool-btn" data-canvas-card="image">
                        <i aria-hidden="true" data-lucide="image-plus" class="w-4 h-4"></i><span data-i18n="canvas.image">图片</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-card="prompt">
                        <i aria-hidden="true" data-lucide="text-cursor-input" class="w-4 h-4"></i><span data-i18n="canvas.prompt">提示词</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-card="loop">
                        <i aria-hidden="true" data-lucide="repeat-2" class="w-4 h-4"></i><span data-i18n="canvas.loop">循环</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-card="llm">
                        <i aria-hidden="true" data-lucide="message-square-text" class="w-4 h-4"></i><span>LLM</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-card="generator">
                        <i aria-hidden="true" data-lucide="wand-sparkles" class="w-4 h-4"></i><span data-i18n="canvas.apiGenerate">API生成</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-card="video">
                        <i aria-hidden="true" data-lucide="clapperboard" class="w-4 h-4"></i><span data-i18n="canvas.videoGenerate">视频生成</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-card="rh">
                        <i aria-hidden="true" data-lucide="workflow" class="w-4 h-4"></i><span data-i18n="canvas.rhGenerate">RH生成</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-card="output">
                        <i aria-hidden="true" data-lucide="circle-dot" class="w-4 h-4"></i><span>Output</span>
                    </button>
                    <button type="button" class="tool-btn" data-canvas-group-selection>
                        <i aria-hidden="true" data-lucide="group" class="w-4 h-4"></i><span data-i18n="canvas.group">分组</span>
                    </button>
                </div>
                <div class="toolbar-fixed">
                    <button type="button" class="tool-btn toolbar-workflow" id="workflowTransferToggle"
                        title="导入导出工作流" aria-label="导入导出工作流">
                        <i aria-hidden="true" data-lucide="package-open" class="w-4 h-4"></i><span>工作流</span>
                    </button>
                    <button type="button" class="tool-btn toolbar-asset canvas-asset-toggle" id="canvasAssetToggle"
                        title="资产库" aria-label="资产库">
                        <i aria-hidden="true" data-lucide="library" class="w-4 h-4"></i><span>资产库</span>
                    </button>
                    <button type="button" class="tool-btn toolbar-log" id="canvasLogToggle"
                        title="日志" aria-label="日志" data-i18n-title="canvas.logs">
                        <i aria-hidden="true" data-lucide="list-todo" class="w-4 h-4"></i><span data-i18n="canvas.logs">日志</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="board editor-only" id="board">
            <div class="world" id="world">
                <div class="links" id="links"></div>
                <div class="link-controls" id="linkControls"></div>
                <div id="nodes"></div>
            </div>
            <div class="drop-overlay" id="dropOverlay" data-i18n="canvas.dropImage">拖放图片到画布</div>
            <div class="selection-box" id="selectionBox" aria-hidden="true"></div>
            <div class="create-menu" id="createMenu" data-canvas-menu="create"></div>
            <div class="create-menu" id="linkCreateMenu"></div>
            <div class="create-menu" id="nodeInputMenu"></div>
            <div class="create-menu" id="nodeOutputMenu"></div>
            <div class="create-menu" id="imageNodeMenu"></div>
            <button type="button" class="minimap-arrange-btn" id="canvasArrangeBtn" title="整理选中节点" aria-label="整理选中节点">
                <i aria-hidden="true" data-lucide="layout-grid" class="w-3.5 h-3.5"></i><span>整理选中</span>
            </button>
            <div class="minimap" id="minimap" title="导航地图">
                <div class="minimap-content" id="minimapContent">
                    <div class="minimap-viewport" id="minimapViewport"></div>
                </div>
            </div>
            <aside class="canvas-asset-panel" id="canvasAssetPanel" aria-labelledby="canvasAssetHeading">
                <header class="canvas-asset-head">
                    <strong id="canvasAssetHeading"><i aria-hidden="true" data-lucide="library" class="w-4 h-4"></i><span>资产库</span></strong>
                    <button type="button" class="canvas-asset-icon-btn" id="canvasAssetCloseBtn"
                        title="关闭" data-i18n-title="common.close"><i aria-hidden="true" data-lucide="x" class="w-4 h-4"></i></button>
                </header>
                <select class="canvas-asset-select" id="canvasAssetLibrarySelect" aria-label="资产库"></select>
                <div class="canvas-asset-row">
                    <select class="canvas-asset-select" id="canvasAssetCategorySelect" aria-label="资产分组"></select>
                    <button type="button" class="canvas-asset-icon-btn" id="canvasAssetAddCategoryBtn" title="新建分组">
                        <i aria-hidden="true" data-lucide="folder-plus" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="canvas-asset-drop" id="canvasAssetDropZone">拖入图片或输出保存到当前分组</div>
                <div class="canvas-asset-grid" id="canvasAssetGrid"></div>
            </aside>

            <aside class="workflow-transfer-panel" id="workflowTransferModal" aria-labelledby="workflowTransferHeading">
                <header class="workflow-transfer-head">
                    <div>
                        <div class="workflow-transfer-title" id="workflowTransferHeading">导入导出工作流</div>
                        <p class="workflow-transfer-sub" id="workflowTransferSub">导出框选节点，或把工作流导入到当前画布</p>
                    </div>
                    <button type="button" class="canvas-asset-icon-btn" id="workflowTransferClose"
                        title="关闭" data-i18n-title="common.close"><i aria-hidden="true" data-lucide="x" class="w-4 h-4"></i></button>
                </header>
                <div class="workflow-transfer-body">
                    <section class="workflow-transfer-card">
                        <header class="workflow-transfer-card-head"><i aria-hidden="true" data-lucide="upload" class="w-4 h-4"></i><strong>导出工作流</strong></header>
                        <p>使用当前框选的节点和它们之间的连线生成工作流。</p>
                        <output class="workflow-transfer-meta" id="workflowExportMeta">未选择节点</output>
                        <div class="workflow-transfer-actions workflow-export-actions">
                            <button type="button" class="workflow-transfer-btn secondary" data-workflow-export="json">
                                <i aria-hidden="true" data-lucide="file-json" class="w-4 h-4"></i><span>导出 JSON</span>
                            </button>
                            <button type="button" class="workflow-transfer-btn primary" data-workflow-export="zip">
                                <i aria-hidden="true" data-lucide="package" class="w-4 h-4"></i><span>导出并包含资源</span>
                            </button>
                            <button type="button" class="workflow-transfer-btn secondary" id="workflowExportLibraryBtn">
                                <i aria-hidden="true" data-lucide="library-big" class="w-4 h-4"></i><span>导出到资产库</span>
                            </button>
                        </div>
                    </section>
                    <section class="workflow-transfer-card">
                        <header class="workflow-transfer-card-head"><i aria-hidden="true" data-lucide="download" class="w-4 h-4"></i><strong>导入工作流</strong></header>
                        <p>支持工作流 JSON，也支持包含资源的 ZIP 包。导入内容会追加到当前画布。</p>
                        <button type="button" class="workflow-import-drop" id="workflowImportDropZone">
                            <i aria-hidden="true" data-lucide="file-up" class="w-4 h-4"></i><span>拖入 JSON / ZIP 工作流</span>
                            <small>或点击选择文件</small>
                        </button>
                    </section>
                </div>
            </aside>
            <div class="canvas-asset-hover-preview" id="canvasAssetHoverPreview" hidden></div>
        </main>

        <section class="output-lightbox" id="outputLightbox" role="dialog" aria-label="输出预览">
            <div class="output-lightbox-shell" id="outputLightboxShell">
                <div class="output-preview" id="outputPreview">
                    <div class="output-compare" id="outputCompareContainer">
                        <img id="outputCompareResult" alt="生成结果">
                        <div class="output-compare-original-wrap" id="outputCompareOriginalWrap">
                            <img id="outputCompareOriginal" alt="原图">
                        </div>
                        <div class="output-compare-slider" id="outputCompareSlider" aria-label="原图与结果的分界线">
                            <div class="output-compare-handle"><i aria-hidden="true" data-lucide="move-horizontal" class="w-4 h-4"></i></div>
                        </div>
                    </div>
                    <img class="output-single-img" id="outputLightboxImg" alt="生成结果">
                    <video class="output-single-video" id="outputLightboxVideo" controls playsinline disablepictureinpicture
                        controlslist="nodownload noplaybackrate noremoteplayback" style="display:none"></video>
                    <footer class="output-preview-bar">
                        <output class="output-resolution" id="outputResolution">--</output>
                        <div class="output-preview-actions">
                            <button type="button" class="preview-icon-btn" id="outputDownloadBtn"
                                title="下载" aria-label="下载" data-i18n-title="canvas.download"><i aria-hidden="true" data-lucide="download" class="w-4 h-4"></i></button>
                            <button type="button" class="preview-icon-btn" id="outputDownloadAllBtn" style="display:none"
                                title="下载全部图片" aria-label="下载全部图片" data-i18n-title="canvas.outputDownloadAllImages">
                                <i aria-hidden="true" data-lucide="archive" class="w-4 h-4"></i>
                            </button>
                            <button type="button" class="preview-icon-btn" data-output-preview-close
                                title="关闭" aria-label="关闭" data-i18n-title="common.close"><i aria-hidden="true" data-lucide="x" class="w-4 h-4"></i></button>
                        </div>
                    </footer>
                </div>
                <div class="output-prompt-panel" id="outputPromptPanel">
                    <div class="output-prompt-text" id="outputPromptText"></div>
                    <div class="output-prompt-actions">
                        <button type="button" class="preview-text-btn secondary" id="outputCopyPromptBtn">
                            <i aria-hidden="true" data-lucide="copy" class="w-3.5 h-3.5"></i><span data-i18n="canvas.copyPrompt">复制提示词</span>
                        </button>
                        <button type="button" class="preview-text-btn" id="outputRerunBtn">
                            <i aria-hidden="true" data-lucide="refresh-cw" class="w-3.5 h-3.5"></i><span data-i18n="canvas.rerun">再次运行</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="prompt-template-modal" id="promptTemplateModal" role="dialog" aria-labelledby="promptLibraryHeading">
            <div class="prompt-template-panel" id="promptTemplatePanel">
                <header class="prompt-template-head">
                    <div>
                        <strong id="promptLibraryHeading" data-i18n="smart.promptTemplateLibrary">模板库</strong>
                        <span data-i18n="canvas.promptTemplateSystem">系统提示词</span>
                    </div>
                    <button type="button" id="promptTemplateClose" title="关闭" aria-label="关闭" data-i18n-title="common.close">
                        <i aria-hidden="true" data-lucide="x"></i>
                    </button>
                </header>
                <select class="prompt-template-library-select" id="promptTemplateLibrarySelect"
                    title="选择提示词库" aria-label="选择提示词库"></select>
                <div class="prompt-template-search">
                    <i aria-hidden="true" data-lucide="search"></i>
                    <input type="search" id="promptTemplateSearch" aria-label="搜索模板"
                        placeholder="搜索模板..." data-i18n-placeholder="canvas.promptTemplateSearch">
                </div>
                <div class="prompt-template-cats" id="promptTemplateCats"></div>
                <p class="prompt-template-notice" id="promptTemplateNotice" role="status" hidden></p>
                <div class="prompt-template-body" id="promptTemplateBody"></div>
            </div>
        </section>

        <section class="log-modal" id="logModal" role="dialog" aria-labelledby="canvasLogHeading">
            <div class="log-panel">
                <header class="log-head">
                    <div class="log-title" id="canvasLogHeading" data-i18n="canvas.generationLogs">生成日志</div>
                    <button type="button" class="preview-icon-btn" data-log-close title="关闭"
                        data-i18n-title="common.close"><i aria-hidden="true" data-lucide="x" class="w-4 h-4"></i></button>
                </header>
                <div class="log-list" id="logList"></div>
            </div>
        </section>

        <input type="file" id="workflowImportInput" accept=".json,.zip" hidden>

        <section class="image-edit-modal" id="imageEditModal" role="dialog" aria-labelledby="imageEditTitle">
            <div class="image-edit-panel">
                <header class="image-edit-head">
                    <div class="image-edit-headline">
                        <div class="image-edit-title" id="imageEditTitle" data-i18n="canvas.editImage">编辑图片</div>
                        <p class="image-edit-sub" id="imageEditSub" data-i18n="canvas.editImageSub">选择裁剪、遮罩或画笔模式</p>
                    </div>
                    <div class="image-edit-mode" role="group" aria-label="图片编辑模式">
                        <button type="button" data-image-edit-mode="preview" class="active">
                            <i aria-hidden="true" data-lucide="eye" class="w-3.5 h-3.5"></i><span data-i18n="canvas.modePreview">预览</span>
                        </button>
                        <button type="button" data-image-edit-mode="crop">
                            <i aria-hidden="true" data-lucide="crop" class="w-3.5 h-3.5"></i><span data-i18n="canvas.modeCrop">裁剪</span>
                        </button>
                        <button type="button" data-image-edit-mode="outpaint">
                            <i aria-hidden="true" data-lucide="expand" class="w-3.5 h-3.5"></i><span data-i18n="canvas.modeOutpaint">扩展</span>
                        </button>
                        <button type="button" data-image-edit-mode="mask">
                            <i aria-hidden="true" data-lucide="brush" class="w-3.5 h-3.5"></i><span data-i18n="canvas.modeMask">遮罩</span>
                        </button>
                        <button type="button" data-image-edit-mode="brush">
                            <i aria-hidden="true" data-lucide="paintbrush" class="w-3.5 h-3.5"></i><span data-i18n="canvas.modeBrush">画笔</span>
                        </button>
                        <button type="button" data-image-edit-mode="resize">
                            <i aria-hidden="true" data-lucide="minimize-2" class="w-3.5 h-3.5"></i><span>缩放</span>
                        </button>
                        <button type="button" data-image-edit-mode="grid">
                            <i aria-hidden="true" data-lucide="grid-3x3" class="w-3.5 h-3.5"></i><span data-i18n="canvas.modeGrid">宫格切分</span>
                        </button>
                    </div>
                    <div class="image-edit-head-end">
                        <button type="button" class="preview-icon-btn" data-editor-close title="关闭" data-i18n-title="common.close">
                            <i aria-hidden="true" data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </header>

                <div class="image-edit-tools crop-ratio-tools" id="imageCropTools">
                    <span class="image-edit-sub">比例</span>
                    <button type="button" class="crop-ratio-btn active" data-crop-ratio="free">自由</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="source">原图</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="1:1">1:1</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="4:3">4:3</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="3:4">3:4</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="16:9">16:9</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="9:16">9:16</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="3:2">3:2</button>
                    <button type="button" class="crop-ratio-btn" data-crop-ratio="2:3">2:3</button>
                </div>

                <div class="image-edit-tools" id="imageMaskTools">
                    <label>
                        <span data-i18n="canvas.brushSize">笔刷</span>
                        <input type="range" id="maskBrushSize" min="4" max="160" value="42">
                    </label>
                    <button type="button" class="image-edit-btn secondary" id="maskUndoBtn" title="撤销"><i aria-hidden="true" data-lucide="undo-2" class="w-4 h-4"></i></button>
                    <button type="button" class="image-edit-btn secondary" id="maskRedoBtn" title="恢复"><i aria-hidden="true" data-lucide="redo-2" class="w-4 h-4"></i></button>
                    <button type="button" class="image-edit-btn secondary" data-ink-clear>
                        <i aria-hidden="true" data-lucide="eraser" class="w-4 h-4"></i><span data-i18n="canvas.clear">清空</span>
                    </button>
                    <span class="image-edit-sub" data-i18n="canvas.maskHint">白色区域为要编辑的遮罩</span>
                </div>

                <div class="image-edit-tools" id="imageBrushTools">
                    <button type="button" class="image-edit-btn primary" data-brush-tool="free" title="自由画笔">
                        <i aria-hidden="true" data-lucide="paintbrush" class="w-4 h-4"></i>
                    </button>
                    <button type="button" class="image-edit-btn secondary" data-brush-tool="rect" title="矩形">
                        <i aria-hidden="true" data-lucide="square" class="w-4 h-4"></i>
                    </button>
                    <button type="button" class="image-edit-btn secondary" data-brush-tool="ellipse" title="椭圆">
                        <i aria-hidden="true" data-lucide="circle" class="w-4 h-4"></i>
                    </button>
                    <button type="button" class="image-edit-btn secondary" data-brush-tool="label" title="数字标签">
                        <i aria-hidden="true" data-lucide="list-ordered" class="w-4 h-4"></i>
                    </button>
                    <button type="button" class="image-edit-btn secondary" data-brush-tool="text" title="文字标签">
                        <i aria-hidden="true" data-lucide="type" class="w-4 h-4"></i>
                    </button>
                    <label>
                        <span data-i18n="canvas.color">颜色</span>
                        <input type="color" id="paintBrushColor" value="#ff2d55">
                    </label>
                    <label>
                        <span data-i18n="canvas.brushSize">笔刷</span>
                        <input type="range" id="paintBrushSize" min="2" max="80" value="14">
                    </label>
                    <button type="button" class="image-edit-btn secondary" id="brushUndoBtn" title="撤销"><i aria-hidden="true" data-lucide="undo-2" class="w-4 h-4"></i></button>
                    <button type="button" class="image-edit-btn secondary" id="brushRedoBtn" title="恢复"><i aria-hidden="true" data-lucide="redo-2" class="w-4 h-4"></i></button>
                    <button type="button" class="image-edit-btn secondary" data-ink-clear>
                        <i aria-hidden="true" data-lucide="eraser" class="w-4 h-4"></i><span data-i18n="canvas.clear">清空</span>
                    </button>
                </div>

                <div class="image-edit-tools image-resize-tools" id="imageResizeTools">
                    <label>
                        <span>倍数</span>
                        <input type="range" id="imageResizeScaleRange" min="0.05" max="1" step="0.05" value="0.5">
                    </label>
                    <label>
                        <input type="number" id="imageResizeScaleInput" aria-label="缩放倍数" min="0.05" max="1" step="0.05" value="0.5">
                        <span>×</span>
                    </label>

                            </div>

                    </button>
                </footer>
            </div>

                </footer>
            </div>
        </section>
