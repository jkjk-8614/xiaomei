<!DOCTYPE html>
<html lang="zh-CN" data-studio-skin="minimal">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史记录 - 小美画布</title>
    <script>
        try {
            if(new URLSearchParams(location.search).get('drawer') === '1') document.documentElement.classList.add('drawer-mode');
        } catch(e) {}
    </script>

    <link rel="stylesheet" href="/static/css/theme.css?v=2026.08.20.1785985827">
    <style>
        *{box-sizing:border-box}
        :root{--bg:#f7faf6;--card:#fff;--text:#111827;--muted:#8993a4;--line:#e5ebe4;--soft:#eef5ec;--accent:#111827;--danger:#d94b4b}
        html.studio-theme-dark{--bg:#111814;--card:#18211c;--text:#eef4ef;--muted:#9aa89e;--line:#2b3930;--soft:#202c25;--accent:#f1f5f2;--danger:#ff7b7b}
        html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}
        html.preview-open,body.preview-open{overflow:hidden!important}
        body{padding:28px 34px 70px}
        .page{max-width:1500px;margin:0 auto}
        .head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
        h1{font-size:25px;line-height:1;margin:0 0 9px;font-weight:900;letter-spacing:-.04em}
        .subtitle{margin:0;color:var(--muted);font-size:12px}
        .toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        button,.search{height:38px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text)}
        button{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 13px;font-weight:700;cursor:pointer}
        button:hover{border-color:#aebbb0;transform:translateY(-1px)}
        button svg{width:15px;height:15px}
        .search{width:230px;padding:0 13px;outline:none}
        .search:focus{border-color:var(--text)}
        .filters{display:flex;gap:7px;margin-bottom:20px;overflow:auto;padding-bottom:2px}
        .filter{flex:0 0 auto;white-space:nowrap}
        .filter.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
        .summary{margin-left:auto;color:var(--muted);font-size:12px;display:flex;align-items:center;padding:0 6px;white-space:nowrap}
        .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
        .card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s ease;box-shadow:0 2px 8px rgba(20,40,25,.025)}
        .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(20,40,25,.09)}
        .thumb{position:relative;aspect-ratio:1/1;background:var(--soft);cursor:grab;overflow:hidden}
        .thumb.dragging{cursor:grabbing;opacity:.72}
        .thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
        .card:hover .thumb img,.card:hover .thumb video{transform:scale(1.025)}
        .drag-hint{position:absolute;left:50%;bottom:10px;z-index:1;padding:5px 9px;border-radius:99px;background:rgba(15,23,42,.78);color:#fff;font-size:10px;font-weight:800;white-space:nowrap;pointer-events:none;opacity:0;transform:translate(-50%,5px);transition:opacity .16s ease,transform .16s ease}
        .card:hover .drag-hint,.thumb:focus-visible .drag-hint,html.drawer-mode .drag-hint{opacity:1;transform:translate(-50%,0)}
        .type{position:absolute;top:10px;left:10px;padding:4px 8px;border-radius:99px;background:rgba(20,30,23,.72);color:#fff;font-size:10px;font-weight:800;backdrop-filter:blur(8px)}
        .multi{position:absolute;top:10px;right:10px;padding:4px 7px;border-radius:99px;background:rgba(20,30,23,.72);color:#fff;font-size:10px;font-weight:800}
        .body{padding:12px}
        .prompt{font-size:12px;font-weight:700;line-height:1.55;height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
        .meta{display:flex;align-items:center;gap:6px;margin-top:9px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden}
        .meta span{overflow:hidden;text-overflow:ellipsis}
        .actions{display:flex;align-items:center;gap:2px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
        .icon-btn{width:27px;height:29px;padding:0;border:0;background:transparent;color:var(--muted)}
        .icon-btn:hover{color:var(--text);background:var(--soft);transform:none}
        .icon-btn.copied{color:#15803d;background:#dcfce7}
        html.studio-theme-dark .icon-btn.copied{color:#86efac;background:rgba(22,101,52,.34)}
        .icon-btn.danger:hover{color:var(--danger)}
        .spacer{flex:1}
        .history-image-context-menu{position:fixed;z-index:40;min-width:142px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:0 14px 34px rgba(15,23,42,.2)}
        .history-image-context-menu[hidden]{display:none}
        .history-image-context-menu button{width:100%;height:34px;justify-content:flex-start;padding:0 10px;border:0;background:transparent;font-size:12px}
        .history-image-context-menu button:hover{background:var(--soft);transform:none}
        .history-image-context-menu button svg{width:15px;height:15px}
        .empty,.loading{min-height:390px;border:1px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;background:color-mix(in srgb,var(--card) 55%,transparent)}
        .empty svg,.loading svg{width:28px;height:28px}
        .loading svg{animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .more{display:flex;justify-content:center;margin-top:24px}
        .more button{min-width:150px}
        .modal{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:30px;border:0;z-index:20;background:rgba(7,12,9,.72);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;overflow:hidden}
        .modal[open]{display:flex}
        .modal::backdrop{background:transparent}
        .preview{position:relative;max-width:min(1050px,92vw);max-height:calc(100dvh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
        .preview img,.preview video{display:block;max-width:100%;max-height:calc(100dvh - 120px);object-fit:contain;border-radius:16px;box-shadow:0 18px 70px rgba(0,0,0,.35)}
        .preview img[hidden],.preview video[hidden]{display:none}
        .preview-caption{max-width:850px;color:#fff;font-size:12px;line-height:1.6;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .modal-close{position:fixed;right:24px;top:22px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:22px}
        @media(max-width:1250px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
        @media(max-width:920px){body{padding:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.head{align-items:flex-start;flex-direction:column}.toolbar{width:100%}.search{flex:1}}
        @media(max-width:640px){
            .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
            .summary{display:none}
            .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;overflow:visible;padding-bottom:0}
            .filter{width:100%;min-width:0;height:34px;padding:0 4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        }
        html.drawer-mode body{padding:14px 12px 24px}
        html.drawer-mode .page{max-width:none}
        html.drawer-mode .head{align-items:flex-start;margin-bottom:12px;padding-right:42px}
        html.drawer-mode h1{font-size:19px;margin-bottom:5px}
        html.drawer-mode .subtitle{font-size:10px}
        html.drawer-mode .toolbar{width:100%;margin-top:10px}
        html.drawer-mode .search{width:auto;flex:1;min-width:0}
        html.drawer-mode .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:12px;overflow:visible;padding-bottom:0}
        html.drawer-mode .filter{width:100%;min-width:0;height:34px;padding:0 4px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        html.drawer-mode .summary{display:none}
        html.drawer-mode .grid{grid-template-columns:1fr;gap:12px}
        html.drawer-mode .card{border-radius:14px}
        html.drawer-mode .thumb{aspect-ratio:16/10}
        html.drawer-mode .body{padding:10px}
        html.drawer-mode .prompt{font-size:11px}
        html.drawer-mode .empty,html.drawer-mode .loading{min-height:300px}
    </style>
    <link rel="stylesheet" href="/static/css/apple-inspired.css?v=2026.08.20.1789013930">

<body>
    <div class="page">
        <div class="head">
        <div><h1>历史记录</h1><p class="subtitle">查看、下载和管理所有生成图片和视频；图片拖到画布保留原图，拖到外部会自动压缩。</p></div>
            <div class="toolbar">
                <input id="search" class="search" type="search" placeholder="搜索提示词或模型" oninput="applyFilters()">
                <button type="button" onclick="loadHistory(true)"><i data-lucide="refresh-cw"></i>刷新</button>
            </div>
        </div>
        <div class="filters">
            <button class="filter active" data-type="all" onclick="setFilter(this)">全部</button>
            <button class="filter" data-type="online" onclick="setFilter(this)">在线生图</button>
            <button class="filter" data-type="chat" onclick="setFilter(this)">GPT 对话</button>
            <button class="filter" data-type="canvas" onclick="setFilter(this)">小美画布</button>
            <button class="filter" data-type="commerce" onclick="setFilter(this)">电商工作台</button>
            <button class="filter" data-type="video" onclick="setFilter(this)">视频</button>
            <div id="summary" class="summary">0 条记录</div>
        </div>
        <div id="content"><div class="loading"><i data-lucide="loader-circle"></i><span>正在加载历史记录</span></div></div>
        <div id="more" class="more" hidden><button onclick="showMore()">加载更多</button></div>
    </div>
    <dialog id="modal" class="modal" onclick="if(event.target===this) closePreview()">
        <button class="modal-close" onclick="closePreview()" aria-label="关闭">×</button>
        <div class="preview"><img id="previewImage" alt="历史图片预览" oncontextmenu="openHistoryImageContextMenu(event,this.currentSrc||this.src,'image')"><video id="previewVideo" controls playsinline preload="metadata" hidden oncontextmenu="event.preventDefault()"></video><div id="previewCaption" class="preview-caption"></div></div>
    </dialog>
    <div id="historyImageContextMenu" class="history-image-context-menu" role="menu" aria-label="图片操作" hidden>
        <button id="historyImageContextCopy" type="button" role="menuitem" onclick="copyHistoryContextImage(event)"><i data-lucide="clipboard"></i><span>复制图片</span></button>
    </div>
    <script>
        let allRecords = [];
        let filteredRecords = [];
        let activeType = 'all';
        let visibleCount = 60;

        const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
        const VIDEO_URL_RE = /\.(mp4|webm|mov|m4v|avi|mkv|flv)(?:[?#].*)?$/i;
        const GROUP_LABELS = {online:'在线生图',chat:'GPT 对话',canvas:'小美画布',commerce:'电商工作台',video:'视频'};
        function mediaUrl(value){
            if(value && typeof value === 'object') return String(value.url || value.src || value.path || value.uri || '').trim();
            return String(value || '').trim();
        }
        function mediaKind(value,fallback='image'){
            const hinted = String(value && typeof value === 'object' ? (value.kind || value.mediaKind || value.type || '') : '').trim().toLowerCase();
            if(hinted.includes('video')) return 'video';
            if(hinted.includes('image')) return 'image';
            return VIDEO_URL_RE.test(mediaUrl(value)) ? 'video' : (fallback || 'image');
        }
        function recordMediaEntries(item){
            const entries = [];
            const seen = new Set();
            const add = (value,fallback='image') => {
                if(Array.isArray(value)){ value.forEach(itemValue => add(itemValue,fallback)); return; }
                const url = mediaUrl(value);
                if(!url || seen.has(url)) return;
                seen.add(url);
                entries.push({url,kind:mediaKind(value,fallback),name:String(value && typeof value === 'object' ? (value.name || '') : '')});
            };
            add(item?.video_items,'video');
            add(item?.videos,'video');
            add(item?.items,'');
            add(item?.media_items,'');
            add(item?.image_items,'image');
            add(item?.images,'image');
            add(item?.outputs,'');
            return entries;
        }
        function recordHasVideo(item){ return recordMediaEntries(item).some(media => media.kind === 'video'); }
        function recordSource(item){
            const raw = [item?.history_source, item?.source, item?.params?.history_source, item?.params?.source]
                .find(value => String(value || '').trim());
            return String(raw || '').trim().toLowerCase().replace(/[\s-]+/g,'_');
        }
        function recordGroup(item){
            const type = String(item?.type || '').toLowerCase();
            const source = recordSource(item);
            if(recordHasVideo(item) || type === 'video' || type.includes('video')) return 'video';
            if(source === 'online' || source === 'online_image') return 'online';
            if(source === 'chat' || source === 'gpt_chat' || source === 'gpt') return 'chat';
            if(source === 'canvas' || source === 'smart_canvas') return 'canvas';
            if(source === 'commerce' || source === 'commerce_workbench' || source === 'ecommerce') return 'commerce';
            if(type === 'online') return 'online';
            if(type === 'chat' || type === 'gpt-chat' || type === 'gpt_chat') return 'chat';
            if(type === 'commerce' || type.includes('commerce')) return 'commerce';
            if(type === 'canvas' || type.includes('canvas')) return 'canvas';
            // ComfyUI records from older canvas builds did not carry a source field.
            if(item.workflow_json || item.prompt_id || item.backend) return 'canvas';
            return 'other';
        }
        function typeLabel(item){ return GROUP_LABELS[recordGroup(item)] || '生成记录'; }
        function formatTime(ts){
            const date = new Date(Number(ts) * 1000);
            if(Number.isNaN(date.getTime())) return '--';
            return date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace('/','-');
        }
        async function loadHistory(reset=false){
            if(reset) visibleCount = 60;
            document.getElementById('content').innerHTML = '<div class="loading"><i data-lucide="loader-circle"></i><span>正在加载历史记录</span></div>';
            lucide.createIcons();
            try{
                const response = await fetch('/api/history',{cache:'no-store'});
                if(!response.ok) throw new Error('历史记录加载失败');
                allRecords = await response.json();
                if(!Array.isArray(allRecords)) allRecords = [];
                applyFilters();
            }catch(error){
                document.getElementById('content').innerHTML = `<div class="empty"><i data-lucide="circle-alert"></i><strong>${esc(error.message)}</strong><button onclick="loadHistory(true)">重新加载</button></div>`;
                lucide.createIcons();
            }
        }
        function setFilter(button){
            activeType = button.dataset.type;
            document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active',item===button));
            visibleCount = 60;
            applyFilters();
        }
        function applyFilters(){
            const query = document.getElementById('search').value.trim().toLowerCase();
            filteredRecords = allRecords.filter(item => {
                if(activeType !== 'all' && recordGroup(item) !== activeType) return false;
                if(!query) return true;
                return [item.prompt,item.model,item.provider_name,item.type,item.history_source,item.params?.source].some(value => String(value || '').toLowerCase().includes(query));
            });
            render();
        }
        function render(){
            document.getElementById('summary').textContent = `${filteredRecords.length} 条记录`;
            const records = filteredRecords.slice(0,visibleCount);
            if(!records.length){
                document.getElementById('content').innerHTML = '<div class="empty"><i data-lucide="history"></i><strong>还没有历史记录</strong><span>生成图片或视频后会自动出现在这里</span></div>';
                document.getElementById('more').hidden = true;
                lucide.createIcons(); return;
            }
            document.getElementById('content').innerHTML = `<div class="grid">${records.map(cardHtml).join('')}</div>`;
            document.getElementById('more').hidden = records.length >= filteredRecords.length;
            lucide.createIcons();
        }
        function cardHtml(item){
            const mediaItems = recordMediaEntries(item);
            const media = mediaItems[0];
            if(!media) return '';
            const prompt = item.prompt || '未填写提示词';
            const model = item.model || item.params?.model || '未知模型';
            const ts = Number(item.timestamp || 0);
            const mediaMarkup = media.kind === 'video'
                ? `<video class="thumb-media" src="${esc(media.url)}" muted controls preload="metadata" playsinline onclick="event.stopPropagation()" onmousedown="event.stopPropagation()"></video>`
                : `<img class="thumb-media" src="${esc(media.url)}" alt="生成图片" loading="lazy">`;
            const copyButton = media.kind === 'video' ? '' : `<button class="icon-btn" title="复制图片" aria-label="复制图片" onclick="copyImage(this.closest('.card').querySelector('.thumb').dataset.mediaUrl,this)"><i data-lucide="clipboard"></i></button>`;
            const dragHint = media.kind === 'image' ? '<span class="drag-hint">拖到画布 · 拖出自动压缩</span>' : '';
            const countBadge = mediaItems.length > 1 ? `<span class="multi">${mediaItems.length} 个</span>` : '';
            return `<article class="card" data-ts="${ts}">
                <div class="thumb" draggable="${media.kind === 'image'}" data-media-url="${esc(media.url)}" data-media-kind="${media.kind}" data-media-name="${esc(media.name || '')}" onclick="openPreview(this.dataset.mediaUrl,this.closest('.card').querySelector('.prompt').dataset.full,this.dataset.mediaKind)" oncontextmenu="openHistoryImageContextMenu(event,this.dataset.mediaUrl,this.dataset.mediaKind)" ondragstart="startHistoryMediaDrag(event,this)" ondragend="endHistoryMediaDrag(event,this)" title="${media.kind === 'video' ? '点击播放视频' : '拖到画布保留原图；拖到外部自动压缩'}">
                    ${mediaMarkup}<span class="type">${esc(typeLabel(item))}</span>${countBadge}${dragHint}
                </div>
                <div class="body"><div class="prompt" data-full="${esc(prompt)}">${esc(prompt)}</div>
                    <div class="meta"><span>${esc(formatTime(ts))}</span><b>·</b><span>${esc(model)}</span></div>
                    <div class="actions"><button class="icon-btn" title="预览" aria-label="预览" onclick="openPreview(this.closest('.card').querySelector('.thumb').dataset.mediaUrl,this.closest('.card').querySelector('.prompt').dataset.full,this.closest('.card').querySelector('.thumb').dataset.mediaKind)"><i data-lucide="maximize-2"></i></button><button class="icon-btn" title="下载" aria-label="下载" onclick="downloadMedia(this.closest('.card').querySelector('.thumb').dataset.mediaUrl,this.closest('.card').querySelector('.thumb').dataset.mediaKind)"><i data-lucide="download"></i></button>${copyButton}<button class="icon-btn" title="复制提示词" aria-label="复制提示词" onclick="copyPrompt(this)"><i data-lucide="copy"></i></button><span class="spacer"></span><button class="icon-btn danger" title="从历史记录移除" aria-label="从历史记录移除" onclick="deleteRecord(${ts},this)"><i data-lucide="trash-2"></i></button></div>
                </div></article>`;
        }
        function showMore(){ visibleCount += 60; render(); }
        function notifyHistoryDragState(active){
            if(window.parent === window) return;
            try { window.parent.postMessage({type:'history-drag-state', active:Boolean(active)}, location.origin); } catch(e) {}
        }
        const HISTORY_DRAG_MAX_EDGE = 2048;
        const HISTORY_DRAG_JPEG_QUALITY = .82;
        const HISTORY_DRAG_WEBP_QUALITY = .84;
        function historyDragFileName(thumb, extension){
            let name = String(thumb?.dataset?.mediaName || '').trim();
            if(!name){
                try{
                    const url = new URL(thumb?.dataset?.mediaUrl || '',location.href);
                    name = decodeURIComponent(url.pathname.split('/').pop() || '');
                }catch(e){}
            }
            name = name.replace(/\.[^.]+$/,'').replace(/[<>:"/\\|?*\u0000-\u001f]/g,'_').trim();
            return `${name || '小美画布图片'}.${extension}`;
        }
        function compressHistoryImageForDrag(thumb){
            const image = thumb?.querySelector('img.thumb-media');
            if(!image?.complete || !image.naturalWidth || !image.naturalHeight) return null;
            const scale = Math.min(1,HISTORY_DRAG_MAX_EDGE / image.naturalWidth,HISTORY_DRAG_MAX_EDGE / image.naturalHeight);
            const width = Math.max(1,Math.round(image.naturalWidth * scale));
            const height = Math.max(1,Math.round(image.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            try{
                const context = canvas.getContext('2d',{willReadFrequently:true});
                if(!context) return null;
                context.imageSmoothingEnabled = true;
                context.imageSmoothingQuality = 'high';
                context.drawImage(image,0,0,width,height);
                let hasTransparency = false;
                const pixels = context.getImageData(0,0,width,height).data;
                for(let index = 3; index < pixels.length; index += 4){
                    if(pixels[index] < 255){ hasTransparency = true; break; }
                }
                let dataUrl = '';
                let mime = 'image/jpeg';
                let extension = 'jpg';
                if(hasTransparency){
                    const webp = canvas.toDataURL('image/webp',HISTORY_DRAG_WEBP_QUALITY);
                    if(/^data:image\/webp;base64,/i.test(webp)){
                        dataUrl = webp;
                        mime = 'image/webp';
                        extension = 'webp';
                    }else{
                        dataUrl = canvas.toDataURL('image/png');
                        mime = 'image/png';
                        extension = 'png';
                    }
                }else{
                    dataUrl = canvas.toDataURL('image/jpeg',HISTORY_DRAG_JPEG_QUALITY);
                }
                if(!/^data:image\/(?:jpeg|png|webp);base64,/i.test(dataUrl)) return null;
                return {dataUrl,mime,extension,width,height};
            }catch(error){
                // 跨域图片可能禁止画布读取；这种情况下继续使用原始 URL，保证拖拽仍可用。
                console.warn('[history] drag compression skipped',error);
                return null;
            }finally{
                canvas.width = 0;
                canvas.height = 0;
            }
        }
        function startHistoryMediaDrag(event, thumb){
            const transfer = event?.dataTransfer;
            const rawUrl = thumb?.dataset?.mediaUrl || '';
            const kind = thumb?.dataset?.mediaKind || 'image';
            if(!transfer || !rawUrl || kind !== 'image') { event?.preventDefault?.(); return; }
            let url = rawUrl;
            try { url = new URL(rawUrl, location.href).href; } catch(e) {}
            if(!/^https?:\/\//i.test(url) && !/^data:image\//i.test(url)) {
                event.preventDefault();
                return;
            }
            transfer.effectAllowed = 'copy';
            // 画布继续读取原始 URL；DownloadURL 和 image/* 类型提供给外部应用使用的压缩副本。
            const dragExport = compressHistoryImageForDrag(thumb);
            const externalUrl = dragExport?.dataUrl || url;
            const externalMime = dragExport?.mime || 'image/png';
            const externalExtension = dragExport?.extension || 'png';
            const externalName = historyDragFileName(thumb,externalExtension);
            try { transfer.setData('application/x-smart-history-image', JSON.stringify({url, source:'history', kind:'image', compressed:Boolean(dragExport), width:dragExport?.width || 0, height:dragExport?.height || 0})); } catch(e) {}
            try { transfer.setData('text/uri-list', url); } catch(e) {}
            transfer.setData('text/plain', url);
            try { transfer.setData('DownloadURL', `${externalMime}:${externalName}:${externalUrl}`); } catch(e) {}
            if(dragExport){
                try { transfer.setData(externalMime, externalUrl); } catch(e) {}
            }
            thumb.classList.add('dragging');
            notifyHistoryDragState(true);
        }
        function endHistoryMediaDrag(event, thumb){
            thumb?.classList.remove('dragging');
            notifyHistoryDragState(false);
        }
        let historyContextImageUrl = '';
        function closeHistoryImageContextMenu(){
            const menu = document.getElementById('historyImageContextMenu');
            if(!menu) return;
            menu.hidden = true;
            menu.style.left = '';
            menu.style.top = '';
            historyContextImageUrl = '';
        }
        function openHistoryImageContextMenu(event,url,kind='image'){
            if(!url || kind === 'video') return;
            event.preventDefault();
            event.stopPropagation();
            const menu = document.getElementById('historyImageContextMenu');
            if(!menu) return;
            historyContextImageUrl = String(url);
            menu.hidden = false;
            const margin = 8;
            const maxLeft = Math.max(margin,window.innerWidth - menu.offsetWidth - margin);
            const maxTop = Math.max(margin,window.innerHeight - menu.offsetHeight - margin);
            menu.style.left = `${Math.min(Math.max(margin,event.clientX),maxLeft)}px`;
            menu.style.top = `${Math.min(Math.max(margin,event.clientY),maxTop)}px`;
            menu.querySelector('button')?.focus({preventScroll:true});
        }
        async function copyHistoryContextImage(event){
            event?.preventDefault();
            event?.stopPropagation();
            const button = document.getElementById('historyImageContextCopy');
            const url = historyContextImageUrl;
            closeHistoryImageContextMenu();
            await copyImage(url,button);
        }
        function historyElectronApi(){
            if(window.electronAPI?.writeImageToClipboard) return window.electronAPI;
            try{
                if(window.parent && window.parent !== window && window.parent.electronAPI?.writeImageToClipboard){
                    return window.parent.electronAPI;
                }
            }catch(error){}
            return null;
        }
        async function imageBlobToPng(blob){
            if(String(blob?.type || '').toLowerCase() === 'image/png') return blob;
            const objectUrl = URL.createObjectURL(blob);
            try{
                const imageEl = await new Promise((resolve,reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error('图片解码失败'));
                    image.src = objectUrl;
                });
                const canvasEl = document.createElement('canvas');
                canvasEl.width = Math.max(1,imageEl.naturalWidth || imageEl.width || 1);
                canvasEl.height = Math.max(1,imageEl.naturalHeight || imageEl.height || 1);
                const context = canvasEl.getContext('2d');
                if(!context) throw new Error('无法创建图片画布');
                context.drawImage(imageEl,0,0,canvasEl.width,canvasEl.height);
                const png = await new Promise(resolve => canvasEl.toBlob(resolve,'image/png'));
                if(!png) throw new Error('无法转换图片格式');
                return png;
            }finally{ URL.revokeObjectURL(objectUrl); }
        }
        async function loadHistoryImagePng(url){
            const response = await fetch(url,{credentials:'same-origin'});
            if(!response.ok) throw new Error(`图片读取失败（${response.status}）`);
            const blob = await response.blob();
            if(!/^image\//i.test(String(blob.type || ''))) throw new Error('读取到的内容不是图片');
            return imageBlobToPng(blob);
        }
        function markImageCopied(button){
            if(!button) return;
            clearTimeout(button._copyTimer);
            button.classList.add('copied');
            button.title = '已复制图片';
            button.setAttribute('aria-label','已复制图片');
            button.innerHTML = '<i data-lucide="check"></i>';
            lucide.createIcons();
            button._copyTimer = setTimeout(() => {
                button.classList.remove('copied');
                button.title = '复制图片';
                button.setAttribute('aria-label','复制图片');
                button.innerHTML = '<i data-lucide="clipboard"></i>';
                lucide.createIcons();
            },1600);
        }
        async function copyImage(url,button){
            if(!url || button?.disabled) return false;
            if(button) button.disabled = true;
            try{
                const electron = historyElectronApi();
                if(electron?.writeImageToClipboard){
                    const png = await loadHistoryImagePng(url);
                    const result = await electron.writeImageToClipboard(await png.arrayBuffer());
                    if(!result?.ok) throw new Error(result?.message || '桌面剪贴板写入失败');
                }else{
                    const ClipboardItemCtor = window.ClipboardItem;
                    if(!navigator.clipboard?.write || typeof ClipboardItemCtor !== 'function') throw new Error('当前浏览器不支持复制图片');
                    // 在用户点击的同步调用栈内先发起写入，避免图片读取完成后失去临时授权。
                    const pngPromise = loadHistoryImagePng(url);
                    await navigator.clipboard.write([new ClipboardItemCtor({'image/png':pngPromise})]);
                }
                markImageCopied(button);
                return true;
            }catch(error){
                console.warn('[history] copy image failed',error);
                alert('复制图片失败，请使用下载按钮');
                return false;
            }finally{ if(button) button.disabled = false; }
        }
        function openPreview(url,prompt,kind='image'){
            if(!url) return;
            if(window.parent && window.parent !== window){
                const items = filteredRecords.map(item => {
                    const media = recordMediaEntries(item)[0];
                    return {
                        url: media?.url || '',
                        kind: media?.kind || 'image',
                        prompt: item.prompt || '',
                        model: item.model || item.params?.model || '',
                        timestamp: Number(item.timestamp || 0)
                    };
                }).filter(item => item.url);
                const index = Math.max(0,items.findIndex(item => item.url === url && item.kind === kind));
                window.parent.postMessage({ type:'history-preview-open', items, index }, location.origin);
                return;
            }
            const modal = document.getElementById('modal');
            const image = document.getElementById('previewImage');
            const video = document.getElementById('previewVideo');
            if(kind === 'video'){
                image.hidden = true;
                image.removeAttribute('src');
                video.hidden = false;
                video.src = url;
                video.load();
            }else{
                video.pause();
                video.hidden = true;
                video.removeAttribute('src');
                video.load();
                image.hidden = false;
                image.src = url;
            }
            document.getElementById('previewCaption').textContent = prompt || '';
            document.documentElement.classList.add('preview-open');
            document.body.classList.add('preview-open');
            if(!modal.open) modal.showModal();
            modal.scrollTop = 0;
        }
        function closePreview(){
            const modal = document.getElementById('modal');
            if(modal.open) modal.close();
            document.documentElement.classList.remove('preview-open');
            document.body.classList.remove('preview-open');
            document.getElementById('previewImage').src='';
            const video = document.getElementById('previewVideo');
            video.pause();
            video.hidden = true;
            video.removeAttribute('src');
            video.load();
        }
        async function downloadMedia(url,kind='image'){
            if(!url) return;
            try{
                const response = await fetch(url); if(!response.ok) throw new Error();
                const blob = await response.blob(); const link = document.createElement('a');
                const pathExt = String(new URL(url,location.href).pathname.match(/\.([a-z0-9]+)$/i)?.[1] || '').toLowerCase();
                const mime = String(blob.type || '').toLowerCase();
                const videoExt = ['mp4','webm','mov','m4v','avi','mkv','flv'];
                const extension = kind === 'video'
                    ? (videoExt.includes(pathExt) ? pathExt : mime.includes('webm') ? 'webm' : mime.includes('quicktime') ? 'mov' : 'mp4')
                    : (mime.includes('jpeg') ? 'jpg' : 'png');
                link.href=URL.createObjectURL(blob); link.download=`小美画布-${Date.now()}.${extension}`; link.click();
                setTimeout(()=>URL.revokeObjectURL(link.href),1500);
            }catch(e){ alert('下载失败，请稍后重试'); }
        }
        async function copyPrompt(button){
            const prompt = button?.closest('.card')?.querySelector('.prompt')?.dataset.full || '';
            if(!prompt) return;
            let copied = false;
            try{
                if(navigator.clipboard?.writeText){
                    await navigator.clipboard.writeText(prompt);
                    copied = true;
                }
            }catch(e){}
            if(!copied){
                const textarea = document.createElement('textarea');
                textarea.value = prompt;
                textarea.setAttribute('readonly','');
                textarea.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
                document.body.appendChild(textarea);
                textarea.select();
                try{ copied = document.execCommand('copy'); }catch(e){}
                textarea.remove();
            }
            if(!copied){ alert('复制失败，请手动复制'); return; }
            clearTimeout(button._copyTimer);
            button.classList.add('copied');
            button.title = '已复制完整提示词';
            button.setAttribute('aria-label','已复制完整提示词');
            button.innerHTML = '<i data-lucide="check"></i>';
            lucide.createIcons();
            button._copyTimer = setTimeout(() => {
                button.classList.remove('copied');
                button.title = '复制提示词';
                button.setAttribute('aria-label','复制提示词');
                button.innerHTML = '<i data-lucide="copy"></i>';
                lucide.createIcons();
            }, 1600);
        }
        async function deleteRecord(timestamp,button){
            if(!confirm('确定从历史记录移除这条记录吗？仍被引用的原图会保留，未引用素材会移入回收站。')) return;
            button.disabled=true;
            try{
                const response=await fetch('/api/history/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timestamp})});
                const data=await response.json(); if(!response.ok||!data.success) throw new Error(data.message||'删除失败');
                allRecords=allRecords.filter(item=>Math.abs(Number(item.timestamp)-timestamp)>=.001); applyFilters();
            }catch(error){button.disabled=false;alert(error.message||'删除失败');}
        }
        window.addEventListener('message',event=>{if(event.data?.type==='history-focus')loadHistory(true)});
        window.addEventListener('dragend', () => notifyHistoryDragState(false));
        window.addEventListener('blur', () => notifyHistoryDragState(false));
        document.getElementById('modal').addEventListener('cancel',event=>{event.preventDefault();closePreview()});
        loadHistory(true); lucide.createIcons();
    </script>
</body>
