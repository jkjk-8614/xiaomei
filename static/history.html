<body>
    <div class="page">
        <aside class="history-manager-sidebar" aria-label="历史记录筛选">
            <div class="history-manager-sidebar-title">历史记录管理</div>
            <div class="history-manager-sidebar-heading">快速筛选</div>
            <button class="manager-filter active" type="button" data-manager-scope="all" onclick="setQuickFilter(this)">
                <i data-lucide="layers-3"></i><span>全部记录</span><b id="managerAllCount">0</b>
            </button>
            <button class="manager-filter" type="button" data-manager-scope="recent" onclick="setQuickFilter(this)">
                <i data-lucide="clock-3"></i><span>最近 7 天</span><b id="managerRecentCount">0</b>
            </button>
            <button class="manager-filter" type="button" data-manager-scope="failed" onclick="setQuickFilter(this)">
                <i data-lucide="archive-x"></i><span>生成失败</span><b id="managerFailedCount">0</b>
            </button>
            <div class="history-manager-sidebar-heading manager-sidebar-type-heading">按来源</div>
            <button class="manager-filter" type="button" data-manager-source="online" onclick="setManagerSourceFilter(this)">
                <i data-lucide="image"></i><span>在线生图</span><b id="managerOnlineCount">0</b>
            </button>
            <button class="manager-filter" type="button" data-manager-source="chat" onclick="setManagerSourceFilter(this)">
                <i data-lucide="message-square"></i><span>GPT 对话</span><b id="managerChatCount">0</b>
            </button>
            <button class="manager-filter" type="button" data-manager-source="canvas" onclick="setManagerSourceFilter(this)">
                <i data-lucide="layout-dashboard"></i><span>小美画布</span><b id="managerCanvasCount">0</b>
            </button>
            <button class="manager-filter" type="button" data-manager-source="comfyui" onclick="setManagerSourceFilter(this)">
                <i data-lucide="box"></i><span>ComfyUI 工作台</span><b id="managerComfyuiCount">0</b>
            </button>
            <button class="manager-filter" type="button" data-manager-source="commerce" onclick="setManagerSourceFilter(this)">
                <i data-lucide="shopping-bag"></i><span>电商工作台</span><b id="managerCommerceCount">0</b>
            </button>
            <div class="history-manager-sidebar-heading manager-sidebar-project-heading">按项目</div>
            <div id="managerProjectFilters" class="manager-project-filters"></div>
            <div class="history-manager-sidebar-note">图片可拖到画布继续使用，拖到外部应用会自动压缩副本。</div>
        </aside>
        <div class="head">
        <div class="history-heading">
            <div class="history-title-row"><span class="history-title-icon" aria-hidden="true"><i data-lucide="history"></i></span><h1 id="historyTitle">历史记录</h1></div>
            <p id="historySubtitle" class="subtitle">查看、下载和管理所有生成图片和视频；图片拖到画布保留原图，拖到外部会自动压缩。</p>
            <div id="historyProjectScope" class="history-project-scope" hidden><i data-lucide="folder-open"></i><span>当前项目</span><strong id="historyProjectName"></strong></div>
        </div>
            <div class="toolbar">
                <label class="history-search" aria-label="搜索历史记录">
                    <i data-lucide="search" aria-hidden="true"></i>
                    <input id="search" class="search" type="search" placeholder="搜索提示词或模型" oninput="scheduleApplyFilters()">
                </label>
                <button class="manage-open-button" type="button" onclick="openFullHistory()" title="进入历史记录管理">
                    <i data-lucide="panels-top-left"></i><span>管理历史</span>
                </button>
                <button class="history-refresh-button" type="button" onclick="loadHistory(true)" title="刷新历史记录" aria-label="刷新历史记录"><i data-lucide="refresh-cw"></i><span>刷新</span></button>
                <div id="managerActions" class="manager-actions" hidden>
                    <button id="managerSelectMode" class="manager-action-button" type="button" aria-pressed="false" onclick="toggleSelectionMode()">
                        <i data-lucide="check-square"></i><span>选择模式</span>
                    </button>
                    <span id="managerSelectionCount" class="manager-selection-count" hidden>已选 0 个</span>
                    <button id="managerSelectAll" class="manager-action-button" type="button" hidden onclick="toggleSelectAll()">全选</button>
                    <button id="managerDeleteSelected" class="manager-action-button danger" type="button" hidden disabled onclick="deleteSelectedRecords()">
                        <i data-lucide="trash-2"></i><span>删除所选</span>
                    </button>
                    <button id="managerExitSelection" class="manager-action-button primary" type="button" hidden onclick="toggleSelectionMode(false)">完成</button>
                </div>
            </div>
        </div>
        <div class="filters">
            <button class="filter active" data-type="all" onclick="setFilter(this)">全部</button>
            <button class="filter" data-type="online" onclick="setFilter(this)">在线生图</button>
            <button class="filter" data-type="chat" onclick="setFilter(this)">GPT 对话</button>
            <button class="filter" data-type="canvas" onclick="setFilter(this)">小美画布</button>
            <button class="filter" data-type="comfyui" onclick="setFilter(this)">ComfyUI 工作台</button>
            <button class="filter" data-type="commerce" onclick="setFilter(this)">电商工作台</button>
            <button class="filter" data-type="video" onclick="setFilter(this)">视频</button>
            <div class="manager-media-filters" aria-label="媒体类型">
                <button class="manager-media-filter active" type="button" data-media-type="all" onclick="setMediaFilter(this)">全部</button>
                <button class="manager-media-filter" type="button" data-media-type="image" onclick="setMediaFilter(this)">图片</button>
                <button class="manager-media-filter" type="button" data-media-type="video" onclick="setMediaFilter(this)">视频</button>
            </div>
            <div id="summary" class="summary">0 条记录</div>
        </div>
        <div id="content"><div class="loading"><i data-lucide="loader-circle"></i><span>正在加载历史记录</span></div></div>
        <div id="historyNotice" class="history-notice" role="status" aria-live="polite" aria-atomic="true" hidden></div>
        <div id="more" class="more" hidden><button onclick="showMore()">加载更多</button></div>

    <dialog id="modal" class="modal" onclick="if(event.target===this) closePreview()">
        <button class="modal-close" onclick="closePreview()" aria-label="关闭">×</button>
        <div class="preview"><img id="previewImage" alt="历史图片预览" oncontextmenu="openHistoryImageContextMenu(event,this.currentSrc||this.src,'image')"><video id="previewVideo" controls playsinline preload="metadata" hidden oncontextmenu="event.preventDefault()"></video><div id="previewCaption" class="preview-caption"></div></div>
    </dialog>
    <div id="historyImageContextMenu" class="history-image-context-menu" role="menu" aria-label="图片操作" hidden>
        <button id="historyImageContextCopy" type="button" role="menuitem" onclick="copyHistoryContextImage(event)"><i data-lucide="clipboard"></i><span>复制图片</span></button>

    <script>
        let allRecords = [];
        let filteredRecords = [];
        let activeType = 'all';
        let activeQuickFilter = 'all';
        let activeSourceFilter = '';
        let visibleCount = 60;
        let selectionMode = false;
        const selectedTimestamps = new Set();
        let filterTimer = 0;
        // A focus message can start a second load while the initial request is
        // still in flight.  Older responses must not restore a row removed by
        // a newer delete operation.
        let historyLoadSerial = 0;
        let historyNoticeTimer = 0;
        const pendingHistoryDeletes = new Set();
        let historyProjectContextSerial = 0;
        let activeProjectId = '';
        let activeProjectName = '';
        let activeProjectFilter = '';
        let managerProjects = [];
        let managerProjectsLoaded = false;
        const HISTORY_THUMB_WIDTH = 448;

        const esc = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
        const VIDEO_URL_RE = /\.(mp4|webm|mov|m4v|avi|mkv|flv)(?:[?#].*)?$/i;
        const GROUP_LABELS = {online:'在线生图',chat:'GPT 对话',canvas:'小美画布',comfyui:'ComfyUI 工作台',commerce:'电商工作台',video:'视频'};
        const COMFYUI_PROJECT_ID = '__comfyui__';
        const UNASSIGNED_PROJECT_ID = '__unassigned__';
        function mediaUrl(value){
            if(value && typeof value === 'object') return String(value.url || value.src || value.path || value.uri || '').trim();
            return String(value || '').trim();
        }
        function mediaKind(value,fallback='image'){
            const hinted = String(value && typeof value === 'object' ? (value.kind || value.mediaKind || value.type || '') : '').trim().toLowerCase();
            if(hinted.includes('video')) return 'video';
            if(hinted.includes('image')) return 'image';
            return VIDEO_URL_RE.test(mediaUrl(value)) ? 'video' : (fallback || 'image');
        }
        function recordMediaEntries(item){
            const entries = [];
            const seen = new Set();
            const add = (value,fallback='image') => {
                if(Array.isArray(value)){ value.forEach(itemValue => add(itemValue,fallback)); return; }
                const url = mediaUrl(value);
                if(!url || seen.has(url)) return;
                seen.add(url);
                entries.push({url,kind:mediaKind(value,fallback),name:String(value && typeof value === 'object' ? (value.name || '') : '')});
            };
            add(item?.video_items,'video');
            add(item?.videos,'video');
            add(item?.items,'');
            add(item?.media_items,'');
            add(item?.image_items,'image');
            add(item?.images,'image');
            add(item?.outputs,'');
            return entries;
        }
        function recordHasVideo(item){
            if(typeof item?.has_video === 'boolean') return item.has_video;
            return recordMediaEntries(item).some(media => media.kind === 'video');
        }
        function recordSource(item){
            const raw = [item?.history_source, item?.source, item?.params?.history_source, item?.params?.source]
                .find(value => String(value || '').trim());
            return String(raw || '').trim().toLowerCase().replace(/[\s-]+/g,'_');
        }
        function recordGroup(item){
            const hintedGroup = String(item?.history_group || '').trim();
            if(hintedGroup) return hintedGroup;
            const type = String(item?.type || '').toLowerCase();
            const source = recordSource(item);
            if(recordHasVideo(item) || type === 'video' || type.includes('video')) return 'video';
            if(source === 'comfyui' || source === 'comfy_ui' || source === 'comfy_app' || source === 'comfyui_workbench' || type === 'comfyui' || type === 'comfy-app' || type === 'comfy_app') return 'comfyui';
            if(source === 'online' || source === 'online_image') return 'online';
            if(source === 'chat' || source === 'gpt_chat' || source === 'gpt') return 'chat';
            if(source === 'canvas' || source === 'smart_canvas') return 'canvas';
            if(source === 'commerce' || source === 'commerce_workbench' || source === 'ecommerce') return 'commerce';
            if(type === 'online') return 'online';
            if(type === 'chat' || type === 'gpt-chat' || type === 'gpt_chat') return 'chat';
            if(type === 'commerce' || type.includes('commerce')) return 'commerce';
            if(type === 'canvas' || type.includes('canvas')) return 'canvas';
            // ComfyUI records from older canvas builds did not carry a source field.
            if(item.workflow_json || item.prompt_id || item.backend) return 'canvas';
            return 'other';
        }
        function recordIsFailed(item){
            const status = String(item?.status || item?.state || item?.result || '').toLowerCase();
            const error = String(item?.error || item?.error_message || item?.message || '').trim();
            return Boolean(error) || ['failed','failure','error','cancelled','canceled'].includes(status);
        }
        function recordTimestamp(item){ return Number(item?.timestamp || 0); }
        function recordIsRecent(item){
            const timestamp = recordTimestamp(item);
            return timestamp > 0 && timestamp >= (Date.now() / 1000) - (7 * 24 * 60 * 60);
        }
        function recordProjectIds(item){
            const values = [
                ...(Array.isArray(item?.project_ids) ? item.project_ids : []),
                item?.project_id
            ];
            return [...new Set(values.map(value => String(value || '').trim()).filter(Boolean))];
        }
        function recordMatchesProject(item, projectId){
            const id = String(projectId || '').trim();
            if(!id) return true;
            if(id === COMFYUI_PROJECT_ID) return recordGroup(item) === 'comfyui';
            const projectIds = recordProjectIds(item);
            if(id === UNASSIGNED_PROJECT_ID) return !projectIds.length && recordGroup(item) !== 'comfyui';
            return projectIds.includes(id);
        }
        function projectFilterCount(projectId){
            return allRecords.filter(item => recordMatchesProject(item, projectId)).length;
        }
        function renderManagerProjectFilters(){
            const target = document.getElementById('managerProjectFilters');
            if(!target) return;
            const projects = Array.isArray(managerProjects)
                ? managerProjects.filter(item => item && !item.deleted_at)
                : [];
            const entries = [
                {id:'', label:'全部项目', icon:'layers-3'},
                {id:COMFYUI_PROJECT_ID, label:'ComfyUI 工作台', icon:'box'},
                ...projects
                    .map(item => ({
                        id:String(item.id || '').trim(),
                        label:String(item.name || item.id || '未命名项目'),
                        icon:'folder-open'
                    }))
                    .filter(item => item.id),
                {id:UNASSIGNED_PROJECT_ID, label:'未归属项目', icon:'folder-minus'}
            ];
            target.innerHTML = entries.map(item => `<button class="manager-filter manager-project-filter ${activeProjectFilter === item.id ? 'active' : ''}" type="button" data-manager-project="${esc(item.id)}"><i data-lucide="${esc(item.icon)}"></i><span>${esc(item.label)}</span><b>${projectFilterCount(item.id)}</b></button>`).join('');
            target.querySelectorAll('[data-manager-project]').forEach(button => {
                button.onclick = () => setManagerProjectFilter(button);
            });
            refreshHistoryIcons(target);
        }
        function setManagerProjectFilter(button){
            activeProjectFilter = String(button?.dataset?.managerProject || '').trim();
            activeQuickFilter = '';
            activeSourceFilter = '';
            activeType = 'all';
            document.querySelectorAll('.manager-filter[data-manager-scope],.manager-filter[data-manager-source]').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.manager-media-filter').forEach(item => item.classList.toggle('active', item.dataset.mediaType === 'all'));
            document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item.dataset.type === 'all'));
            renderManagerProjectFilters();
            visibleCount = 60;
            applyFilters();
        }
        async function loadManagerProjects(){
            if(managerProjectsLoaded){
                renderManagerProjectFilters();
                return;
            }
            managerProjectsLoaded = true;
            try{
                const response = await fetch('/api/projects',{cache:'no-store'});
                const data = response.ok ? await response.json() : {};
                managerProjects = Array.isArray(data?.projects) ? data.projects : [];
            }catch(error){
                managerProjects = [];
            }
            renderManagerProjectFilters();
        }
        function typeLabel(item){ return GROUP_LABELS[recordGroup(item)] || '生成记录'; }
        function formatTime(ts){
            const date = new Date(Number(ts) * 1000);
            if(Number.isNaN(date.getTime())) return '--';
            return date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).replace('/','-');
        }
        function historyThumbUrl(url, kind='image'){
            const value = String(url || '').trim();
            if(!value || kind === 'video' || /^(?:data:|blob:)/i.test(value)) return value;
            try{
                const parsed = new URL(value, location.href);
                if(parsed.origin !== location.origin || parsed.pathname === '/api/media-preview') return value;
                if(!/^\/(?:assets|output)\//.test(parsed.pathname) && !/^\/api\/storage-files\//.test(parsed.pathname)) return value;
                return `/api/media-preview?w=${HISTORY_THUMB_WIDTH}&url=${encodeURIComponent(value)}`;
            }catch(error){ return value; }
        }
        function refreshHistoryIcons(root=document){
            if(!window.lucide?.createIcons) return;
            try{ lucide.createIcons({root}); }catch(error){ lucide.createIcons(); }
        }
        function showHistoryNotice(message, kind='info', duration=2600){
            const notice = document.getElementById('historyNotice');
            if(!notice) return;
            clearTimeout(historyNoticeTimer);
            notice.className = `history-notice ${kind}`;
            notice.textContent = String(message || '');
            notice.hidden = !message;
            if(message && duration > 0){
                historyNoticeTimer = setTimeout(() => {
                    notice.hidden = true;
                    notice.className = 'history-notice';
                }, duration);
            }
        }
        function updateHistoryDeleteNotice(){
            const count = pendingHistoryDeletes.size;
            const content = document.getElementById('content');
            if(content) content.setAttribute('aria-busy', count ? 'true' : 'false');
            if(count) showHistoryNotice(`正在删除 ${count} 条历史记录…`, 'pending', 0);
        }
        function finishHistoryDeleteNotice(message, kind='success'){
            if(pendingHistoryDeletes.size){
                updateHistoryDeleteNotice();
                return;
            }
            const content = document.getElementById('content');
            if(content) content.setAttribute('aria-busy', 'false');
            showHistoryNotice(message, kind, kind === 'error' ? 4600 : 2600);
        }
        function optimisticRemoveHistoryRecords(keys){
            const keySet = new Set(keys.map(key => String(key)));
            const removed = allRecords.filter(item => keySet.has(String(recordTimestamp(item))));
            if(!removed.length) return removed;
            historyLoadSerial += 1;
            allRecords = allRecords.filter(item => !keySet.has(String(recordTimestamp(item))));
            keys.forEach(key => selectedTimestamps.delete(String(key)));
            updateManagerCounts();
            applyFilters();
            return removed;
        }
        function restoreHistoryRecords(records){
            if(!records.length) return;
            const restoredKeys = new Set(records.map(item => String(recordTimestamp(item))));
            historyLoadSerial += 1;
            allRecords = [
                ...allRecords.filter(item => !restoredKeys.has(String(recordTimestamp(item)))),
                ...records
            ].sort((left, right) => recordTimestamp(right) - recordTimestamp(left));
            updateManagerCounts();
            applyFilters();
        }
        function scheduleApplyFilters(){
            clearTimeout(filterTimer);
            filterTimer = setTimeout(() => { filterTimer = 0; applyFilters(); }, 90);
        }
        function historyProjectIdFromContext(){
            try{
                const queryProject = String(new URLSearchParams(location.search).get('project') || '').trim();
                if(queryProject) return queryProject;
                // The shell keeps the last canvas project in localStorage.  Do
                // not let that stale value hide ComfyUI/global history.
                const activePage = String(localStorage.getItem('studio_active_page') || '').trim();
                if(activePage && activePage !== 'canvas') return '';
                return String(localStorage.getItem('canvasListCurrentProjectId') || '').trim();
            }catch(error){ return ''; }
        }
        function historyManagerBaseSubtitle(){
            return historyManagerEnabled()
                ? '查看、下载并批量整理当前项目的生成图片和视频。'
                : '查看、下载和管理当前项目的生成图片和视频；图片拖到画布保留原图，拖到外部会自动压缩。';
        }
        function updateHistoryProjectScope(){
            const scope = document.getElementById('historyProjectScope');
            const name = document.getElementById('historyProjectName');
            const subtitle = document.getElementById('historySubtitle');
            if(scope) scope.hidden = !activeProjectId;
            if(name) name.textContent = activeProjectName || activeProjectId || '';
            if(subtitle){
                subtitle.textContent = activeProjectId
                    ? historyManagerBaseSubtitle()
                    : (historyManagerEnabled()
                        ? '查看、下载并批量整理所有生成图片和视频。'
                        : '查看、下载和管理所有生成图片和视频；图片拖到画布保留原图，拖到外部会自动压缩。');
            }
            refreshHistoryIcons(scope || document);
        }
        async function resolveHistoryProjectContext(){
            const serial = ++historyProjectContextSerial;
            const projectId = historyProjectIdFromContext();
            activeProjectId = projectId;
            activeProjectName = '';
            updateHistoryProjectScope();
            if(!projectId) return '';
            try{
                const response = await fetch('/api/projects',{cache:'no-store'});
                if(response.ok){
                    const data = await response.json();
                    const project = Array.isArray(data?.projects)
                        ? data.projects.find(item => String(item?.id || '') === projectId)
                        : null;
                    if(serial === historyProjectContextSerial && activeProjectId === projectId){
                        activeProjectName = String(project?.name || '').trim();
                        updateHistoryProjectScope();
                    }
                }
            }catch(error){
                // The project ID is still sufficient for the server-side filter.
            }
            return projectId;
        }
        async function loadHistory(reset=false){
            const loadSerial = ++historyLoadSerial;
            if(reset){
                visibleCount = 60;
                // A refresh changes the data snapshot. Never let an old
                // selection remain actionable while the new snapshot loads.
                toggleSelectionMode(false);
            }
            document.getElementById('content').innerHTML = '<div class="loading"><i data-lucide="loader-circle"></i><span>正在加载历史记录</span></div>';
            refreshHistoryIcons(document.getElementById('content'));
            try{
                const managerMode = historyManagerEnabled();
                if(managerMode) await loadManagerProjects();
                const projectId = managerMode ? '' : await resolveHistoryProjectContext();
                const endpoint = new URL('/api/history', location.href);
                endpoint.searchParams.set('view','manager');
                if(projectId && !managerMode) endpoint.searchParams.set('project_id',projectId);
                const response = await fetch(endpoint.toString(),{cache:'no-store'});
                if(!response.ok) throw new Error('历史记录加载失败');

        function notifyHistoryDragState(active){

        const HISTORY_DRAG_MAX_EDGE = 2048;
        const HISTORY_DRAG_JPEG_QUALITY = .82;
        const HISTORY_DRAG_WEBP_QUALITY = .84;
        function historyDragFileName(thumb, extension){
            let name = String(thumb?.dataset?.mediaName || '').trim();
            if(!name){
                try{
                    const url = new URL(thumb?.dataset?.mediaUrl || '',location.href);
                    name = decodeURIComponent(url.pathname.split('/').pop() || '');
                }catch(e){}
            }
            name = name.replace(/\.[^.]+$/,'').replace(/[<>:"/\\|?*\u0000-\u001f]/g,'_').trim();
            return `${name || '小美画布图片'}.${extension}`;
        }
        function compressHistoryImageForDrag(thumb){
            const image = thumb?.querySelector('img.thumb-media');
            if(!image?.complete || !image.naturalWidth || !image.naturalHeight) return null;
            const scale = Math.min(1,HISTORY_DRAG_MAX_EDGE / image.naturalWidth,HISTORY_DRAG_MAX_EDGE / image.naturalHeight);
            const width = Math.max(1,Math.round(image.naturalWidth * scale));
            const height = Math.max(1,Math.round(image.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            try{
                const context = canvas.getContext('2d',{willReadFrequently:true});
                if(!context) return null;
                context.imageSmoothingEnabled = true;
                context.imageSmoothingQuality = 'high';
                context.drawImage(image,0,0,width,height);
                let hasTransparency = false;
                const pixels = context.getImageData(0,0,width,height).data;
                for(let index = 3; index < pixels.length; index += 4){
                    if(pixels[index] < 255){ hasTransparency = true; break; }
                }
                let dataUrl = '';
                let mime = 'image/jpeg';
                let extension = 'jpg';
                if(hasTransparency){
                    const webp = canvas.toDataURL('image/webp',HISTORY_DRAG_WEBP_QUALITY);
                    if(/^data:image\/webp;base64,/i.test(webp)){
                        dataUrl = webp;
                        mime = 'image/webp';
                        extension = 'webp';
                    }else{
                        dataUrl = canvas.toDataURL('image/png');
                        mime = 'image/png';
                        extension = 'png';
                    }
                }else{
                    dataUrl = canvas.toDataURL('image/jpeg',HISTORY_DRAG_JPEG_QUALITY);
                }
                if(!/^data:image\/(?:jpeg|png|webp);base64,/i.test(dataUrl)) return null;
                return {dataUrl,mime,extension,width,height};
            }catch(error){
                // 跨域图片可能禁止画布读取；这种情况下继续使用原始 URL，保证拖拽仍可用。
                console.warn('[history] drag compression skipped',error);
                return null;
            }finally{
                canvas.width = 0;
                canvas.height = 0;
            }
        }
        function startHistoryMediaDrag(event, thumb){
            const transfer = event?.dataTransfer;
            const rawUrl = thumb?.dataset?.mediaUrl || '';
            const kind = thumb?.dataset?.mediaKind || 'image';
            if(!transfer || !rawUrl || kind !== 'image') { event?.preventDefault?.(); return; }
            let url = rawUrl;
            try { url = new URL(rawUrl, location.href).href; } catch(e) {}
            if(!/^https?:\/\//i.test(url) && !/^data:image\//i.test(url)) {
                event.preventDefault();
                return;
            }
            transfer.effectAllowed = 'copy';
            // 画布继续读取原始 URL；DownloadURL 和 image/* 类型提供给外部应用使用的压缩副本。
            const dragExport = compressHistoryImageForDrag(thumb);
            const externalUrl = dragExport?.dataUrl || url;
            const externalMime = dragExport?.mime || 'image/png';
            const externalExtension = dragExport?.extension || 'png';
            const externalName = historyDragFileName(thumb,externalExtension);
            try { transfer.setData('application/x-smart-history-image', JSON.stringify({url, source:'history', kind:'image', compressed:Boolean(dragExport), width:dragExport?.width || 0, height:dragExport?.height || 0})); } catch(e) {}
            try { transfer.setData('text/uri-list', url); } catch(e) {}
            transfer.setData('text/plain', url);
            try { transfer.setData('DownloadURL', `${externalMime}:${externalName}:${externalUrl}`); } catch(e) {}
            if(dragExport){
                try { transfer.setData(externalMime, externalUrl); } catch(e) {}
            }
            thumb.classList.add('dragging');
            notifyHistoryDragState(true);
        }

        async function imageBlobToPng(blob){
            if(String(blob?.type || '').toLowerCase() === 'image/png') return blob;
            const objectUrl = URL.createObjectURL(blob);
            try{
                const imageEl = await new Promise((resolve,reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error('图片解码失败'));
                    image.src = objectUrl;
                });
                const canvasEl = document.createElement('canvas');
                canvasEl.width = Math.max(1,imageEl.naturalWidth || imageEl.width || 1);
                canvasEl.height = Math.max(1,imageEl.naturalHeight || imageEl.height || 1);
                const context = canvasEl.getContext('2d');
                if(!context) throw new Error('无法创建图片画布');
                context.drawImage(imageEl,0,0,canvasEl.width,canvasEl.height);
                const png = await new Promise(resolve => canvasEl.toBlob(resolve,'image/png'));
                if(!png) throw new Error('无法转换图片格式');
                return png;
            }finally{ URL.revokeObjectURL(objectUrl); }
        }
        async function loadHistoryImagePng(url){
            const response = await fetch(url,{credentials:'same-origin'});
            if(!response.ok) throw new Error(`图片读取失败（${response.status}）`);
            const blob = await response.blob();
            if(!/^image\//i.test(String(blob.type || ''))) throw new Error('读取到的内容不是图片');
            return imageBlobToPng(blob);
        }

        async function copyImage(url,button){
            if(!url || button?.disabled) return false;
            if(button) button.disabled = true;
            try{
                const electron = historyElectronApi();
                if(electron?.writeImageToClipboard){
                    const png = await loadHistoryImagePng(url);
                    const result = await electron.writeImageToClipboard(await png.arrayBuffer());
                    if(!result?.ok) throw new Error(result?.message || '桌面剪贴板写入失败');
                }else{
                    const ClipboardItemCtor = window.ClipboardItem;
                    if(!navigator.clipboard?.write || typeof ClipboardItemCtor !== 'function') throw new Error('当前浏览器不支持复制图片');
                    // 在用户点击的同步调用栈内先发起写入，避免图片读取完成后失去临时授权。
                    const pngPromise = loadHistoryImagePng(url);
                    await navigator.clipboard.write([new ClipboardItemCtor({'image/png':pngPromise})]);
                }

                return true;
            }catch(error){
                console.warn('[history] copy image failed',error);
                alert('复制图片失败，请使用下载按钮');
                return false;
            }finally{ if(button) button.disabled = false; }
        }
        function openPreview(url,prompt,kind='image'){
            if(!url) return;
            if(window.parent && window.parent !== window){
                const items = filteredRecords.map(item => {
                    const media = recordMediaEntries(item)[0];
                    return {
                        url: media?.url || '',
                        kind: media?.kind || 'image',
                        prompt: item.prompt || '',
                        model: item.model || item.params?.model || '',
                        timestamp: Number(item.timestamp || 0)
                    };
                }).filter(item => item.url);
                const index = Math.max(0,items.findIndex(item => item.url === url && item.kind === kind));
                window.parent.postMessage({ type:'history-preview-open', items, index }, location.origin);
                return;
            }
            const modal = document.getElementById('modal');
            const image = document.getElementById('previewImage');
            const video = document.getElementById('previewVideo');
            if(kind === 'video'){
                image.hidden = true;
                image.removeAttribute('src');
                video.hidden = false;
                video.src = url;
                video.load();
            }else{
                video.pause();
                video.hidden = true;
                video.removeAttribute('src');
                video.load();
                image.hidden = false;
                image.src = url;
            }
            document.getElementById('previewCaption').textContent = prompt || '';
            document.documentElement.classList.add('preview-open');
            document.body.classList.add('preview-open');
            if(!modal.open) modal.showModal();
            modal.scrollTop = 0;
        }
        function closePreview(){
            const modal = document.getElementById('modal');
            if(modal.open) modal.close();
            document.documentElement.classList.remove('preview-open');
            document.body.classList.remove('preview-open');
            document.getElementById('previewImage').src='';
            const video = document.getElementById('previewVideo');
            video.pause();
            video.hidden = true;
            video.removeAttribute('src');
            video.load();
        }
        async function downloadMedia(url,kind='image'){
            if(!url) return;
            try{
                const response = await fetch(url); if(!response.ok) throw new Error();
                const blob = await response.blob(); const link = document.createElement('a');
                const pathExt = String(new URL(url,location.href).pathname.match(/\.([a-z0-9]+)$/i)?.[1] || '').toLowerCase();
                const mime = String(blob.type || '').toLowerCase();
                const videoExt = ['mp4','webm','mov','m4v','avi','mkv','flv'];
                const extension = kind === 'video'
                    ? (videoExt.includes(pathExt) ? pathExt : mime.includes('webm') ? 'webm' : mime.includes('quicktime') ? 'mov' : 'mp4')
                    : (mime.includes('jpeg') ? 'jpg' : 'png');
                link.href=URL.createObjectURL(blob); link.download=`小美画布-${Date.now()}.${extension}`; link.click();
                setTimeout(()=>URL.revokeObjectURL(link.href),1500);
            }catch(e){ alert('下载失败，请稍后重试'); }
        }
        async function copyPrompt(button){
            const prompt = button?.closest('.card')?.querySelector('.prompt')?.dataset.full || '';
            if(!prompt) return;
            let copied = false;
            try{
                if(navigator.clipboard?.writeText){
                    await navigator.clipboard.writeText(prompt);
                    copied = true;
                }
            }catch(e){}
            if(!copied){
                const textarea = document.createElement('textarea');
                textarea.value = prompt;
                textarea.setAttribute('readonly','');
                textarea.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
                document.body.appendChild(textarea);
                textarea.select();
                try{ copied = document.execCommand('copy'); }catch(e){}
                textarea.remove();
            }
            if(!copied){ alert('复制失败，请手动复制'); return; }
            clearTimeout(button._copyTimer);
            button.classList.add('copied');
            button.title = '已复制完整提示词';
            button.setAttribute('aria-label','已复制完整提示词');
            button.innerHTML = '<i data-lucide="check"></i>';
            refreshHistoryIcons(button);
            button._copyTimer = setTimeout(() => {
                button.classList.remove('copied');
                button.title = '复制提示词';
                button.setAttribute('aria-label','复制提示词');
                button.innerHTML = '<i data-lucide="copy"></i>';
                refreshHistoryIcons(button);
            }, 1600);
        }
        async function deleteRecord(timestamp,button){
            if(!confirm('确定从历史记录移除这条记录吗？仍被引用的原图会保留，未引用素材会移入回收站。')) return;
            const key = String(timestamp);
            if(pendingHistoryDeletes.has(key)) return;
            button.disabled=true;
            pendingHistoryDeletes.add(key);
            updateHistoryDeleteNotice();
            const removedRecords = optimisticRemoveHistoryRecords([key]);
            let failure = null;
            try{
                const response=await fetch('/api/history/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timestamp})});
                const data=await response.json(); if(!response.ok||!data.success) throw new Error(data.message||'删除失败');
            }catch(error){
                failure = error;
                restoreHistoryRecords(removedRecords);
                button.disabled=false;
            }finally{
                pendingHistoryDeletes.delete(key);
                historyLoadSerial += 1;
                if(failure){
                    finishHistoryDeleteNotice(`删除失败，记录已恢复：${failure.message || '请稍后重试'}`, 'error');
                }else{
                    finishHistoryDeleteNotice('已删除 1 条历史记录', 'success');
                }
            }
        }
        window.addEventListener('message',event=>{
            if(event.data?.type === 'history-focus') loadHistory(true);
            if(event.data?.type === 'history-manager-mode') setManagerMode(Boolean(event.data.enabled));
        });
        window.addEventListener('dragend', () => notifyHistoryDragState(false));
        window.addEventListener('blur', () => notifyHistoryDragState(false));
        document.getElementById('modal').addEventListener('cancel',event=>{event.preventDefault();closePreview()});
        if(document.documentElement.classList.contains('manager-mode')) {
            setManagerMode(true);
        } else {
            loadHistory(true);
        }
        refreshHistoryIcons(document);
    </script>
</body>
</html>
