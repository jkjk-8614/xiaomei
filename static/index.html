    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.09.30.1784161005');

        /* 本地 Tailwind 工具类兜底：CDN 慢/未就绪时也能立刻给图标尺寸，避免首屏左侧栏空白 */
        .w-1\.5 { width: 0.375rem; }
        .h-1\.5 { height: 0.375rem; }
        .w-4 { width: 1rem; }
        .h-4 { height: 1rem; }
        .w-5 { width: 1.25rem; }
        .h-5 { height: 1.25rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .rounded-full { border-radius: 9999px; }
        .mb-12 { margin-bottom: 3rem; }
        .transition-colors { transition-property: color, background-color, border-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
        .animate-pulse { animation: studio-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes studio-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

        :root {
            --accent: #000000;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #ffffff;
            --sidebar-bg: #ffffff;
            --stage-bg: #fcfcfc;
            --border: #f2f2f2;
            --stage-border: #f0f0f0;
            --text: #121212;
            --muted: #999;
            --nav-hover-bg: #fafafa;
            --monitor-bg: rgba(255, 255, 255, 0.7);
            --monitor-border: rgba(0, 0, 0, 0.05);
            --monitor-shadow: rgba(0, 0, 0, 0.04);
            --divider: rgba(0, 0, 0, 0.1);
            --scrollbar: #d8d8d8;
            --scrollbar-hover: #c0c0c0;
            --author-name: #000;
            --social-icon: #ccc;
        }

        html.theme-dark,
        body.theme-dark {
            --bg: #0f141d;
            --sidebar-bg: #0f141d;
            --stage-bg: #111722;
            --border: #242d3b;
            --stage-border: #2a3444;
            --text: #e5e9f0;
            --muted: #8f9aab;
            --nav-hover-bg: #171d29;
            --monitor-bg: rgba(23, 29, 41, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.3);
            --divider: rgba(255, 255, 255, 0.15);
            --scrollbar: #334155;
            --scrollbar-hover: #475569;
            --author-name: #e5e9f0;
            --social-icon: #64748b;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
            height: 100%;
            overflow: hidden;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 侧边栏 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            height: 100vh;
            max-height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.5s var(--fluid-ease) 0.5s, background 0.3s, border-color 0.3s;
            z-index: 50;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 220px;
            transition-delay: 0s;
        }

        body.studio-scale-host .sidebar {
            height: calc(100vh / var(--studio-ui-scale, 1));
            max-height: calc(100vh / var(--studio-ui-scale, 1));
            zoom: var(--studio-ui-scale, 1);
        }

        /* 首次加载时与 iframe 的 0.5s 淡入同步播放，避免侧栏"焊死"在原地造成视觉断层 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        .logo-ring {
            width: 36px;
            height: 36px;
            border: 2px solid var(--text);
            border-radius: 12px;
            background: transparent;
            padding: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: 0 0 auto;
            /* 仅保留 hover 真正会用到的属性过渡，避免 transition: all 因首屏属性补齐被意外触发 */
            transition: transform 0.6s var(--fluid-ease) 0.5s, border-radius 0.6s var(--fluid-ease) 0.5s, border-color 0.3s, background-color .18s, box-shadow .2s;
        }

        .sidebar:hover .logo-ring {
            transform: rotate(90deg);
            border-radius: 50%;
            transition-delay: 0s;
        }

        .logo-ring:hover,
        .logo-ring:focus-visible {
            background: var(--nav-hover-bg);
            border-color: var(--text);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .16), 0 10px 24px rgba(15, 23, 42, .08);
            outline: none;
        }

        .logo-ring:hover #logo-dot,
        .logo-ring:focus-visible #logo-dot {
            transform: scale(1.8);
        }

        .logo-ring:active {
            transform: scale(.94);
            transition-delay: 0s;
        }

        .sidebar:hover .logo-ring:active {
            transform: rotate(90deg) scale(.94);
        }

        #logo-dot {
            transition: transform .16s ease, background-color .16s ease, box-shadow .16s ease;
        }

        /* 导航项 */
        .nav-item {
            position: relative;
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 18px;
            cursor: pointer;
            /* 只对 width 做带延迟的过渡（侧栏悬停展开效果）；background/color 不参与过渡，避免 active 切换时底色"流动" */
            transition: width 0.3s var(--fluid-ease) 0.5s;
            color: var(--muted);
            overflow: hidden;
            padding-left: 14px;
        }

        .sidebar:hover .nav-item {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .nav-item.active,
        body.theme-dark .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-text {
            opacity: 0;
            margin-left: 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.3s 0.5s;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
            transition-delay: 0.1s;
        }

        .nav-fold-toggle {
            position: relative;
            width: 48px;
            height: 36px;
            flex: 0 0 36px;
            margin: 0 0 6px;
            padding-left: 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            overflow: hidden;
            transition: width 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .sidebar:hover .nav-fold-toggle {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-fold-toggle:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .nav-fold-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            transition: transform 0.25s var(--fluid-ease);
        }

        .nav-fold-toggle[aria-expanded="false"] .nav-fold-icon {
            transform: rotate(-90deg);
        }

        .nav-fold-group {
            width: 100%;
            flex: 0 0 auto;
            max-height: 720px;
            opacity: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: max-height 0.3s var(--fluid-ease), opacity 0.2s ease;
        }

        .nav-fold-group.is-collapsed {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar nav {
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 6px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, .34) transparent;
        }

        .sidebar::-webkit-scrollbar { width: 4px !important; }
        .sidebar::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav::-webkit-scrollbar { width: 4px !important; }
        .sidebar nav::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar nav::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav > * {
            flex-shrink: 0;
        }

        /* 主舞台区 */
        .stage {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            background: var(--stage-bg);
            margin: 0;
            border-radius: 0;
            overflow: hidden;
            border: 0;
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        .stage-loading {
            position: absolute;
            inset: 0;
            z-index: 8;
            display: grid;
            place-items: center;
            background: var(--stage-bg);
            color: var(--muted);
            pointer-events: none;
        }
        .stage-loading[hidden] { display: none; }
        .stage-loading-card {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-height: 42px;
            padding: 0 16px;
            border: 1px solid rgba(148, 163, 184, .22);
            border-radius: 12px;
            background: rgba(255, 255, 255, .72);
            box-shadow: 0 10px 28px rgba(15, 23, 42, .06);
            font-size: 13px;
            font-weight: 700;
        }
        .stage-loading-spinner {
            width: 15px;
            height: 15px;
            border: 2px solid rgba(148, 163, 184, .35);
            border-top-color: var(--accent, #2563eb);
            border-radius: 50%;
            animation: stage-loading-spin .72s linear infinite;
        }
        @keyframes stage-loading-spin { to { transform: rotate(360deg); } }
        html.studio-theme-dark .stage-loading-card {
            background: rgba(30, 41, 59, .78);
            border-color: rgba(148, 163, 184, .24);
        }

        body.studio-scale-host .stage {
            margin: 0;
            border-radius: 0;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            /* iframe 是替换元素；auto 会退回到固有高度，导致页面只显示顶部。 */
            height: 100%;
            min-height: 0;
            display: block;
            border: none;
            opacity: 0;
            /*
             * 工作区里商品页还由 Electron 的顶层 WebContentsView 承载。
             * 对 iframe 做 blur/scale 淡入会让切换时旧页和原生视图同时参与合成，
             * 快速切换时表现为整块白化、模糊和短暂卡顿。工作区切换应直接换层。
             */
            transform: none;
            filter: none;
            transition: none;
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            transform: none;
            filter: none;
            pointer-events: auto;
        }

        .history-drawer-scrim {
            position: absolute;
            inset: 0;
            z-index: 149;
            background: rgba(15, 23, 42, .26);
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
            transition: opacity .22s ease;
        }
        .history-drawer-scrim[hidden] { display: none; }
        .history-drawer-scrim.history-drag-active { pointer-events: none; }
        iframe.history-drawer-frame {
            inset: 0 auto 0 0;
            width: min(370px, calc(100% - 24px));
            height: 100%;
            z-index: 150;
            opacity: 0;
            transform: translateX(-104%);
            filter: none;
            border-radius: 0 22px 22px 0;
            background: var(--panel-bg);
            box-shadow: 18px 0 48px rgba(15, 23, 42, .2);
            transition: transform .26s var(--fluid-ease), opacity .2s ease;
            pointer-events: none;
        }
        iframe.history-drawer-frame.drawer-open {
            opacity: 1;
            transform: translateX(0);
            filter: none;
            pointer-events: auto;
        }
        /* 历史记录管理态：沿用同一个 iframe，在应用壳内展开成居中的大面板。 */
        .history-drawer-scrim.history-manager-scrim {
            background: rgba(15, 23, 42, .46);
            -webkit-backdrop-filter: none;
            backdrop-filter: none;
        }
        iframe.history-drawer-frame.history-manager-open {
            inset: 50% auto auto 50%;
            width: min(1660px, calc(100% - 56px));
            height: min(930px, calc(100% - 40px));
            border-radius: 18px;
            opacity: 1;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            box-shadow: 0 28px 90px rgba(15, 23, 42, .28);
        }
        .history-drawer-close {
            position:absolute;left:min(326px,calc(100% - 58px));top:12px;z-index:152;
            width:34px;height:34px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;
            background:rgba(15,23,42,.78);color:#fff;box-shadow:0 7px 22px rgba(15,23,42,.2);cursor:pointer
        }
        .history-drawer-close[hidden]{display:none}.history-drawer-close svg{width:16px;height:16px}
        .history-drawer-close.history-manager-close {
            left: auto;
            right: calc(max(28px, (100% - 1660px) / 2) + 12px);
            top: calc(max(20px, (100% - 930px) / 2) + 12px);
        }
        .history-preview-viewer {
            position: absolute;
            inset: 0;
            z-index: 170;
            display: grid;
            place-items: center;
            padding: 54px 92px 82px;
            background: rgba(8, 13, 10, .72);
            backdrop-filter: blur(10px);
            animation: historyPreviewFade .18s ease both;
        }
        .history-preview-viewer[hidden] { display: none; }
        .history-preview-content {
            width: min(1100px, calc(100% - 24px));
            height: min(820px, calc(100% - 8px));
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }
        .history-preview-stage {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
            display: block;
            overflow: hidden;
            pointer-events: auto;
            touch-action: none;
            scrollbar-width: none;
        }
        .history-preview-stage.is-scrollable { overflow: auto; }
        .history-preview-stage::-webkit-scrollbar { display: none; }
        .history-preview-surface {
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .history-preview-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            min-width: 0;
            min-height: 0;
            object-fit: contain;
            border-radius: 16px;
            background: rgba(255,255,255,.06);
            box-shadow: 0 24px 80px rgba(0,0,0,.38);
            pointer-events: auto;
            user-select: none;
            -webkit-user-drag: none;
            cursor: zoom-in;
            image-rendering: auto;
            image-rendering: -webkit-optimize-contrast;
            animation: historyPreviewPop .2s ease;
        }
        .history-preview-image.is-zoomed { cursor: grab; }
        .history-preview-video { cursor: default; }
        .history-preview-video.is-zoomed { cursor: default; }
        .history-preview-image[hidden],.history-preview-video[hidden] { display: none; }
        .history-preview-image.is-dragging { cursor: grabbing; }
        .history-preview-close,.history-preview-nav {
            position: absolute;
            z-index: 2;
            width: 48px;
            height: 48px;
            padding: 0;
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #fff;
            background: rgba(15,23,42,.72);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,.22);
            cursor: pointer;
            transition: transform .16s ease, background .16s ease;
        }
        .history-preview-close:hover,.history-preview-nav:hover { background: rgba(15,23,42,.94); transform: scale(1.06); }
        .history-preview-close { top: 18px; right: 20px; }
        .history-preview-nav { top: 50%; transform: translateY(-50%); }
        .history-preview-nav:hover { transform: translateY(-50%) scale(1.06); }
        .history-preview-prev { left: 22px; }
        .history-preview-next { right: 22px; }
        .history-preview-close svg,.history-preview-nav svg { width: 22px; height: 22px; }
        .history-preview-tools {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 14px;
            background: rgba(15,23,42,.72);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }
        .history-preview-tools[hidden] { display: none; }
        .history-preview-tool {
            width: 36px;
            height: 34px;
            padding: 0;
            border: 0;
            border-radius: 9px;
            display: grid;
            place-items: center;
            color: #fff;
            background: transparent;
            cursor: pointer;
        }
        .history-preview-tool:hover { background: rgba(255,255,255,.14); }
        .history-preview-tool.copied { color:#86efac; background:rgba(22,101,52,.42); }
        .history-preview-tool svg { width: 17px; height: 17px; }
        .history-preview-zoom-value { min-width: 54px; color:#fff; text-align:center; font-size:12px; font-weight:800; }
        .history-preview-counter {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 58px;
            padding: 7px 12px;
            border-radius: 99px;
            color: #fff;
            background: rgba(15,23,42,.68);
            text-align: center;
            font-size: 12px;
            font-weight: 800;
        }
        .history-preview-context-menu {
            position: fixed;
            z-index: 175;
            min-width: 142px;
            padding: 6px;
            border: 1px solid rgba(255,255,255,.2);
            border-radius: 12px;
            background: rgba(15,23,42,.94);
            backdrop-filter: blur(12px);
            box-shadow: 0 14px 34px rgba(0,0,0,.28);
        }
        .history-preview-context-menu[hidden] { display:none; }
        .history-preview-context-menu button {
            width:100%;
            height:34px;
            padding:0 10px;
            border:0;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:flex-start;
            gap:8px;
            color:#fff;
            background:transparent;
            cursor:pointer;
            font-size:12px;
        }
        .history-preview-context-menu button:hover { background:rgba(255,255,255,.14); }
        .history-preview-context-menu svg { width:15px; height:15px; }
        @keyframes historyPreviewFade { from { opacity: 0; } }
        @keyframes historyPreviewPop { from { opacity: 0; transform: scale(.97); } }
        @media (max-width: 720px) {
            .history-preview-viewer { padding: 60px 54px 78px; }
            .history-preview-nav { width: 42px; height: 42px; }
            .history-preview-prev { left: 8px; }
            .history-preview-next { right: 8px; }
        }
        .nav-item.drawer-active {
            color: var(--text);
            background: var(--nav-active-bg);
        }

        /* 左下角监视器 */
        .nano-monitor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--monitor-bg);
            backdrop-filter: blur(12px);
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--monitor-border);

        .sidebar-datetime {

            --datetime-glow:rgba(59,130,246,.38);
            --datetime-shadow:rgba(37,99,235,.16);
            --datetime-muted:rgba(255,255,255,.72);
            --datetime-surface:color-mix(in srgb, var(--datetime-accent) 20%, #20262e);
            --datetime-surface-deep:color-mix(in srgb, var(--datetime-accent) 9%, #11161d);
            --datetime-edge:color-mix(in srgb, var(--datetime-accent) 34%, rgba(255,255,255,.22));
            --datetime-glow:color-mix(in srgb, var(--datetime-accent) 40%, transparent);
            --datetime-shadow:color-mix(in srgb, var(--datetime-accent) 16%, rgba(15,23,42,.2));
            position:relative;
            isolation:isolate;

            height:56px;

                linear-gradient(135deg, rgba(255,255,255,.12), transparent 42%),

            box-shadow:0 10px 24px var(--datetime-shadow), inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(0,0,0,.18);
            transition:width .3s var(--fluid-ease) .5s, height .3s var(--fluid-ease) .5s, flex-basis .3s var(--fluid-ease) .5s, box-shadow .2s, border-color .2s;
            flex-shrink:0;

        .sidebar-datetime::before {
            content:"";

        .sidebar-datetime::after {

        .sidebar-datetime:hover {

            (function(){
                try {
                    var pageId = localStorage.getItem('studio_active_page');
                    if(pageId === 'task-manager') {
                        pageId = 'commerce-analysis';
                        localStorage.setItem('studio_active_page', pageId);
                    }
                    if(pageId && pageId !== 'zimage') {
                        document.querySelectorAll('.nav-item.active, .side-pill.active').forEach(function(n){
                            n.classList.remove('active');
                        });
                        var target = document.querySelector('[onclick*="\'' + pageId + '\'"]');
                        if(target) target.classList.add('active');
                    }
                } catch(e) {}
            })();

        function setSidebarPinned(pinned, options = {}) {
            const sidebar = document.getElementById('studioSidebar');
            const logo = document.getElementById('sidebarLogoToggle');
            if(!sidebar) return;
            pauseScaleInFrames();
            sidebar.classList.toggle('is-pinned', pinned);
            if(!pinned) {
                sidebar.classList.add('is-collapsing');
                window.setTimeout(() => sidebar.classList.remove('is-collapsing'), 360);
            } else {
                sidebar.classList.remove('is-collapsing');
            }
            if(logo) {
                logo.setAttribute('aria-pressed', pinned ? 'true' : 'false');
                logo.title = pinned ? '收起导航栏' : '固定导航栏';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_PINNED_KEY, pinned ? '1' : '0');
        }

        function toggleSidebarPinned(event) {
            event?.preventDefault?.();
            event?.stopPropagation?.();
            const sidebar = document.getElementById('studioSidebar');
            setSidebarPinned(!sidebar?.classList.contains('is-pinned'));
        }

        function restoreSidebarPinned() {
            setSidebarPinned(localStorage.getItem(SIDEBAR_PINNED_KEY) === '1', { skipRemember:true });
        }

        function setLocalNavCollapsed(collapsed, options = {}) {
            const group = document.getElementById('local-nav-group');
            const toggle = document.getElementById('local-nav-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开本地功能' : '折叠本地功能';
            }
            if(!options.skipRemember) localStorage.setItem(LOCAL_NAV_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleLocalNav() {
            const group = document.getElementById('local-nav-group');
            setLocalNavCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreLocalNav(id) {
            const savedCollapsed = localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1';
            setLocalNavCollapsed(savedCollapsed && !LOCAL_PAGE_IDS.includes(id), { skipRemember:true });
        }

        function setSidebarSettingsCollapsed(collapsed, options = {}) {
            const group = document.getElementById('settings-fold-group');
            const toggle = document.getElementById('settings-fold-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开更多设置' : '收起更多设置';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_SETTINGS_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleSidebarSettings() {
            const group = document.getElementById('settings-fold-group');
            setSidebarSettingsCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function openComfyUiSettings(button) {
            switchUI(button, 'online');
            postToStudioFrame('online', { type:'open-comfyui-settings' }, 80);
        }

        function restoreSidebarSettings(id) {
            // 正式版恢复“外观设置”入口的默认可见状态；用户主动收起后仍沿用自己的偏好。
            if (localStorage.getItem(SIDEBAR_SETTINGS_RESTORE_KEY) !== '1') {
                localStorage.setItem(SIDEBAR_SETTINGS_COLLAPSED_KEY, '0');
                localStorage.setItem(SIDEBAR_SETTINGS_RESTORE_KEY, '1');
            }
            const savedCollapsed = localStorage.getItem(SIDEBAR_SETTINGS_COLLAPSED_KEY) === '1';
            setSidebarSettingsCollapsed(savedCollapsed, { skipRemember:true });
        }

        function resetStudioRootScroll() {
            try {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            } catch(e) {}
        }

        function openHistoryDrawer(el) {
            const frame = document.getElementById('frame-history');
            const scrim = document.getElementById('historyDrawerScrim');
            if(!frame || !scrim) return;
            if(frame.classList.contains('history-manager-open')) {
                closeHistoryDrawer();
                return;
            }
            if(frame.classList.contains('drawer-open')) {
                closeHistoryDrawer();
                return;
            }
            if(!frame.getAttribute('src')) frame.src = frame.dataset.src;
            frame.classList.add('drawer-open');
            scrim.hidden = false;
            const close = document.getElementById('historyDrawerClose');
            if(close) close.hidden = false;
            document.querySelectorAll('.history-trigger').forEach(item => item.classList.add('drawer-active'));
            syncThemeToFrame(frame);
            syncLanguageToFrame(frame);
            syncScaleToFrame(frame);
            syncAppearanceToFrame(frame);
            try { frame.contentWindow?.postMessage({ type:'history-manager-mode', enabled:false }, '*'); } catch(e) {}
            try { frame.contentWindow?.postMessage({ type:'history-focus' }, '*'); } catch(e) {}
        }

        function openHistoryManager() {
            const frame = document.getElementById('frame-history');
            const scrim = document.getElementById('historyDrawerScrim');
            const close = document.getElementById('historyDrawerClose');
            if(!frame || !scrim) return;
            if(!frame.getAttribute('src')) frame.src = frame.dataset.src;
            frame.classList.add('drawer-open', 'history-manager-open');
            scrim.hidden = false;
            scrim.classList.add('history-manager-scrim');
            if(close) {
                close.hidden = false;
                close.classList.add('history-manager-close');
            }
            document.querySelectorAll('.history-trigger').forEach(item => item.classList.add('drawer-active'));
            syncThemeToFrame(frame);
            syncLanguageToFrame(frame);
            syncScaleToFrame(frame);
            syncAppearanceToFrame(frame);
            frame.addEventListener('load', () => {
                if(!frame.classList.contains('history-manager-open')) return;
                try { frame.contentWindow?.postMessage({ type:'history-manager-mode', enabled:true }, '*'); } catch(e) {}
                try { frame.contentWindow?.postMessage({ type:'history-focus' }, '*'); } catch(e) {}
            }, { once:true });
            try { frame.contentWindow?.postMessage({ type:'history-manager-mode', enabled:true }, '*'); } catch(e) {}
            try { frame.contentWindow?.postMessage({ type:'history-focus' }, '*'); } catch(e) {}
        }

        function closeHistoryDrawer() {
            closeHistoryPreview();
            const frame = document.getElementById('frame-history');
            frame?.classList.remove('drawer-open', 'history-manager-open');
            const scrim = document.getElementById('historyDrawerScrim');
            if(scrim) {
                scrim.hidden = true;
                scrim.classList.remove('history-manager-scrim');
            }
            const close = document.getElementById('historyDrawerClose');
            if(close) {
                close.hidden = true;
                close.classList.remove('history-manager-close');
            }
            document.querySelectorAll('.history-trigger').forEach(item => item.classList.remove('drawer-active'));
            try { frame?.contentWindow?.postMessage({ type:'history-manager-mode', enabled:false }, '*'); } catch(e) {}
        }

        let historyPreviewItems = [];
        let historyPreviewIndex = 0;
        let historyPreviewZoom = 1;
        let historyPreviewBaseWidth = 0;
        let historyPreviewBaseHeight = 0;
        let historyPreviewDrag = null;

        function historyPreviewCurrentItem(){
            return historyPreviewItems[historyPreviewIndex] || null;
        }
        function historyPreviewItemKind(item){
            const hinted = String(item?.kind || item?.mediaKind || item?.type || '').toLowerCase();
            if(hinted.includes('video') || /\.(mp4|webm|mov|m4v|avi|mkv|flv)(?:[?#].*)?$/i.test(String(item?.url || ''))) return 'video';
            return 'image';
        }
        function historyPreviewIsVideo(item=historyPreviewCurrentItem()){
            return historyPreviewItemKind(item) === 'video';
        }
        function historyPreviewMediaElement(item=historyPreviewCurrentItem()){
            return historyPreviewIsVideo(item) ? document.getElementById('historyPreviewVideo') : document.getElementById('historyPreviewImage');
        }
        function syncHistoryPreviewActions(){
            const tools = document.querySelector('.history-preview-tools');
            if(tools) tools.hidden = historyPreviewIsVideo();
        }
        function resetHistoryPreviewCopyState(button=document.getElementById('historyPreviewCopyButton')){
            if(!button) return;
            clearTimeout(button._historyCopyTimer);
            button.classList.remove('copied');
            button.disabled = false;
            button.title = '复制图片';
            button.setAttribute('aria-label','复制图片');
        }
        function markHistoryPreviewCopied(button){
            if(!button) return;
            clearTimeout(button._historyCopyTimer);
            button.classList.add('copied');
            button.title = '已复制图片';
            button.setAttribute('aria-label','已复制图片');
            button._historyCopyTimer = setTimeout(() => resetHistoryPreviewCopyState(button),1600);
        }
        async function historyImageBlobToPng(blob){
            if(String(blob?.type || '').toLowerCase() === 'image/png') return blob;
            const objectUrl = URL.createObjectURL(blob);
            try{
                const imageEl = await new Promise((resolve,reject) => {
                    const image = new Image();
                    image.onload = () => resolve(image);
                    image.onerror = () => reject(new Error('图片解码失败'));
                    image.src = objectUrl;
                });
                const canvasEl = document.createElement('canvas');
                canvasEl.width = Math.max(1,imageEl.naturalWidth || imageEl.width || 1);
                canvasEl.height = Math.max(1,imageEl.naturalHeight || imageEl.height || 1);
                const context = canvasEl.getContext('2d');
                if(!context) throw new Error('无法创建图片画布');
                context.drawImage(imageEl,0,0,canvasEl.width,canvasEl.height);
                const png = await new Promise(resolve => canvasEl.toBlob(resolve,'image/png'));
                if(!png) throw new Error('无法转换图片格式');
                return png;
            }finally{ URL.revokeObjectURL(objectUrl); }
        }
        function historyPreviewElectronApi(){
            if(window.electronAPI?.writeImageToClipboard) return window.electronAPI;
            try{
                if(window.parent && window.parent !== window && window.parent.electronAPI?.writeImageToClipboard){
                    return window.parent.electronAPI;
                }
            }catch(error){}
            return null;
        }
        async function loadHistoryPreviewImagePng(url){
            const response = await fetch(url,{credentials:'same-origin'});
            if(!response.ok) throw new Error(`图片读取失败（${response.status}）`);
            const blob = await response.blob();
            if(!/^image\//i.test(String(blob.type || ''))) throw new Error('读取到的内容不是图片');
            return historyImageBlobToPng(blob);
        }
        async function copyHistoryImage(url,button){
            if(!url || button?.disabled) return false;
            if(button) button.disabled = true;
            try{
                const electron = historyPreviewElectronApi();
                if(electron?.writeImageToClipboard){
                    const png = await loadHistoryPreviewImagePng(url);
                    const result = await electron.writeImageToClipboard(await png.arrayBuffer());
                    if(!result?.ok) throw new Error(result?.message || '桌面剪贴板写入失败');
                }else{
                    const ClipboardItemCtor = window.ClipboardItem;
                    if(!navigator.clipboard?.write || typeof ClipboardItemCtor !== 'function') throw new Error('当前浏览器不支持复制图片');
                    // 在用户点击的同步调用栈内先发起写入，避免图片读取完成后失去临时授权。
                    const pngPromise = loadHistoryPreviewImagePng(url);
                    await navigator.clipboard.write([new ClipboardItemCtor({'image/png':pngPromise})]);
                }
                markHistoryPreviewCopied(button);
                return true;
            }catch(error){
                console.warn('[history-preview] copy image failed',error);
                alert('复制图片失败，请使用下载或右键菜单');
                return false;
            }finally{ if(button) button.disabled = false; }
        }

        async function copyHistoryPreviewFromContextMenu(event){

        function openHistoryPreview(items,index=0) {
            historyPreviewItems = Array.isArray(items)
                ? items.filter(item => item && item.url).map(item => ({...item,kind:historyPreviewItemKind(item)}))
                : [];
            if(!historyPreviewItems.length) return;
            closeHistoryPreviewContextMenu();
            historyPreviewIndex = Math.min(Math.max(Number(index) || 0,0),historyPreviewItems.length - 1);
            const viewer = document.getElementById('historyPreviewViewer');
            if(!viewer) return;
            viewer.hidden = false;
            renderHistoryPreview();
            try { lucide.createIcons(); } catch(e) {}
        }

        function renderHistoryPreview() {
            if(!historyPreviewItems.length) return;
            const item = historyPreviewItems[historyPreviewIndex];
            const isVideo = historyPreviewIsVideo(item);
            resetHistoryPreviewCopyState();
            syncHistoryPreviewActions();
            const image = document.getElementById('historyPreviewImage');
            const video = document.getElementById('historyPreviewVideo');
            const counter = document.getElementById('historyPreviewCounter');
            historyPreviewBaseWidth = 0;
            historyPreviewBaseHeight = 0;
            const resetMediaStyles = element => {
                if(!element) return;
                element.style.width = '';
                element.style.height = '';
                element.style.maxWidth = '100%';
                element.style.maxHeight = '100%';
                element.style.transform = 'none';
                element.classList.remove('is-zoomed','is-dragging');
            };
            if(image) {
                resetMediaStyles(image);
                image.hidden = isVideo;
                image.onload = null;
                if(isVideo) image.removeAttribute('src');
                else {
                    image.onload = () => requestAnimationFrame(() => {
                        historyPreviewBaseWidth = image.offsetWidth;
                        historyPreviewBaseHeight = image.offsetHeight;
                        resetHistoryPreviewTransform();
                    });
                    image.src = item.url;
                }
            }
            if(video) {
                resetMediaStyles(video);
                video.hidden = !isVideo;
                video.onloadedmetadata = null;
                if(isVideo) {
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                    video.onloadedmetadata = () => requestAnimationFrame(() => {
                        historyPreviewBaseWidth = video.offsetWidth;
                        historyPreviewBaseHeight = video.offsetHeight;
                        resetHistoryPreviewTransform();
                    });
                    video.src = item.url;
                    video.load();
                } else {
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                }
            }
            if(counter) counter.textContent = `${historyPreviewIndex + 1} / ${historyPreviewItems.length}`;
            resetHistoryPreviewTransform();
        }

        function applyHistoryPreviewTransform(recenter=true) {
            const image = historyPreviewMediaElement();
            const stage = document.getElementById('historyPreviewStage');
            const surface = document.getElementById('historyPreviewSurface');
            const value = document.getElementById('historyPreviewZoomValue');
            if(image && stage && surface && historyPreviewBaseWidth && historyPreviewBaseHeight) {
                const targetWidth = Math.max(1,Math.round(historyPreviewBaseWidth * historyPreviewZoom));
                const targetHeight = Math.max(1,Math.round(historyPreviewBaseHeight * historyPreviewZoom));
                image.style.transform = 'none';
                image.style.maxWidth = 'none';
                image.style.maxHeight = 'none';
                image.style.width = `${targetWidth}px`;
                image.style.height = `${targetHeight}px`;
                surface.style.width = `${Math.max(stage.clientWidth,targetWidth)}px`;
                surface.style.height = `${Math.max(stage.clientHeight,targetHeight)}px`;
                stage.classList.toggle('is-scrollable',targetWidth > stage.clientWidth || targetHeight > stage.clientHeight);
                image.classList.toggle('is-zoomed',historyPreviewZoom > 1.001);
                if(historyPreviewZoom <= 1.001) image.classList.remove('is-dragging');
                if(recenter) requestAnimationFrame(() => {
                    stage.scrollLeft = Math.max(0,(surface.offsetWidth - stage.clientWidth) / 2);
                    stage.scrollTop = Math.max(0,(surface.offsetHeight - stage.clientHeight) / 2);
                });
            }
            if(value) value.textContent = `${Math.round(historyPreviewZoom * 100)}%`;
        }

        function historyPreviewLosslessMaxZoom() {
            const image = historyPreviewMediaElement();
            if(historyPreviewIsVideo() || !image || !image.complete || !image.naturalWidth || !historyPreviewBaseWidth || !historyPreviewBaseHeight) return 1;
            const pixelRatio = Math.max(1,window.devicePixelRatio || 1);
            const widthRatio = image.naturalWidth / (historyPreviewBaseWidth * pixelRatio);
            const heightRatio = image.naturalHeight / (historyPreviewBaseHeight * pixelRatio);
            return Math.max(1,Math.min(5,Math.floor(Math.min(widthRatio,heightRatio) * 100) / 100));
        }

        function setHistoryPreviewZoom(nextZoom) {
            if(historyPreviewIsVideo()) {
                historyPreviewZoom = 1;
                applyHistoryPreviewTransform();
                return;
            }
            const maxZoom = historyPreviewLosslessMaxZoom();
            const next = Math.min(maxZoom,Math.max(.5,Number(nextZoom) || 1));
            historyPreviewZoom = Math.round(next * 100) / 100;
            applyHistoryPreviewTransform();
        }

        function zoomHistoryPreview(delta) {
            setHistoryPreviewZoom(historyPreviewZoom + Number(delta || 0));
        }

        function resetHistoryPreviewTransform() {
            historyPreviewZoom = 1;
            historyPreviewDrag = null;
            applyHistoryPreviewTransform();
        }

        function toggleHistoryPreviewZoom(event) {
            event?.preventDefault();
            event?.stopPropagation();
            if(historyPreviewIsVideo()) return;
            if(historyPreviewZoom > 1.001) resetHistoryPreviewTransform();
            else setHistoryPreviewZoom(Math.min(2,historyPreviewLosslessMaxZoom()));
        }

        function handleHistoryPreviewWheel(event) {
            event.preventDefault();
            event.stopPropagation();
            if(historyPreviewIsVideo()) return;
            setHistoryPreviewZoom(historyPreviewZoom + (event.deltaY < 0 ? .2 : -.2));
        }

        function startHistoryPreviewDrag(event) {
            if(historyPreviewIsVideo() || historyPreviewZoom <= 1.001 || event.button !== 0) return;
            event.preventDefault();
            const image = historyPreviewMediaElement();
            const stage = document.getElementById('historyPreviewStage');
            if(!stage) return;
            image?.setPointerCapture?.(event.pointerId);
            image?.classList.add('is-dragging');
            historyPreviewDrag = { pointerId:event.pointerId, x:event.clientX, y:event.clientY, scrollLeft:stage.scrollLeft, scrollTop:stage.scrollTop };
        }

        function moveHistoryPreviewDrag(event) {
            if(!historyPreviewDrag || historyPreviewDrag.pointerId !== event.pointerId) return;
            const stage = document.getElementById('historyPreviewStage');
            if(!stage) return;
            stage.scrollLeft = historyPreviewDrag.scrollLeft - (event.clientX - historyPreviewDrag.x);
            stage.scrollTop = historyPreviewDrag.scrollTop - (event.clientY - historyPreviewDrag.y);
        }

        function endHistoryPreviewDrag(event) {
            if(!historyPreviewDrag || historyPreviewDrag.pointerId !== event.pointerId) return;
            const image = historyPreviewMediaElement();
            try { image?.releasePointerCapture?.(event.pointerId); } catch(e) {}
            image?.classList.remove('is-dragging');
            historyPreviewDrag = null;
        }

        function stepHistoryPreview(delta) {
            if(historyPreviewItems.length < 2) return;
            historyPreviewIndex = (historyPreviewIndex + Number(delta) + historyPreviewItems.length) % historyPreviewItems.length;
            renderHistoryPreview();
        }

        function closeHistoryPreview() {
            closeHistoryPreviewContextMenu();
            const viewer = document.getElementById('historyPreviewViewer');
            if(viewer) viewer.hidden = true;
            const image = document.getElementById('historyPreviewImage');
            if(image) image.removeAttribute('src');
            const video = document.getElementById('historyPreviewVideo');
            if(video) {
                video.pause();
                video.hidden = true;
                video.removeAttribute('src');
                video.load();
            }
            const surface = document.getElementById('historyPreviewSurface');
            const stage = document.getElementById('historyPreviewStage');
            if(surface) { surface.style.width = '100%'; surface.style.height = '100%'; }
            if(stage) { stage.scrollLeft = 0; stage.scrollTop = 0; stage.classList.remove('is-scrollable'); }
            historyPreviewItems = [];
            historyPreviewIndex = 0;
            resetHistoryPreviewTransform();
            historyPreviewBaseWidth = 0;
            historyPreviewBaseHeight = 0;
            syncHistoryPreviewActions();
        }

        window.addEventListener('keydown', event => {
            const viewer = document.getElementById('historyPreviewViewer');
            const previewOpen = viewer && !viewer.hidden;
            if(previewOpen && event.key === 'ArrowLeft') { event.preventDefault(); stepHistoryPreview(-1); return; }
            if(previewOpen && event.key === 'ArrowRight') { event.preventDefault(); stepHistoryPreview(1); return; }
            if(event.key === 'Escape' && previewOpen) { closeHistoryPreview(); return; }

        const STAGE_LOADING_LABELS = {

            commerce: '正在打开电商工作台…',

        function setStageLoading(visible, id = '') {

        function setupStageLoading() {
            document.querySelectorAll('.stage > iframe').forEach(frame => {
                if(frame.dataset.stageLoadingBound === '1') return;

        function switchUI(el, id, options = {}) {
            closeHistoryDrawer();
            resetStudioRootScroll();
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            const targetAlreadyLoaded = target.dataset.stageLoaded === '1'
                || (!!target.src && target.contentDocument?.readyState === 'complete' && target.contentDocument?.body?.childElementCount > 0);
            setStageLoading(!targetAlreadyLoaded, id);
            if (!target.src) target.src = target.dataset.src;
            // 商品分析台内部还分“工作应用首页”和“商品页标签”。
            // 进入外层 iframe 时不能直接显示顶层 WebContentsView，否则首页会被
            // 一个空白的商品视图盖住；商品分析台会根据自己的当前标签同步可见性。
            const commercePageActive = id === 'commerce-analysis';
            window.electronAPI?.setCommercePageActive?.(commercePageActive);
            if (!commercePageActive) window.electronAPI?.setProductVisible?.(false);
            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            // sync theme to newly activated iframe
            syncThemeToFrame(target);
            syncLanguageToFrame(target);
            syncScaleToFrame(target);
            syncAppearanceToFrame(target);
            if(LOCAL_PAGE_IDS.includes(id)) {

                setLocalNavCollapsed(localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1', { skipRemember:true });
            }
            // 切换到画布时通知刷新工作流列表（防止在 comfyui-settings 修改后画布未及时更新）
            if (id === 'canvas' && target.src) {
                try { target.contentWindow?.postMessage({ type: 'canvas-focus' }, '*'); } catch(e) {}
            }
            if (id === 'canvas') applyPendingPromptCaseToFrame(target);
            if (id === 'commerce-analysis') notifyCommerceFrameLayout();
            resetStudioRootScroll();

        function postToStudioFrame(id, payload, delay = 0) {
            const frame = document.getElementById('frame-' + id);
            if (!frame) return;
            let sent = false;
            const send = () => {
                if (sent) return;
                sent = true;
                try { frame.contentWindow?.postMessage(payload, '*'); } catch(e) {}
            };
            if (frame.contentDocument?.readyState === 'complete') window.setTimeout(send, delay);
            else frame.addEventListener('load', () => window.setTimeout(send, delay), { once:true });
            window.setTimeout(send, Math.max(500, delay + 250));
        }

        function promptCasePendingPayload(caseData) {
            return { case: caseData, queued_at: Date.now() };
        }

        function readPendingPromptCase() {
            try {
                const payload = JSON.parse(localStorage.getItem(PROMPT_CASE_PENDING_KEY) || 'null');
                if (!payload?.case) return null;
                if (Date.now() - Number(payload.queued_at || 0) > PROMPT_CASE_PENDING_TTL) {
                    localStorage.removeItem(PROMPT_CASE_PENDING_KEY);
                    return null;
                }
                return payload;
            } catch(e) {
                localStorage.removeItem(PROMPT_CASE_PENDING_KEY);
                return null;
            }
        }

        function isSmartCanvasFrame(frame) {
            try { return /\/smart-canvas\.html(?:$|\?)/.test(frame?.contentWindow?.location?.pathname || ''); } catch(e) { return false; }
        }

        function isPromptLibraryFrame(frame) {
            try { return /\/prompt-library\.html(?:$|\?)/.test(frame?.contentWindow?.location?.pathname || ''); } catch(e) { return false; }
        }

        function applyPendingPromptCaseToFrame(frame) {
            const payload = readPendingPromptCase();
            if (!payload || !isSmartCanvasFrame(frame)) return false;
            try {
                frame.contentWindow.postMessage({ type: 'prompt-case-apply', case: payload.case }, '*');
                localStorage.removeItem(PROMPT_CASE_PENDING_KEY);
                return true;
            } catch(e) { return false; }
        }

        function sendPromptCaseToCanvas(caseData) {
            if (!caseData) return;
            const frame = document.getElementById('frame-canvas');
            if (isSmartCanvasFrame(frame)) {
                try { frame.contentWindow.postMessage({ type: 'prompt-case-apply', case: caseData }, '*'); return; } catch(e) {}
            }
            try { localStorage.setItem(PROMPT_CASE_PENDING_KEY, JSON.stringify(promptCasePendingPayload(caseData))); } catch(e) {}
            const canvasTrigger = document.querySelector(`[onclick*="'canvas'"],[onclick*='"canvas"']`);
            switchUI(canvasTrigger, 'canvas');
            try { applyPendingPromptCaseToFrame(frame); } catch(e) {}
        }

        function applyPendingPromptCaseOpenToFrame(frame) {
            let caseId = '';
            try { caseId = String(localStorage.getItem(PROMPT_CASE_OPEN_PENDING_KEY) || ''); } catch(e) {}
            if(!caseId || !isPromptLibraryFrame(frame)) return false;
            try {
                frame.contentWindow.postMessage({ type:'prompt-case-open', case_id:caseId }, '*');
                localStorage.removeItem(PROMPT_CASE_OPEN_PENDING_KEY);
                return true;
            } catch(e) { return false; }
        }

        function sendPromptCaseOpenToLibrary(caseId) {
            if(!caseId) return;

            if(isPromptLibraryFrame(frame)) {
                try { frame.contentWindow.postMessage({ type:'prompt-case-open', case_id:caseId }, '*'); return; } catch(e) {}
            }
            try { localStorage.setItem(PROMPT_CASE_OPEN_PENDING_KEY, caseId); } catch(e) {}
            const libraryTrigger = document.querySelector(`[onclick*="'prompt-library'"],[onclick*='"prompt-library"']`);
            switchUI(libraryTrigger, 'prompt-library');
            try { applyPendingPromptCaseOpenToFrame(frame); } catch(e) {}

        function forwardStudioApiChange(data) {
            if(!data || !['providers-changed','workflows-changed','comfy-instances-changed'].includes(data.type)) return;
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');

        window.addEventListener('message', event => {
            if (event.origin && event.origin !== location.origin) return;
            if(event.data?.type === 'canvas-share-open') {
                const source = event.source;
                const requestId = String(event.data.requestId || '');
                const url = String(event.data.url || '').trim();
                const reply = result => {
                    try { source?.postMessage({ type:'canvas-share-open-result', requestId, result }, event.origin || location.origin); } catch(e) {}
                };
                if(window.electronAPI?.openSharedCanvas) {
                    Promise.resolve(window.electronAPI.openSharedCanvas(url))
                        .then(result => reply(result || { ok:false, message:'无法打开协同画布' }))
                        .catch(error => reply({ ok:false, message:error?.message || '无法打开协同画布' }));
                } else {
                    try {
                        const popup = window.open(url, '_blank', 'noopener,noreferrer');
                        reply(popup ? { ok:true, mode:'browser' } : { ok:false, message:'浏览器阻止了新窗口，请允许弹出窗口后重试' });
                    } catch(error) {
                        reply({ ok:false, message:error?.message || '无法打开协同画布' });
                    }
                }
                return;
            }
            if(event.data?.type === 'history-drag-state') {
                document.getElementById('historyDrawerScrim')?.classList.toggle('history-drag-active', Boolean(event.data.active));

                closeHistoryDrawer();
                return;

            if(event.data?.type === 'history-manager-open') {

            if(event.data?.type === 'history-preview-open') {
                openHistoryPreview(event.data.items,event.data.index);

            if(event.data?.type === 'prompt-case-apply-request') {
                sendPromptCaseToCanvas(event.data.case);

            if(event.data?.type === 'prompt-case-open') {
                sendPromptCaseOpenToLibrary(event.data.case_id || event.data.caseId);

                const comfyTrigger = document.querySelector(`[onclick*="'online'"],[onclick*='"online"']`);

                const workflowRef = String(payload?.workflow_ref || '').trim();
                if(!workflowRef) return;

                        else event.source?.postMessage?.({ type:'commerce-shell-unavailable', action:'open-login' }, '*');

                        else event.source?.postMessage?.({ type:'commerce-shell-unavailable', action:'open-seller' }, '*');
                    } catch(e) {}
                }
                return;
            }
            if(event.data?.type === 'commerce-overlay') {
                setNativeCommerceOverlayActive(Boolean(event.data.active));

            if(event.data?.type === 'commerce-surface-bounds') {
                try {
                    const frame = document.getElementById('frame-commerce-analysis');
                    if (!frame || event.source !== frame.contentWindow) return;
                    const frameRect = frame.getBoundingClientRect();
                    const source = event.data.bounds || {};
                    const sx = frameRect.width / (frame.offsetWidth || frameRect.width || 1);

                        width: (Number(source.width) || 0) * sx,
                        height: (Number(source.height) || 0) * sy

        function lunarDayText(value) {
            const day = Number(value);
            const digits = ['', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
            if(!Number.isInteger(day) || day < 1 || day > 30) return String(value || '');
            if(day <= 10) return day === 10 ? '初十' : `初${digits[day]}`;
            if(day < 20) return `十${digits[day - 10]}`;
            if(day === 20) return '二十';
            if(day < 30) return `二十${digits[day - 20]}`;
            return '三十';
        }

        function lunarDateText(date) {
            try {
                const parts = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { month:'long', day:'numeric' }).formatToParts(date);
                const month = parts.find(part => part.type === 'month')?.value || '';
                const day = parts.find(part => part.type === 'day')?.value || '';
                return month && day ? `${month}${lunarDayText(day)}` : '';
            } catch(e) {
                return '';
            }
        }

                : `${now.getMonth() + 1}月${now.getDate()}日 ${new Intl.DateTimeFormat('zh-CN', { weekday:'long' }).format(now)}${lunarText ? ` · ${lunarText}` : ''}`;
            clock.textContent = `${hours}:${minutes}`;

        function versionParts(value) {
            return String(value || '').match(/\d+/g)?.map(Number) || [];
        }

        function compareVersions(a, b) {
            const aa = versionParts(a);
            const bb = versionParts(b);
            const len = Math.max(aa.length, bb.length);
            for(let i = 0; i < len; i++){
                const diff = (aa[i] || 0) - (bb[i] || 0);
                if(diff) return diff;
            }
            return String(a || '').trim() === String(b || '').trim() ? 0 : 1;
        }

        function compactVersion(value) {
            const text = String(value || '').trim();
            const parts = text.match(/\d+/g) || [];
            if(parts.length >= 3) return `${parts[1]}.${parts[2]}`;
            return text.replace(/^v/i, '') || '-';
        }

        function versionLabel(value, mode = 'full') {
            const text = String(value || '').trim();
            if(!text) return 'v-';
            return mode === 'compact' ? `v${compactVersion(text)}` : `v${text.replace(/^v/i, '')}`;
        }

        function sourceConnectivityStats(source, results = []) {
            const sourceItems = (results || []).filter(item => item.source === source);
            const required = sourceItems.filter(item => item.required);
            const okRequired = required.length ? required.every(item => item.ok) : false;
            const okItems = sourceItems.filter(item => item.ok);
            const avg = okItems.length
                ? Math.round(okItems.reduce((sum, item) => sum + Number(item.elapsed_ms || 0), 0) / okItems.length)
                : 999999;
            return {source, ok:okRequired, avg, okItems:okItems.length, total:sourceItems.length};
        }

        function bestUpdateSourceFromConnectivity(data) {
            const results = data?.results || [];
            const github = sourceConnectivityStats('github', results);
            const ms = sourceConnectivityStats('modelscope', results);
            if(github.ok && ms.ok) return ms.avg < github.avg ? 'modelscope' : 'github';
            if(ms.ok) return 'modelscope';
            if(github.ok) return 'github';
            return updateSource;

                name.textContent = updateTargetLabel(item.name);
