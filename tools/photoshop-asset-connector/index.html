<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小美画布工具</title>
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <main class="app">
    <header class="app-head">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true">XM</span>
        <div class="brand-copy">
          <div class="brand-title">小美画布工具</div>
          <div class="brand-sub">PS 资产桥接</div>
        </div>
      </div>
      <div class="conn-pill"><span class="dot off" id="dot" title="未连接"></span>连接</div>
    </header>

    <nav class="tabs" aria-label="面板">
      <button type="button" class="tab" data-tab="assets">资产</button>
      <button type="button" class="tab" data-tab="generate">生成</button>
      <button type="button" class="tab" data-tab="agent">Agent</button>
      <button type="button" class="tab active" data-tab="settings">设置</button>
    </nav>

    <div class="views">
      <section data-view="assets" class="view" aria-labelledby="assetsTitle">
        <article class="panel assets-panel">
          <header class="panel-head">
            <div class="panel-title"><h2 id="assetsTitle">素材库</h2><span id="count">未连接</span></div>
            <button class="refresh-btn" id="refreshBtn" type="button" title="重试空白缩略图">刷新</button>
          </header>
          <div class="panel-body">
            <div class="sources" aria-label="素材来源">
              <button type="button" class="seg" data-source="assets">图片资产</button>
              <button type="button" class="seg" data-source="canvas">画布资产</button>
              <button type="button" class="seg" data-source="local">本地素材</button>
            </div>
            <div class="selectors">
              <sp-picker size="s" id="selectA" aria-label="库"><sp-menu slot="options"></sp-menu></sp-picker>
              <sp-picker size="s" id="selectB" aria-label="分组或文件夹"><sp-menu slot="options"></sp-menu></sp-picker>
            </div>
            <div class="filters">
              <input type="search" id="search" aria-label="搜索素材" placeholder="搜索名称、标签或描述">
            </div>
            <div id="grid" class="grid empty">
              <div class="empty-state">连接后可浏览素材。</div>
            </div>
          </div>
          <footer class="panel-foot">
            <div class="bottom">
              <button id="placeBtn" class="primary" disabled type="button">下载到图层</button>
              <button id="exportBtn" class="btn" disabled type="button">上传当前画面</button>
            </div>
            <div class="push-msg" id="pushMsg" role="status"></div>
          </footer>
        </article>
      </section>

      <section data-view="generate" class="view" aria-labelledby="generateTitle">
        <article class="panel">
          <header class="panel-head">
            <div class="panel-title"><h2 id="generateTitle">生成</h2><span>API / RunningHub / ComfyUI</span></div>
          </header>
          <div class="panel-body gen-scroll">
            <div class="sources compact" id="genModes" aria-label="生成方式">
              <button type="button" class="seg active" data-mode="api">API</button>
              <button type="button" class="seg" data-mode="rh">RH</button>
              <button type="button" class="seg" data-mode="comfy">ComfyUI</button>
            </div>
            <div class="gen-row2" id="genApiBar">
              <sp-picker size="s" id="genProvider" aria-label="API 平台"><sp-menu slot="options"></sp-menu></sp-picker>
              <sp-picker size="s" id="genModel" aria-label="生图模型"><sp-menu slot="options"></sp-menu></sp-picker>
            </div>
            <div class="workflow-box hidden" id="genRhBar">
              <div class="gen-label">RunningHub 工作流</div>
              <sp-picker size="s" id="genRhWorkflow" aria-label="RunningHub 工作流"><sp-menu slot="options"></sp-menu></sp-picker>
              <label class="gen-check"><input type="checkbox" id="genRhWallet"> 使用钱包扣费</label>
            </div>
            <div class="workflow-box hidden" id="genComfyBar">
              <div class="gen-label">ComfyUI 工作流</div>
              <sp-picker size="s" id="genComfyWorkflow" aria-label="ComfyUI 工作流"><sp-menu slot="options"></sp-menu></sp-picker>
            </div>
            <textarea rows="3" id="genPrompt" class="gen-prompt" aria-label="生图提示词" placeholder="描述你想生成的画面…"></textarea>
            <div class="gen-params" id="genParams"></div>
            <div id="genRefsSection" class="thumb-section">
              <div class="gen-label">参考图</div><div class="gen-thumbs" id="genRefs"></div>
            </div>
            <div class="thumb-section">
              <div class="gen-label">生成结果</div><div class="gen-thumbs" id="genResults"></div>
            </div>
          </div>
          <footer class="panel-foot">
            <div class="gen-bottom"><button class="primary" id="genRun" disabled type="button">生成</button></div>
            <div class="push-msg" id="genMsg" role="status"></div>
          </footer>
        </article>
      </section>

      <section data-view="agent" class="view" aria-labelledby="agentTitle">
        <article class="panel agent-panel">
          <header class="panel-head">
            <div class="panel-title"><h2 id="agentTitle">Agent</h2><span>对话生成和图像编辑</span></div>
            <button class="icon-btn" id="agToggleModels" type="button" title="模型设置">设置</button>
          </header>
          <div class="agent-bar">
            <button class="btn" id="agNew" type="button">＋ 新对话</button>
            <sp-picker size="s" id="agHistory" aria-label="历史对话"><sp-menu slot="options"></sp-menu></sp-picker>
            <button class="btn danger" id="agDelete" disabled type="button">删除</button>
          </div>
          <div class="agent-models" id="agModels">
            <div class="gen-row2">
              <sp-picker size="s" id="agLlmProvider" aria-label="对话平台"><sp-menu slot="options"></sp-menu></sp-picker>
              <sp-picker size="s" id="agLlmModel" aria-label="对话模型"><sp-menu slot="options"></sp-menu></sp-picker>
            </div>
            <div class="gen-row2">
              <sp-picker size="s" id="agImgProvider" aria-label="生图平台"><sp-menu slot="options"></sp-menu></sp-picker>
              <sp-picker size="s" id="agImgModel" aria-label="生图模型"><sp-menu slot="options"></sp-menu></sp-picker>
            </div>
          </div>
          <div class="agent-msgs" id="agMessages" aria-label="对话消息"></div>
          <div class="agent-attach" id="agAttach"></div>
          <footer class="panel-foot agent-foot">
            <div class="agent-tools">
              <button class="mode-btn" id="agRegionBtn" type="button" title="发送时读取 Photoshop 矩形选区">▣ 选区</button>
              <button class="mode-btn" id="agRetryBtn" type="button" title="重试上一次请求">↻ 重试</button>
            </div>
            <div class="agent-input">
              <button class="icon-btn" id="agAttachBtn" type="button" aria-label="添加当前画面">＋</button>
              <textarea id="agInput" rows="2" aria-label="对话内容" placeholder="例如：把当前图层改成夜景（回车发送，Shift+回车换行）"></textarea>
              <button class="primary" id="agSend" disabled type="button">发送</button>
            </div>
            <div class="push-msg" id="agStatus" role="status"></div>
          </footer>
        </article>
      </section>

      <section data-view="settings" class="view active" aria-labelledby="settingsTitle">
        <article class="panel">
          <header class="panel-head">
            <div class="panel-title"><h2 id="settingsTitle">连接设置</h2><span>连接本机小美画布</span></div>
          </header>
          <div class="panel-body settings-body">
            <div class="field">
              <label for="server">服务地址</label>
              <div class="row">
                <input id="server" type="text" spellcheck="false" placeholder="例如 127.0.0.1:3000">
                <button class="primary-sm" id="connectBtn" type="button">连接</button>
              </div>
            </div>
            <div class="conn-msg" id="connMsg" role="status">请先启动小美画布，再填写实际使用的本机端口。</div>
            <label class="live"><input type="checkbox" id="liveToggle" checked> 实时同步</label>
            <div class="settings-card">
              <div class="settings-card-title">上传范围</div>
              <label class="live"><input type="checkbox" id="exportLayerToggle"> 按选中图层大小上传</label>
            </div>
            <button class="btn settings-link" id="githubBtn" type="button">查看原连接器来源</button>
            <div class="about">小美画布工具 · v0.3.0</div>
          </div>
        </article>
      </section>
    </div>
  </main>

  <script src="js/state.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/net.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/ps.js"></script>
  <script src="js/socket.js"></script>
  <script src="js/generation-tasks.js"></script>
  <script src="js/generate.js"></script>
  <script src="js/agent.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
