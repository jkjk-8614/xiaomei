<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小美画布素材采集</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.mjs"></script>
</head>
<body>
  <main>
    <header class="bar">
      <img class="brand" src="brand.png" alt="" width="26" height="26">
      <h1>小美画布素材采集</h1>
      <a class="source" href="https://github.com/jkjk-8614/xiaomei" target="_blank" rel="noopener">GitHub</a>
      <button id="pin" type="button" title="打开浏览器侧边栏">侧边栏</button>
    </header>

    <details id="settings">
      <summary>参数设置 <span id="addressSummary"></span></summary>
      <div class="settings">
        <div class="fields">
          <label>服务地址<input id="server" type="text" placeholder="127.0.0.1:3000" spellcheck="false"></label>
          <label>文件夹<input id="folder" type="text" placeholder="网页采集"></label>
        </div>
        <div class="connection">
          <label><input id="classify" type="checkbox">导入后智能分类</label>
          <button id="connect" type="button">连接</button>
        </div>
        <div class="fields">
          <select id="provider" aria-label="平台"></select>
          <select id="model" aria-label="模型"></select>
        </div>
        <textarea id="prompt" rows="2" aria-label="分类要求" placeholder="追加分类要求（选填）"></textarea>
      </div>
    </details>

    <section class="scan">
      <button id="scan" class="main-button" type="button">扫描当前页面图片</button>
      <div class="options">
        <label><input id="filterLowRes" type="checkbox">过滤低分辨率</label>
        <label><input id="autoScroll" type="checkbox">自动翻页加载</label>
        <button id="capture" type="button">截图</button>
      </div>
    </section>
    <section class="toolbar" aria-label="选中素材">
      <span id="count">未扫描</span>
      <button id="all" type="button">全选</button>
      <button id="clear" type="button">清空</button>
    </section>
    <div id="grid" aria-label="扫描结果"></div>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>
      <button id="download" type="button" disabled>下载到本地</button>
      <button id="import" class="main-button" type="button" disabled>导入资产库</button>
    </footer>
  </main>
  <dialog id="preview" aria-label="素材预览">
    <button id="closePreview" type="button" aria-label="关闭预览">关闭</button>
    <div id="previewBody"></div>
  </dialog>
</body>
</html>
