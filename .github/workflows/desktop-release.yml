name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Verify release inputs
        shell: pwsh
        env:
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-inputs.mjs
      - name: Test desktop update checks and downloads
        shell: pwsh
        run: node --test tests/test_desktop_updater.cjs tests/test_desktop_update_network.cjs tests/test_desktop_update_actions.cjs
      - name: Set desktop build revision
        run: node -e "const fs=require('node:fs'); const pkg=require('./package.json'); pkg.buildRevision=Number(process.env.GITHUB_RUN_NUMBER); fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"
      - name: Test optional GPU component isolation
        run: python -B tests/test_optional_gpu_runtime.py
      - name: Build bundled Windows API runtime
        shell: pwsh
        run: |
          ./scripts/prepare-windows-api-runtime.ps1 -BuildPython python
          $runtime = (Resolve-Path 'bundled/win-api/python.exe').Path
          & $runtime -c "from PIL import Image; import fastapi, httpx, onnxruntime; print('Windows API dependencies import successfully')"
          if ($LASTEXITCODE -ne 0) { throw 'Windows API dependencies cannot be imported before packaging' }
      - name: Install desktop build tools
        shell: pwsh
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Bundle browser automation runtime
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
          npm ci --prefix tools/commerce-analysis --omit=dev --no-audit --no-fund --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install browser automation runtime' }
      - name: Build DeepSeek Harness runtime
        shell: pwsh
        run: |
          npm install --global pnpm@11.7.0
          node scripts/prepare-harness-runtime.mjs
          node scripts/smoke-harness-runtime.mjs
      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify packaged Windows backend
        shell: pwsh
        run: |
          $appRoot = (Resolve-Path 'dist-package/win-unpacked/resources/app').Path
          node scripts/audit-release-tree.mjs $appRoot
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows app failed privacy audit' }
          $runtime = Join-Path $appRoot 'bundled/win-api/python.exe'
          & $runtime scripts/verify_cpu_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'GPU components must not be included in the default installer' }
          $entry = Join-Path $appRoot 'windows_api_entry.py'
          $oldBackend = Join-Path $appRoot 'bundled/win-api/xiaomei-api.exe'
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw 'Packaged Windows Python runtime is missing' }
          if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'Packaged Windows API entry point is missing' }
          if (Test-Path -LiteralPath $oldBackend) { throw 'The packaged app still contains the old custom API loader' }
          foreach ($relative in 'ComfyUI/tools/comfy-app-bridge/__init__.py','ComfyUI/tools/comfy-app-bridge/web/bridge.js','ComfyUI/tools/comfy-app-bridge/README.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $appRoot $relative) -PathType Leaf)) { throw "Packaged ComfyUI bridge file is missing: $relative" }
          }
          foreach ($relative in 'bundled/node/node.exe','bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js','bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-base/package.json','bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-web-app/package.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $appRoot $relative) -PathType Leaf)) { throw "Packaged Harness file is missing: $relative" }
          }
          node scripts/smoke-harness-runtime.mjs (Join-Path $appRoot 'bundled/deepseek-harness') (Join-Path $appRoot 'bundled/node/node.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Harness Host failed to start' }
          if (-not (Test-Path -LiteralPath (Join-Path $appRoot 'bundled/win-api/python313.zip') -PathType Leaf)) { throw 'Packaged Python standard library is missing' }
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw 'Packaged Python signature is invalid' }

          $dataRoot = Join-Path $env:RUNNER_TEMP "xiaomei-api-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $previous = @{}
          foreach ($name in 'XIAOMEI_CANVAS_PROJECT_ROOT','XIAOMEI_CANVAS_DATA_ROOT','XIAOMEI_CANVAS_SESSION_ID','XIAOMEI_CANVAS_PORT','TEMP','TMP') {
            $previous[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
          }
          $session = [guid]::NewGuid().ToString()
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_PROJECT_ROOT', $appRoot, 'Process')
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_DATA_ROOT', $dataRoot, 'Process')
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_SESSION_ID', $session, 'Process')
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_PORT', '39417', 'Process')
          [Environment]::SetEnvironmentVariable('TEMP', $dataRoot, 'Process')
          [Environment]::SetEnvironmentVariable('TMP', $dataRoot, 'Process')
          $stdout = Join-Path $dataRoot 'api-smoke.stdout.log'
          $stderr = Join-Path $dataRoot 'api-smoke.stderr.log'
          $process = Start-Process -FilePath $runtime -ArgumentList @($entry) -WorkingDirectory $appRoot -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:39417/api/app-info' -TimeoutSec 2
                if ([string]$response.desktop_session_id -eq $session) { $ready = $true; break }
              } catch {}
              if ($process.HasExited) {
                $details = if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw } else { '(no stderr)' }
                throw "Windows API exited before readiness (code $($process.ExitCode)): $details"
              }
            }
            if (-not $ready) { throw 'Packaged Windows API did not answer its health endpoint within 60 seconds' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            foreach ($name in $previous.Keys) { [Environment]::SetEnvironmentVariable($name, $previous[$name], 'Process') }
            Remove-Item -LiteralPath $dataRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Rename Windows package for users
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.displayVersion
          if (-not $version) { $version = $package.version }
          $installer = Get-ChildItem dist-package -Filter '*-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          Rename-Item -LiteralPath $installer.FullName -NewName "小美画布-v$version-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist-package/小美画布-v*-Windows-x64.exe
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release inputs
        env:
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-release-inputs.mjs
      - name: Test desktop update checks and downloads
        run: node --test tests/test_desktop_updater.cjs tests/test_desktop_update_network.cjs tests/test_desktop_update_actions.cjs
      - name: Set desktop build revision
        run: node -e "const fs=require('node:fs'); const pkg=require('./package.json'); pkg.buildRevision=Number(process.env.GITHUB_RUN_NUMBER); fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"
      - name: Build bundled macOS API runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt pyinstaller
          python scripts/verify_cpu_runtime.py
          pyinstaller --onefile --name xiaomei-api main.py --distpath bundled/mac-api --workpath build/mac-api-work --specpath build/mac-api-spec
      - name: Install desktop build tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Bundle browser automation runtime
        run: |
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --prefix tools/commerce-analysis --omit=dev --no-audit --no-fund --ignore-scripts
          mkdir -p bundled/playwright-browsers
          PLAYWRIGHT_BROWSERS_PATH="$PWD/bundled/playwright-browsers" ./tools/commerce-analysis/node_modules/.bin/playwright install chromium
          tar -czf bundled/playwright-browsers.tar.gz -C bundled playwright-browsers
      - name: Build DeepSeek Harness runtime
        run: |
          npm install --global pnpm@11.7.0
          node scripts/prepare-harness-runtime.mjs
          node scripts/smoke-harness-runtime.mjs
      - name: Build macOS packages
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish never
      - name: Verify packaged macOS backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for package in Path('dist-package').glob('*-macOS-*.zip'):
              with ZipFile(package) as archive:
                  for relative in ('bundled/mac-api/xiaomei-api', 'bundled/node/bin/node', 'bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js', 'bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-base/package.json', 'bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-web-app/package.json', 'ComfyUI/tools/comfy-app-bridge/__init__.py', 'ComfyUI/tools/comfy-app-bridge/web/bridge.js', 'ComfyUI/tools/comfy-app-bridge/README.md'):
                      matches = [info for info in archive.infolist() if info.filename.endswith('/Contents/Resources/app/' + relative) and info.file_size > 0]
                      if not matches:
                          raise RuntimeError(f'Packaged macOS file is missing: {relative} in {package.name}')
          PY
          mkdir -p "$RUNNER_TEMP/xiaomei-harness-package-smoke"
          unzip -q dist-package/*-macOS-${{ matrix.arch }}.zip -d "$RUNNER_TEMP/xiaomei-harness-package-smoke"
          APP_ROOT=$(find "$RUNNER_TEMP/xiaomei-harness-package-smoke" -path '*/Contents/Resources/app' -type d -print -quit)
          [ -n "$APP_ROOT" ] || { echo 'Packaged app directory is missing'; exit 1; }
          node scripts/audit-release-tree.mjs "$APP_ROOT"
          tar -tzf "$APP_ROOT/bundled/playwright-browsers.tar.gz" | grep '^playwright-browsers/chromium-' > /dev/null
          NODE=$(find "$RUNNER_TEMP/xiaomei-harness-package-smoke" -path '*/Contents/Resources/app/bundled/node/bin/node' -type f -print -quit)
          [ -n "$NODE" ] || { echo 'Packaged Harness Node is missing'; exit 1; }
          RUNTIME="${NODE%/bundled/node/bin/node}/bundled/deepseek-harness"
          node scripts/smoke-harness-runtime.mjs "$RUNTIME" "$NODE"
      - name: Rename macOS packages for users
        run: |
          VERSION=$(node -p "const pkg=require('./package.json'); pkg.displayVersion || pkg.version")
          mv dist-package/*-macOS-${{ matrix.arch }}.zip "dist-package/小美画布-v${VERSION}-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: dist-package/小美画布-v*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Prepare release manifest
        id: manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DISPLAY_VERSION=$(node -p "const pkg=require('./package.json'); pkg.displayVersion || pkg.version")
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          node scripts/create-release-manifest.mjs \
            --directory release-assets \
            --output release-assets/update.json \
            --version "$VERSION" \
            --display-version "$DISPLAY_VERSION" \
            --build-revision "$GITHUB_RUN_NUMBER" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"
      - name: Replace an earlier failed draft of this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\" and .draft) | .id")
          if [ -n "$release_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: 小美画布 v${{ steps.manifest.outputs.display_version }}
          draft: true
          generate_release_notes: false
          files: |
            release-assets/小美画布-v${{ steps.manifest.outputs.display_version }}-Windows-x64.exe
            release-assets/小美画布-v${{ steps.manifest.outputs.display_version }}-macOS-arm64.zip
            release-assets/update.json
      - name: Label installer assets in Chinese
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DISPLAY_VERSION: ${{ steps.manifest.outputs.display_version }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          [ -n "$release_id" ] || { echo 'Draft Release is missing'; exit 1; }
          for suffix in Windows-x64.exe macOS-arm64.zip; do
            asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              --jq ".assets[] | select(.name | endswith(\"-$suffix\")) | .id")
            [ -n "$asset_id" ] || { echo "Missing release asset: $suffix"; exit 1; }
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -f label="小美画布-v${DISPLAY_VERSION}-${suffix}" > /dev/null
          done
      - name: Keep release body empty
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          DISPLAY_VERSION: ${{ steps.manifest.outputs.display_version }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f tag_name="$RELEASE_TAG" -f name="小美画布 v${DISPLAY_VERSION}" -f body='' > /dev/null
      - name: Verify draft release and attachments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/verify-published-release.mjs release-assets --draft
      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f tag_name="$RELEASE_TAG" -F draft=false -F prerelease=false > /dev/null
      - name: Verify published release and update manifest
        id: public_verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node scripts/verify-published-release.mjs release-assets
      - name: Restore draft when public verification fails
        if: ${{ failure() && steps.public_verify.outcome == 'failure' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -f tag_name="$RELEASE_TAG" -F draft=true > /dev/null

  verify-upgrade-windows:
    needs: publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install previous version and upgrade through its updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $previousPatch = [int]($version.Split('.')[-1]) - 1
          if ($previousPatch -lt 0) { throw 'Previous version number is invalid' }
          $previousTag = 'v1.{0:D2}' -f $previousPatch
          $downloadDir = Join-Path $env:RUNNER_TEMP 'xiaomei-upgrade-previous'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $previous = $releases | Where-Object { -not $_.draft -and -not $_.prerelease -and $_.tag_name -eq $previousTag } | Select-Object -First 1
          if ($previous) {
            gh release download $previousTag --pattern '*Windows-x64.exe' --dir $downloadDir
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download previous Windows installer' }
          } else {
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/desktop-release.yml/runs?branch=$previousTag&per_page=100" | ConvertFrom-Json
            $run = $runs.workflow_runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' } | Sort-Object run_number -Descending | Select-Object -First 1
            $artifact = if ($run) { (gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$($run.id)/artifacts" | ConvertFrom-Json).artifacts | Where-Object { $_.name -eq 'desktop-windows' -and -not $_.expired } | Select-Object -First 1 }
            if ($artifact) {
              gh run download $run.id --name desktop-windows --dir $downloadDir
              if ($LASTEXITCODE -ne 0) { throw 'Cannot download previous Windows build artifact' }
            } else {
              Write-Output "Previous installer artifact is unavailable; rebuilding $previousTag from its retained Git tag"
              git fetch origin "refs/tags/${previousTag}:refs/tags/${previousTag}"
              if ($LASTEXITCODE -ne 0) { throw "Cannot fetch previous source tag $previousTag" }
              $previousSource = Join-Path $env:RUNNER_TEMP 'xiaomei-previous-source'
              git worktree add --detach $previousSource $previousTag
              if ($LASTEXITCODE -ne 0) { throw "Cannot check out previous source tag $previousTag" }
              Push-Location $previousSource
              try {
                ./scripts/prepare-windows-api-runtime.ps1 -BuildPython python
                if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare previous Windows API runtime' }
                npm install --no-audit --no-fund --ignore-scripts
                if ($LASTEXITCODE -ne 0) { throw 'Cannot install previous desktop build tools' }
                npm install --global pnpm@11.7.0
                if ($LASTEXITCODE -ne 0) { throw 'Cannot install previous pnpm build tool' }
                node scripts/prepare-harness-runtime.mjs
                if ($LASTEXITCODE -ne 0) { throw 'Cannot prepare previous Harness runtime' }
                npx electron-builder --win nsis --x64 --publish never
                if ($LASTEXITCODE -ne 0) { throw 'Cannot build previous Windows installer' }
                $rebuilt = Get-ChildItem -LiteralPath 'dist-package' -Filter '*-Setup-x64.exe' -File | Select-Object -First 1
                if (-not $rebuilt) { throw 'Rebuilt previous Windows installer is missing' }
                Copy-Item -LiteralPath $rebuilt.FullName -Destination (Join-Path $downloadDir "xiaomei-$previousTag-Windows-x64.exe")
              } finally { Pop-Location }
            }
          }
          $oldInstaller = Get-ChildItem -LiteralPath $downloadDir -Filter '*Windows-x64.exe' -File | Select-Object -First 1
          if (-not $oldInstaller) { throw 'Previous Windows installer is missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'xiaomei-upgrade-install'
          $oldInstall = Start-Process -FilePath $oldInstaller.FullName -ArgumentList @('/S', "/D=$installDir") -WindowStyle Hidden -Wait -PassThru
          if ($oldInstall.ExitCode -ne 0) { throw "Previous installer failed: $($oldInstall.ExitCode)" }
          $oldAppRoot = Join-Path $installDir 'resources/app'
          if (-not (Test-Path -LiteralPath (Join-Path $oldAppRoot 'desktop/updater.cjs') -PathType Leaf)) { throw 'Previous app did not install' }
          $sentinel = Join-Path $env:LOCALAPPDATA '小美画布/data/preserve.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $sentinel) | Out-Null
          Set-Content -LiteralPath $sentinel -Value 'preserve local data' -Encoding utf8
          $report = Join-Path $env:RUNNER_TEMP 'xiaomei-upgrade-report.json'
          node scripts/verify-upgrade-from-previous.cjs $oldAppRoot $version $report
          if ($LASTEXITCODE -ne 0) { throw 'Previous app did not check or download the new version' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          Write-Output "Installing downloaded version $version (build $($result.buildRevision)) over $($result.oldVersion)"
          $installerDiagnostic = Join-Path $env:RUNNER_TEMP 'xiaomei-installer-diagnostic.txt'
          [Environment]::SetEnvironmentVariable('XIAOMEI_INSTALL_DIAGNOSTIC', $installerDiagnostic, 'Process')
          $newInstall = Start-Process -FilePath $result.installerPath -ArgumentList @('--updated', '/S', "/D=$installDir") -WindowStyle Hidden -PassThru
          if (-not $newInstall.WaitForExit(300000)) {
            $installedPackage = Join-Path $installDir 'resources/app/package.json'
            if (Test-Path -LiteralPath $installedPackage -PathType Leaf) {
              $installed = Get-Content -LiteralPath $installedPackage -Raw | ConvertFrom-Json
              Write-Output "Installer timeout: installed version $($installed.version), build $($installed.buildRevision)"
            } else {
              Write-Output 'Installer timeout: installed package.json is absent'
            }
            Get-CimInstance Win32_Process | Where-Object { $_.Name -match '小美画布|uninstall|powershell|7za|xiaomei' } |
              Select-Object ProcessId, ParentProcessId, Name, ExecutablePath |
              Format-Table -AutoSize | Out-String | Write-Output
            Stop-Process -Id $newInstall.Id -Force -ErrorAction SilentlyContinue
            throw 'New installer did not finish within five minutes'
          }
          if ($newInstall.ExitCode -ne 0) {
            if (Test-Path -LiteralPath $installerDiagnostic -PathType Leaf) {
              Write-Output "Installer stage: $(Get-Content -LiteralPath $installerDiagnostic -Raw)"
            }
            throw "New installer failed: $($newInstall.ExitCode)"
          }
          $newPackage = Get-Content -LiteralPath (Join-Path $installDir 'resources/app/package.json') -Raw | ConvertFrom-Json
          if ($newPackage.version -ne $version -or $newPackage.buildRevision -ne $result.buildRevision) { throw 'Installed version or build revision is wrong after upgrade' }
          if (-not (Test-Path -LiteralPath $sentinel -PathType Leaf)) { throw 'Upgrade removed local user data' }
          Write-Output "Upgraded $($result.oldVersion) to $version (build $($result.buildRevision)); local data preserved"
      - name: Restore draft when upgrade verification fails
        if: ${{ failure() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json | Where-Object { $_.tag_name -eq $env:RELEASE_TAG } | Select-Object -First 1
          if ($release.id) { gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -f tag_name="$env:RELEASE_TAG" -F draft=true | Out-Null }

  cleanup-old-releases:
    needs: [publish, verify-upgrade-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Remove older Releases after upgrade verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name != \"$RELEASE_TAG\") | .id" | while IFS= read -r release_id; do
            [ -n "$release_id" ] || continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done
          remaining=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq 'length')
          [ "$remaining" = 1 ] || { echo "Expected one Release, found $remaining"; exit 1; }
