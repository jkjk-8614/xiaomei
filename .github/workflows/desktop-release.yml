name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Verify release inputs
        shell: pwsh
        run: node scripts/verify-release-inputs.mjs
      - name: Set desktop build revision
        run: node -e "const fs=require('node:fs'); const pkg=require('./package.json'); pkg.buildRevision=Number(process.env.GITHUB_RUN_NUMBER); fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"
      - name: Build bundled Windows API runtime
        shell: pwsh
        run: |
          ./scripts/prepare-windows-api-runtime.ps1 -BuildPython python
          $runtime = (Resolve-Path 'bundled/win-api/python.exe').Path
          & $runtime -c "from PIL import Image; import fastapi, httpx, onnxruntime; print('Windows API dependencies import successfully')"
          if ($LASTEXITCODE -ne 0) { throw 'Windows API dependencies cannot be imported before packaging' }
      - name: Install desktop build tools
        shell: pwsh
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build DeepSeek Harness runtime
        shell: pwsh
        run: |
          npm install --global pnpm@11.7.0
          node scripts/prepare-harness-runtime.mjs
          node scripts/smoke-harness-runtime.mjs
      - name: Build Windows installer
        shell: pwsh
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify packaged Windows backend
        shell: pwsh
        run: |
          $appRoot = (Resolve-Path 'dist-package/win-unpacked/resources/app').Path
          $runtime = Join-Path $appRoot 'bundled/win-api/python.exe'
          $entry = Join-Path $appRoot 'windows_api_entry.py'
          $oldBackend = Join-Path $appRoot 'bundled/win-api/xiaomei-api.exe'
          if (-not (Test-Path -LiteralPath $runtime -PathType Leaf)) { throw 'Packaged Windows Python runtime is missing' }
          if (-not (Test-Path -LiteralPath $entry -PathType Leaf)) { throw 'Packaged Windows API entry point is missing' }
          if (Test-Path -LiteralPath $oldBackend) { throw 'The packaged app still contains the old custom API loader' }
          foreach ($relative in 'bundled/node/node.exe','bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js','bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-base/package.json','bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-web-app/package.json') {
            if (-not (Test-Path -LiteralPath (Join-Path $appRoot $relative) -PathType Leaf)) { throw "Packaged Harness file is missing: $relative" }
          }
          node scripts/smoke-harness-runtime.mjs (Join-Path $appRoot 'bundled/deepseek-harness') (Join-Path $appRoot 'bundled/node/node.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Harness Host failed to start' }
          if (-not (Test-Path -LiteralPath (Join-Path $appRoot 'bundled/win-api/python313.zip') -PathType Leaf)) { throw 'Packaged Python standard library is missing' }
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw 'Packaged Python signature is invalid' }

          $dataRoot = Join-Path $env:RUNNER_TEMP "xiaomei-api-smoke-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $previous = @{}
          foreach ($name in 'XIAOMEI_CANVAS_PROJECT_ROOT','XIAOMEI_CANVAS_DATA_ROOT','XIAOMEI_CANVAS_SESSION_ID','XIAOMEI_CANVAS_PORT','TEMP','TMP') {
            $previous[$name] = [Environment]::GetEnvironmentVariable($name, 'Process')
          }
          $session = [guid]::NewGuid().ToString()
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_PROJECT_ROOT', $appRoot, 'Process')
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_DATA_ROOT', $dataRoot, 'Process')
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_SESSION_ID', $session, 'Process')
          [Environment]::SetEnvironmentVariable('XIAOMEI_CANVAS_PORT', '39417', 'Process')
          [Environment]::SetEnvironmentVariable('TEMP', $dataRoot, 'Process')
          [Environment]::SetEnvironmentVariable('TMP', $dataRoot, 'Process')
          $stdout = Join-Path $dataRoot 'api-smoke.stdout.log'
          $stderr = Join-Path $dataRoot 'api-smoke.stderr.log'
          $process = Start-Process -FilePath $runtime -ArgumentList @($entry) -WorkingDirectory $appRoot -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120; $attempt++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod -Uri 'http://127.0.0.1:39417/api/app-info' -TimeoutSec 2
                if ([string]$response.desktop_session_id -eq $session) { $ready = $true; break }
              } catch {}
              if ($process.HasExited) {
                $details = if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Raw } else { '(no stderr)' }
                throw "Windows API exited before readiness (code $($process.ExitCode)): $details"
              }
            }
            if (-not $ready) { throw 'Packaged Windows API did not answer its health endpoint within 60 seconds' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            foreach ($name in $previous.Keys) { [Environment]::SetEnvironmentVariable($name, $previous[$name], 'Process') }
            Remove-Item -LiteralPath $dataRoot -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Rename Windows package for users
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.displayVersion
          if (-not $version) { $version = $package.version }
          $installer = Get-ChildItem dist-package -Filter '*-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          Rename-Item -LiteralPath $installer.FullName -NewName "小美画布-v$version-Windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist-package/小美画布-v*-Windows-x64.exe
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release inputs
        run: node scripts/verify-release-inputs.mjs
      - name: Set desktop build revision
        run: node -e "const fs=require('node:fs'); const pkg=require('./package.json'); pkg.buildRevision=Number(process.env.GITHUB_RUN_NUMBER); fs.writeFileSync('package.json', JSON.stringify(pkg,null,2)+'\n');"
      - name: Build bundled macOS API runtime
        run: |
          python -m pip install --upgrade pip
          if [ "$(uname -m)" = x86_64 ]; then
            # PaddlePaddle 3.2.2 only publishes macOS arm64 wheels.
            grep -Ev '^(onnxruntime|paddleocr|paddlepaddle)' requirements.txt > /tmp/requirements-macos.txt
            python -m pip install --no-cache-dir -r /tmp/requirements-macos.txt 'onnxruntime==1.23.2' pyinstaller
          else
            grep -v '^onnxruntime-gpu' requirements.txt > /tmp/requirements-macos.txt
            python -m pip install --no-cache-dir -r /tmp/requirements-macos.txt onnxruntime pyinstaller
          fi
          pyinstaller --onefile --name xiaomei-api main.py --distpath bundled/mac-api --workpath build/mac-api-work --specpath build/mac-api-spec
      - name: Install desktop build tools
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build DeepSeek Harness runtime
        run: |
          npm install --global pnpm@11.7.0
          node scripts/prepare-harness-runtime.mjs
          node scripts/smoke-harness-runtime.mjs
      - name: Build macOS packages
        run: npx electron-builder --mac zip --${{ matrix.arch }} --publish never
      - name: Verify packaged macOS backend
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          for package in Path('dist-package').glob('*-macOS-*.zip'):
              with ZipFile(package) as archive:
                  for relative in ('bundled/mac-api/xiaomei-api', 'bundled/node/bin/node', 'bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-desktop-host/lib/index.js', 'bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-base/package.json', 'bundled/deepseek-harness/node_modules/@deepseek-ai/dsh-web-app/package.json'):
                      matches = [info for info in archive.infolist() if info.filename.endswith('/Contents/Resources/app/' + relative) and info.file_size > 0]
                      if not matches:
                          raise RuntimeError(f'Packaged macOS file is missing: {relative} in {package.name}')
          PY
          mkdir -p "$RUNNER_TEMP/xiaomei-harness-package-smoke"
          unzip -q dist-package/*-macOS-${{ matrix.arch }}.zip -d "$RUNNER_TEMP/xiaomei-harness-package-smoke"
          NODE=$(find "$RUNNER_TEMP/xiaomei-harness-package-smoke" -path '*/Contents/Resources/app/bundled/node/bin/node' -type f -print -quit)
          [ -n "$NODE" ] || { echo 'Packaged Harness Node is missing'; exit 1; }
          RUNTIME="${NODE%/bundled/node/bin/node}/bundled/deepseek-harness"
          node scripts/smoke-harness-runtime.mjs "$RUNTIME" "$NODE"
      - name: Rename macOS packages for users
        run: |
          VERSION=$(node -p "const pkg=require('./package.json'); pkg.displayVersion || pkg.version")
          mv dist-package/*-macOS-${{ matrix.arch }}.zip "dist-package/小美画布-v${VERSION}-macOS-${{ matrix.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: dist-package/小美画布-v*-macOS-${{ matrix.arch }}.zip
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Prepare release manifest
        id: manifest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DISPLAY_VERSION=$(node -p "const pkg=require('./package.json'); pkg.displayVersion || pkg.version")
          echo "display_version=$DISPLAY_VERSION" >> "$GITHUB_OUTPUT"
          node scripts/create-release-manifest.mjs \
            --directory release-assets \
            --output release-assets/update.json \
            --version "$VERSION" \
            --display-version "$DISPLAY_VERSION" \
            --build-revision "$GITHUB_RUN_NUMBER" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY"
      - name: Remove assets from an earlier build of this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            asset_ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.assets[].id')
            while IFS= read -r asset_id; do
              [ -n "$asset_id" ] || continue
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done <<< "$asset_ids"
          fi
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: 小美画布v${{ steps.manifest.outputs.display_version }}
          body: |
            小美画布正式版。

            下载对应平台的安装包：Windows 或 macOS（Intel / Apple 芯片）。
          generate_release_notes: false
          files: |
            release-assets/小美画布-v${{ steps.manifest.outputs.display_version }}-Windows-x64.exe
            release-assets/小美画布-v${{ steps.manifest.outputs.display_version }}-macOS-x64.zip
            release-assets/小美画布-v${{ steps.manifest.outputs.display_version }}-macOS-arm64.zip
            release-assets/update.json
      - name: Keep only the newly published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq update.json
          while IFS= read -r tag; do
            if [ "$tag" != "$RELEASE_TAG" ]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
